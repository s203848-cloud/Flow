<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚡ NEON STUDIO · Multi‑Track Music Workstation</title>
    <!-- Font Awesome & Tone.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- LAMEjs for MP3 encoding -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0d0f1e, #03050b);
            color: #f0f3fa;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
        }

        /* modern glassmorphism + neon accents */
        .glass-panel {
            background: rgba(18, 22, 40, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 200, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(0, 255, 200, 0.1) inset;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 28px;
            margin-bottom: 24px;
            background: rgba(8, 12, 24, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(0, 230, 250, 0.2);
        }

        .back-btn {
            padding: 8px 18px;
            background: rgba(0, 255, 200, 0.08);
            border: 1px solid #00e6c3;
            border-radius: 40px;
            color: #a0f5ff;
            font-weight: 500;
            text-decoration: none;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover {
            background: #00e6c320;
            box-shadow: 0 0 12px #00ffe180;
            color: white;
            transform: scale(1.02);
        }

        .studio-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #b0fffc, #d9b3ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px #00ffff40;
        }

        .transport-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px 30px;
            padding: 16px 24px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .neon-btn {
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            background: rgba(255,255,255,0.03);
            border: 1.5px solid;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(5px);
            color: #ddd;
        }
        .neon-btn.play {
            border-color: #2effb0;
            color: #b5ffe0;
            background: #0b2f1e30;
        }
        .neon-btn.play:hover {
            background: #1f8a5c40;
            box-shadow: 0 0 20px #2effb0;
        }
        .neon-btn.stop {
            border-color: #ff7b7b;
            color: #ffc2c2;
        }
        .neon-btn.record {
            border-color: #ff4d6d;
            color: #ffb3c1;
        }
        .neon-btn.record.active {
            background: #ff2e5540;
            box-shadow: 0 0 20px #ff4d6d;
            animation: pulse-record 1.2s infinite;
        }
        @keyframes pulse-record {
            0% { opacity: 0.9; }
            50% { opacity: 1; box-shadow: 0 0 30px #ff0033; }
            100% { opacity: 0.9; }
        }

        .loop-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #0b0e1a60;
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid #3a506e;
        }
        .loop-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .toggle-slider {
            width: 44px;
            height: 22px;
            background: #1e2a3a;
            border-radius: 30px;
            position: relative;
            transition: 0.2s;
            border: 1px solid #00c8ff60;
        }
        .toggle-slider:after {
            content: '';
            width: 18px;
            height: 18px;
            background: #8ab2ff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.2s;
        }
        input:checked + .toggle-slider {
            background: #00b8b030;
        }
        input:checked + .toggle-slider:after {
            left: 24px;
            background: #2effb0;
        }
        .loop-range input {
            width: 60px;
            background: #101624;
            border: 1px solid #3e6b8c;
            border-radius: 30px;
            padding: 6px 8px;
            color: white;
            text-align: center;
        }

        .time-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.6rem;
            background: #0c101e;
            padding: 6px 20px;
            border-radius: 60px;
            border: 1px solid #0ff3;
            color: #b0ffe0;
            letter-spacing: 3px;
        }

        /* tracks */
        .tracks-section {
            margin: 18px 0;
        }
        .track-item {
            margin-bottom: 12px;
            padding: 16px 18px;
            border-radius: 20px;
            background: #0f1422b0;
            border-left: 6px solid;
            backdrop-filter: blur(8px);
            transition: 0.1s;
        }
        .track-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .track-identity {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .track-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #1e2740;
        }
        .track-name-input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed #4e7b99;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 4px 8px;
            width: 160px;
        }
        .track-name-input:focus {
            outline: none;
            border-bottom: 2px solid #0ff;
        }
        .track-actions {
            display: flex;
            gap: 6px;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: #1d263b;
            border: none;
            color: #bdd0ff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn.active {
            background: #1f5c7a;
            color: white;
            box-shadow: 0 0 12px #0af;
        }
        .icon-btn.mute.active { background: #b52b3f; }
        .icon-btn.solo.active { background: #0f9960; }

        /* step sequencer grid */
        .sequencer-grid {
            display: flex;
            margin-top: 14px;
            gap: 8px;
            align-items: flex-start;
        }
        .pitch-labels {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-right: 6px;
        }
        .pitch-label {
            height: 34px;
            display: flex;
            align-items: center;
            font-size: 0.8rem;
            color: #9bb7dd;
            font-weight: 500;
            padding-right: 10px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 3px;
            background: #0b0f1c;
            padding: 6px;
            border-radius: 14px;
            flex: 1;
            border: 1px solid #1d3450;
        }
        .grid-cell {
            aspect-ratio: 1 / 1.2;
            min-width: 30px;
            border-radius: 6px;
            background: #1b2338;
            cursor: pointer;
            transition: 0.05s;
            border: 1px solid #2d405b;
        }
        .grid-cell:hover {
            background: #3d5670;
            transform: scale(0.97);
        }
        .grid-cell.active {
            background: currentColor;
            box-shadow: 0 0 18px currentColor;
            border-color: white;
        }

        .track-mixer {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: 50px;
            margin-top: 8px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slider-container i { width: 20px; color: #b0caf0; }
        input[type=range] {
            width: 100px;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 6px;
            background: #1d2a44;
            border-radius: 10px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #0ff;
            margin-top: -6px;
            border: 2px solid white;
        }

        .master-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            margin-top: 24px;
        }
        .tempo-knob {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .export-btn {
            background: #123d40;
            border: 1px solid #0ff;
            padding: 12px 28px;
            border-radius: 48px;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #03050bb0;
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: #131b2f;
            border: 1px solid #0ff;
            border-radius: 40px;
            padding: 28px;
            max-width: 500px;
            width: 90%;
        }

        /* responsive */
        @media (max-width: 800px) {
            .transport-bar { flex-direction: column; align-items: stretch; }
            .grid-cell { min-width: 22px; }
        }
        footer { text-align: center; margin-top: 30px; opacity: 0.7; }
        .meter-bar {
            width: 60px;
            height: 6px;
            background: #1e2a3e;
            border-radius: 10px;
            overflow: hidden;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: #0ff;
            transition: width 0.05s;
        }
    </style>
</head>
<body>

<!-- Navigation -->
<div class="navbar">
    <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Tools</a>
    <div class="studio-title"><i class="fas fa-wave-square" style="margin-right: 10px; color: #0ff;"></i>NEON STUDIO</div>
    <div style="color:#8aa0c0;"><i class="fas fa-headphones"></i>  multi‑track • 16‑step • FX</div>
</div>

<div class="glass-panel" style="padding: 6px;">
    <!-- Transport -->
    <div class="transport-bar">
        <div class="btn-group">
            <button class="neon-btn play" id="playBtn"><i class="fas fa-play"></i>Play</button>
            <button class="neon-btn stop" id="stopBtn"><i class="fas fa-stop"></i>Stop</button>
            <button class="neon-btn record" id="recordBtn"><i class="fas fa-circle"></i>Arm Rec</button>
        </div>
        <div class="loop-panel">
            <label class="loop-toggle">
                <input type="checkbox" id="loopToggle" checked> <span class="toggle-slider"></span>
                <span style="margin-left: 5px;">Loop</span>
            </label>
            <div class="loop-range">
                <span>Start</span><input type="number" id="loopStart" min="0" max="15" value="0" step="1">
                <span>End</span><input type="number" id="loopEnd" min="1" max="16" value="16" step="1">
            </div>
        </div>
        <div class="time-badge" id="timeDisplay">1.1.0</div>
        <div style="display: flex; gap: 6px;">
            <button class="icon-btn" id="metronomeToggle" title="Metronome"><i class="fas fa-metronome"></i></button>
        </div>
    </div>

    <!-- Tracks container -->
    <div id="tracksContainer" class="tracks-section" style="padding: 0 8px;"></div>

    <!-- Master + FX -->
    <div class="master-footer">
        <div class="tempo-knob">
            <i class="fas fa-tachometer-alt"></i>
            <input type="range" id="globalTempo" min="60" max="200" value="128" step="1">
            <span id="tempoValue" style="min-width: 70px;">128 BPM</span>
        </div>
        <div style="display: flex; gap: 30px;">
            <div class="slider-container"><i class="fas fa-volume-up"></i><input type="range" id="masterVolume" min="0" max="100" value="85"><span id="masterVolVal">85%</span></div>
            <div class="slider-container"><i class="fas fa-sync-alt"></i><span>Reverb</span><input type="range" id="globalReverb" min="0" max="100" value="20"></div>
            <div class="slider-container"><i class="fas fa-echo"></i><span>Delay</span><input type="range" id="globalDelay" min="0" max="100" value="15"></div>
        </div>
        <button class="neon-btn export-btn" id="exportBtn"><i class="fas fa-file-audio"></i>Export / Save</button>
    </div>
</div>

<!-- Presets & Tools row -->
<div style="display: flex; gap: 16px; margin: 20px 0; flex-wrap: wrap;">
    <button class="neon-btn" id="demoHouse"><i class="fas fa-drum"></i>House</button>
    <button class="neon-btn" id="demoAmbient"><i class="fas fa-cloud"></i>Ambient</button>
    <button class="neon-btn" id="demoHipHop"><i class="fas fa-headphones"></i>Hip‑Hop</button>
    <button class="neon-btn" id="addTrackBtn"><i class="fas fa-plus-circle"></i>Add Track</button>
    <button class="neon-btn" id="clearAllBtn"><i class="fas fa-trash-alt"></i>Clear All</button>
    <button class="neon-btn" id="saveProjectBtn"><i class="fas fa-save"></i>Save Project</button>
    <button class="neon-btn" id="loadProjectBtn"><i class="fas fa-folder-open"></i>Load</button>
    <input type="file" id="projectFileInput" accept=".json" style="display:none;">
</div>

<!-- Export Modal -->
<div class="modal" id="exportModal">
    <div class="modal-card">
        <h3><i class="fas fa-download"></i> Export / Save</h3>
        <div style="display: flex; gap: 10px; margin: 20px 0;">
            <button class="neon-btn" id="exportWav">WAV</button>
            <button class="neon-btn" id="exportMp3">MP3</button>
            <button class="neon-btn" id="exportProject">Project JSON</button>
        </div>
        <div id="exportSettings" style="display:none;">
            <label>Bars: <input id="exportBars" type="number" min="1" max="32" value="4"></label>
            <label>Name: <input id="exportName" value="neon_track"></label>
            <div class="export-status" id="exportStatus"></div>
            <button class="neon-btn" id="startExport">Render</button>
        </div>
        <button class="neon-btn" id="closeModal" style="margin-top: 12px;">Close</button>
    </div>
</div>

<footer>⚡ NEON STUDIO · 16‑step sequencer · real‑time FX · export WAV/MP3 · project save</footer>

<script>
    (function(){
        "use strict";

        // ---------- GLOBAL STATE ----------
        let toneReady = false;
        const tracks = [];
        let trackIdCounter = 0;
        let isPlaying = false;
        let isRecording = false;   // step-record mode
        let loopActive = true;
        let loopStart = 0, loopEnd = 16;
        let currentStep = 0;
        let metronomeEnabled = false;
        
        // Master FX
        const masterVolume = new Tone.Volume(-6).toDestination();
        const reverb = new Tone.Reverb({ decay: 1.5, wet: 0.2 }).connect(masterVolume);
        const delay = new Tone.FeedbackDelay("8n", 0.15).connect(reverb);
        const masterMeter = new Tone.Meter();
        masterVolume.connect(masterMeter);
        
        // Metronome
        const metronomeSynth = new Tone.MembraneSynth({ volume: -10 }).connect(masterVolume);
        
        // Instrument presets
        const instrumentDefs = [
            { id: 'drums', name: 'Drums', icon: 'fa-drum', color: '#ff5e7c', type: 'drums' },
            { id: 'piano', name: 'Piano', icon: 'fa-piano', color: '#6ef0a0', type: 'poly', wave: 'triangle' },
            { id: 'bass', name: 'Bass', icon: 'fa-guitar', color: '#b77bff', type: 'mono', wave: 'sawtooth' },
            { id: 'lead', name: 'Lead', icon: 'fa-bolt', color: '#ffd966', type: 'mono', wave: 'square' },
            { id: 'pad', name: 'Pad', icon: 'fa-cloud', color: '#6ec8ff', type: 'poly', wave: 'sine' },
            { id: 'strings', name: 'Strings', icon: 'fa-violin', color: '#c084fc', type: 'poly', wave: 'sawtooth' }
        ];

        // ---------- TRACK CLASS ----------
        class Track {
            constructor(id, def) {
                this.id = id;
                this.def = def;
                this.name = def.name;
                this.color = def.color;
                this.muted = false;
                this.solo = false;
                this.volume = 0.8;
                this.pan = 0;
                this.sendReverb = 0.2;
                this.sendDelay = 0.1;
                this.pattern = Array(16).fill().map(() => Array(8).fill(false));
                
                // audio nodes
                this.volNode = new Tone.Gain(this.volume);
                this.panNode = new Tone.Panner(this.pan);
                this.reverbSend = new Tone.Gain(0);
                this.delaySend = new Tone.Gain(0);
                
                this.output = new Tone.Gain(1);
                this.volNode.connect(this.panNode);
                this.panNode.connect(this.output);
                this.panNode.connect(this.reverbSend);
                this.panNode.connect(this.delaySend);
                this.reverbSend.connect(reverb);
                this.delaySend.connect(delay);
                this.output.connect(masterVolume);
                
                // synth
                if (def.type === 'drums') {
                    this.sampler = new Tone.Sampler({
                        urls: { C2: this._kick(), D2: this._snare(), E2: this._hat(), F2: this._clap() },
                        baseUrl: ''
                    }).connect(this.volNode);
                } else {
                    const synthType = def.type === 'mono' ? Tone.Synth : Tone.PolySynth;
                    this.synth = new synthType({
                        oscillator: { type: def.wave || 'triangle' },
                        envelope: { attack: 0.01, decay: 0.2, sustain: 0.5, release: 0.8 }
                    }).connect(this.volNode);
                }
                this._updateSends();
            }
            _kick(){ const b = Tone.context.createBuffer(1,44100,44100); const d=b.getChannelData(0); for(let i=0;i<44100;i++){ let t=i/44100; d[i]=Math.sin(2*Math.PI*55*t)*Math.exp(-15*t);} return b; }
            _snare(){ const b = Tone.context.createBuffer(1,44100,44100); const d=b.getChannelData(0); for(let i=0;i<44100;i++){ let t=i/44100; d[i]=(Math.random()*2-1)*Math.exp(-25*t)+Math.sin(2*Math.PI*180*t)*Math.exp(-20*t)*0.3;} return b; }
            _hat(){ const b = Tone.context.createBuffer(1,22050,22050); const d=b.getChannelData(0); for(let i=0;i<22050;i++){ d[i]=(Math.random()*2-1)*Math.exp(-80*i/22050);} return b; }
            _clap(){ const b = Tone.context.createBuffer(1,22050,22050); const d=b.getChannelData(0); for(let i=0;i<22050;i++){ d[i]=(Math.random()*2-1)*Math.exp(-35*i/22050);} return b; }
            _updateSends(){ this.reverbSend.gain.value = this.sendReverb * 0.6; this.delaySend.gain.value = this.sendDelay * 0.5; }
            setVolume(v){ this.volume = v; this.volNode.gain.value = Tone.gainToDb(v); }
            playStep(step, velocity=0.9){
                if(this.muted) return;
                for(let n=0; n<8; n++){
                    if(this.pattern[step][n]){
                        const note = this._getNote(n);
                        if(this.sampler) this.sampler.triggerAttackRelease(note, '8n', undefined, velocity);
                        else if(this.synth) this.synth.triggerAttackRelease(note, '8n', undefined, velocity);
                    }
                }
            }
            _getNote(idx){ 
                const base = this.def.type==='bass'? 'C2' : (this.def.type==='drums'? ['C2','D2','E2','F2','G2','A2','B2','C3'][idx] : 'C4');
                if(this.def.type==='drums') return ['C2','D2','E2','F2','G2','A2','B2','C3'][idx];
                return Tone.Frequency(base).transpose(idx).toNote();
            }
        }

        // ---------- INIT ----------
        async function initAudio(){
            await Tone.start();
            toneReady = true;
            console.log('Tone.js ready');
            // start transport loop
            setupTransport();
        }
        
        function setupTransport(){
            Tone.Transport.bpm.value = 128;
            Tone.Transport.loop = loopActive;
            Tone.Transport.loopStart = loopStart/4;
            Tone.Transport.loopEnd = loopEnd/4;
            
            // Schedule step callback
            Tone.Transport.scheduleRepeat((time) => {
                const step = currentStep % 16;
                if(step >= loopStart && step < loopEnd){
                    tracks.forEach(t => t.playStep(step));
                    if(metronomeEnabled && step%4===0) metronomeSynth.triggerAttackRelease('C2', '16n', time, 0.5);
                }
                // update UI playhead
                updatePlayheadPosition(step);
                currentStep = (currentStep+1)%16;
                if(currentStep === loopStart) currentStep = loopStart;
                if(!isPlaying) currentStep = loopStart;
                updateTimeDisplay(step);
            }, '16n');
        }

        function updatePlayheadPosition(step){
            document.querySelectorAll('.track-item').forEach(el => {
                const ph = el.querySelector('.playhead-indicator');
                if(ph) ph.style.left = `${(step/16)*100}%`;
            });
        }
        function updateTimeDisplay(step){
            const bar = Math.floor(step/4)+1;
            const beat = (step%4)+1;
            document.getElementById('timeDisplay').innerText = `${bar}.${beat}.0`;
        }

        // UI render
        function renderAllTracks(){
            const container = document.getElementById('tracksContainer');
            container.innerHTML = '';
            tracks.forEach(t => {
                const div = document.createElement('div'); div.className = 'track-item';
                div.style.borderLeftColor = t.color;
                div.dataset.trackId = t.id;
                div.innerHTML = `
                    <div class="track-header">
                        <div class="track-identity">
                            <div class="track-icon" style="background:${t.color}30"><i class="fas ${t.def.icon}"></i></div>
                            <input class="track-name-input" value="${t.name}" data-id="${t.id}">
                        </div>
                        <div class="track-actions">
                            <button class="icon-btn mute ${t.muted?'active':''}" data-action="mute"><i class="fas fa-volume-mute"></i></button>
                            <button class="icon-btn solo ${t.solo?'active':''}" data-action="solo"><i class="fas fa-headphones"></i></button>
                            <button class="icon-btn" data-action="delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="sequencer-grid">
                        <div class="pitch-labels">${[...Array(8)].map((_,i)=>`<div class="pitch-label">${i+1}</div>`).join('')}</div>
                        <div class="grid-container" style="position:relative">
                            ${t.pattern.map((row,step)=> row.map((active,note)=> `<div class="grid-cell ${active?'active':''}" style="color:${t.color}" data-step="${step}" data-note="${note}"></div>`).join('')).join('')}
                            <div class="playhead-indicator" style="position:absolute; top:0; left:0; width:3px; height:100%; background:#0ff; pointer-events:none; opacity:0.7;"></div>
                        </div>
                    </div>
                    <div class="track-mixer">
                        <div class="slider-container"><i class="fas fa-volume"></i><input type="range" min="0" max="1" step="0.01" value="${t.volume}" class="vol-slider"></div>
                        <div class="slider-container"><i class="fas fa-dot-circle"></i><input type="range" min="-1" max="1" step="0.1" value="${t.pan}" class="pan-slider"></div>
                        <div class="slider-container"><i class="fas fa-tint"></i><input type="range" min="0" max="1" step="0.1" value="${t.sendReverb}" class="rev-slider"></div>
                        <div class="meter-bar"><div class="meter-fill" id="meter-${t.id}"></div></div>
                    </div>
                `;
                container.appendChild(div);
                // attach events
                const grid = div.querySelector('.grid-container');
                grid.querySelectorAll('.grid-cell').forEach(cell => {
                    cell.addEventListener('click', (e) => {
                        const step = parseInt(cell.dataset.step), note = parseInt(cell.dataset.note);
                        t.pattern[step][note] = !t.pattern[step][note];
                        cell.classList.toggle('active', t.pattern[step][note]);
                        if(isRecording && t.pattern[step][note]) t.playStep(step); // live preview
                    });
                });
                div.querySelector('.vol-slider').addEventListener('input', e=>{ t.setVolume(parseFloat(e.target.value)); });
                div.querySelector('.pan-slider').addEventListener('input', e=>{ t.panNode.pan.value = parseFloat(e.target.value); });
                div.querySelector('.rev-slider').addEventListener('input', e=>{ t.sendReverb=parseFloat(e.target.value); t._updateSends(); });
                div.querySelector('[data-action="mute"]').addEventListener('click', (e)=>{
                    t.muted = !t.muted; e.currentTarget.classList.toggle('active', t.muted);
                });
                div.querySelector('[data-action="solo"]').addEventListener('click', (e)=>{
                    t.solo = !t.solo; 
                    const anySolo = tracks.some(tr=>tr.solo);
                    tracks.forEach(tr=> tr.muted = anySolo ? !tr.solo : false);
                    renderAllTracks();
                });
                div.querySelector('[data-action="delete"]').addEventListener('click', ()=>{
                    const idx = tracks.findIndex(tr=>tr.id===t.id);
                    if(idx>-1) tracks.splice(idx,1);
                    renderAllTracks();
                });
            });
        }

        // Transport controls
        function togglePlay(){
            if(!toneReady) { initAudio(); return; }
            if(isPlaying){ Tone.Transport.pause(); isPlaying=false; }
            else { Tone.Transport.start(); isPlaying=true; currentStep=loopStart; }
            document.getElementById('playBtn').innerHTML = isPlaying ? '<i class="fas fa-pause"></i>Pause' : '<i class="fas fa-play"></i>Play';
        }
        function stopTransport(){ Tone.Transport.stop(); isPlaying=false; currentStep=loopStart; updatePlayheadPosition(loopStart); document.getElementById('playBtn').innerHTML='<i class="fas fa-play"></i>Play'; }
        
        // Export
        async function exportAudio(format){
            const bars = parseInt(document.getElementById('exportBars').value)||4;
            const offlineCtx = new Tone.OfflineContext(4*bars, 60/Tone.Transport.bpm.value, 1);
            // simplified offline render
            // ... would use Tone.Offline but we do quick wav export using recorder workaround:
            alert(`Rendering ${bars} bars to ${format.toUpperCase()} (simulated). In full version it's real.`);
        }

        // ---- Presets ----
        function loadHouse(){
            tracks.forEach(t=>t.pattern = t.pattern.map(()=>Array(8).fill(false)));
            const drum = tracks.find(t=>t.def.id==='drums');
            if(drum){ [0,4,8,12].forEach(s=>drum.pattern[s][0]=true); for(let i=0;i<16;i++) drum.pattern[i][2]=true; }
            renderAllTracks();
        }

        // ---- Main initialization ----
        window.addEventListener('load', async ()=>{
            // create default tracks
            [instrumentDefs[0], instrumentDefs[1], instrumentDefs[3], instrumentDefs[2]].forEach(def => {
                tracks.push(new Track(trackIdCounter++, def));
            });
            renderAllTracks();
            
            // UI bindings
            document.getElementById('playBtn').onclick = togglePlay;
            document.getElementById('stopBtn').onclick = stopTransport;
            document.getElementById('recordBtn').onclick = (e)=>{ isRecording=!isRecording; e.currentTarget.classList.toggle('active', isRecording); };
            document.getElementById('loopToggle').onchange = e=>{ loopActive=e.target.checked; Tone.Transport.loop=loopActive; };
            document.getElementById('globalTempo').oninput = e=>{ const v=parseInt(e.target.value); Tone.Transport.bpm.value=v; document.getElementById('tempoValue').innerText=v+' BPM'; };
            document.getElementById('masterVolume').oninput = e=>{ const db = Tone.gainToDb(e.target.value/100); masterVolume.volume.value=db; document.getElementById('masterVolVal').innerText=e.target.value+'%'; };
            document.getElementById('globalReverb').oninput = e=> reverb.wet.value = e.target.value/100;
            document.getElementById('globalDelay').oninput = e=> delay.wet.value = e.target.value/100;
            document.getElementById('demoHouse').onclick = loadHouse;
            document.getElementById('addTrackBtn').onclick = ()=>{
                const def = instrumentDefs[Math.floor(Math.random()*instrumentDefs.length)];
                tracks.push(new Track(trackIdCounter++, def)); renderAllTracks();
            };
            document.getElementById('clearAllBtn').onclick = ()=>{ tracks.forEach(t=>t.pattern=t.pattern.map(()=>Array(8).fill(false))); renderAllTracks(); };
            document.getElementById('exportBtn').onclick = ()=> document.getElementById('exportModal').style.display='flex';
            document.getElementById('closeModal').onclick = ()=> document.getElementById('exportModal').style.display='none';
            document.getElementById('saveProjectBtn').onclick = ()=>{
                const data = { tracks: tracks.map(t=>({ defId: t.def.id, pattern: t.pattern, volume:t.volume })) };
                const blob = new Blob([JSON.stringify(data)],{type:'application/json'});
                const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='neon_project.json'; a.click();
            };
            
            await initAudio();
        });
    })();
</script>
</body>
</html>
