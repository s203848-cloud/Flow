<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrument Tuner · pitch detection</title>
<link rel="icon" type="image/x-icon" href="favcon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #fff;
            min-height: 100vh;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* main card container */
        .tuner-container {
            max-width: 700px;
            width: 100%;
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 128, 0, 0.25);
            border-radius: 2rem;
            padding: 2rem 1.5rem;
            margin-top: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,128,0,0.1) inset;
        }

        .navbar {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 0.5rem;
        }
        
        .back-btn {
            padding: 8px 18px;
            background: rgba(255, 128, 0, 0.08);
            border: 1px solid #ff8000;
            border-radius: 40px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }
        
        .back-btn:hover {
            background: rgba(255, 128, 0, 0.2);
            border-color: #ffa233;
            color: #ffa233;
            transform: translateX(-2px);
        }

        h1 {
            font-weight: 500;
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            text-shadow: 0 2px 5px rgba(255,128,0,0.3);
        }
        h1 i {
            color: #ff8000;
            font-size: 2rem;
        }

        .subhead {
            color: #b9b9d0;
            margin-bottom: 2rem;
            border-left: 4px solid #ff8000;
            padding-left: 1rem;
            font-weight: 300;
            font-size: 1.1rem;
        }

        /* main display panel */
        .note-panel {
            background: rgba(0,0,0,0.35);
            border-radius: 2.5rem;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(255,128,0,0.25);
            box-shadow: 0 8px 0 rgba(0,0,0,0.3);
        }

        .detected-note {
            text-align: center;
            margin-bottom: 2rem;
        }
        .note-name {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            color: #fff;
            text-shadow: 0 0 15px #ff8000, 0 0 30px rgba(255,128,0,0.4);
            letter-spacing: 4px;
        }
        .note-detail {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 0.5rem;
            font-size: 1.3rem;
            color: #cccae6;
        }
        .note-detail span {
            background: rgba(255,128,0,0.1);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255,128,0,0.3);
            font-weight: 400;
        }
        .note-detail i {
            color: #ff8000;
            margin-right: 6px;
        }

        /* cent deviation meter */
        .meter-container {
            margin: 2rem 0 1.5rem;
        }
        .meter-label {
            display: flex;
            justify-content: space-between;
            font-weight: 400;
            color: #ffd5aa;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .meter-bar-bg {
            background: #23233a;
            height: 16px;
            border-radius: 50px;
            border: 1px solid #ff8000;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .meter-fill {
            width: 50%; /* will be set by js */
            height: 100%;
            background: linear-gradient(90deg, #ff8000, #ffb05c);
            border-radius: 50px;
            transition: width 0.08s ease;
            box-shadow: 0 0 12px #ff8000;
        }
        .cents-readout {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 500;
            color: #ffb469;
            margin: 10px 0 0;
        }
        .cents-readout small {
            font-size: 1rem;
            color: #aaaacb;
        }

        .status-area {
            background: rgba(255,128,0,0.05);
            border-radius: 40px;
            padding: 1.2rem 1.8rem;
            margin: 2rem 0 1rem;
            border: 1px dashed rgba(255,128,0,0.4);
            font-size: 1rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
        }
        .mic-permission {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .btn {
            background: transparent;
            border: 2px solid #ff8000;
            color: #ff8000;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
            backdrop-filter: blur(4px);
        }
        .btn:hover {
            background: #ff8000;
            color: #0a0a1a;
            box-shadow: 0 0 18px #ff8000;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn.stop {
            border-color: #aaa;
            color: #ccc;
        }
        .btn.stop:hover {
            background: #ff3333;
            border-color: #ff3333;
            color: white;
            box-shadow: 0 0 18px #ff3333;
        }
        .error-message {
            color: #ff7b7b;
            font-weight: 400;
            background: rgba(180,0,0,0.2);
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            border-left: 4px solid #ff4444;
        }

        footer {
            margin-top: 1.8rem;
            font-size: 0.8rem;
            color: #6a6a8b;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Tuner · back to tools</a>
    </div>

    <div class="tuner-container">
        <h1>
            <i class="fas fa-music"></i> 
            Instrument Tuner
        </h1>
        <div class="subhead">
            <i class="fas fa-microphone-alt" style="color: #ff8000;"></i> 
            microphone pitch detection · guitar, violin, voice
        </div>

        <!-- main tuner panel -->
        <div class="note-panel">
            <div class="detected-note">
                <div class="note-name" id="noteDisplay">A♯</div>
                <div class="note-detail">
                    <span><i class="fas fa-wave-square"></i> <span id="freqDisplay">440.0</span> Hz</span>
                    <span><i class="fas fa-balance-scale"></i> <span id="centsDisplay">0</span> ¢</span>
                </div>
            </div>

            <!-- visual cents meter -->
            <div class="meter-container">
                <div class="meter-label">
                    <span><i class="fas fa-arrow-down"></i> 50¢ flat</span>
                    <span><i class="fas fa-check-circle" style="color:#ff8000;"></i> in tune</span>
                    <span>50¢ sharp <i class="fas fa-arrow-up"></i></span>
                </div>
                <div class="meter-bar-bg">
                    <div class="meter-fill" id="meterFill" style="width: 50%;"></div>
                </div>
                <div class="cents-readout" id="centsLarge">+0 ¢</div>
            </div>

            <!-- control & status -->
            <div class="status-area">
                <div class="mic-permission">
                    <i class="fas fa-circle" style="color: #ff8000; font-size: 0.7rem;" id="liveIndicator"></i>
                    <span id="micStatus">⏸️ idle · click start</span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" id="startBtn"><i class="fas fa-play"></i> Start</button>
                    <button class="btn stop" id="stopBtn" disabled><i class="fas fa-stop"></i> Stop</button>
                </div>
            </div>
            <div id="errorBox" class="error-message" style="display: none;"></div>
        </div>

        <footer>
            ⓘ A4 = 440 Hz · equal temperament · works best in quiet environment
        </footer>
    </div>

    <script>
        (function(){
            // ----- tuner state -----
            let audioContext = null;
            let analyser = null;
            let mediaStream = null;
            let source = null;
            let isRunning = false;
            let animationFrame = null;

            // DOM elements
            const noteDisplay = document.getElementById('noteDisplay');
            const freqDisplay = document.getElementById('freqDisplay');
            const centsDisplay = document.getElementById('centsDisplay');
            const centsLarge = document.getElementById('centsLarge');
            const meterFill = document.getElementById('meterFill');
            const micStatus = document.getElementById('micStatus');
            const liveIndicator = document.getElementById('liveIndicator');
            const errorBox = document.getElementById('errorBox');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');

            // pitch detection constants
            const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const A4_FREQ = 440.0;
            const SAMPLE_RATE = 44100;     // will match context
            const MIN_FREQ = 75.0;           // low E guitar ~82Hz, allow a bit lower
            const MAX_FREQ = 1200.0;          // high violin etc
            const MIN_VOLUME_THRESHOLD = 0.005; // RMS threshold to avoid noise

            // utility: hide error
            function hideError() {
                errorBox.style.display = 'none';
            }
            function showError(msg) {
                errorBox.style.display = 'block';
                errorBox.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${msg}`;
            }

            // ----- pitch detection: autocorrelation with parabolic interpolation -----
            function detectPitch(timeData, sampleRate) {
                // timeData is Float32Array between -1 and 1
                const len = timeData.length;

                // compute RMS (volume) to filter out silence
                let rms = 0;
                for (let i = 0; i < len; i++) {
                    rms += timeData[i] * timeData[i];
                }
                rms = Math.sqrt(rms / len);
                if (rms < MIN_VOLUME_THRESHOLD) return null; // too quiet

                // autocorrelation
                const minLag = Math.floor(sampleRate / MAX_FREQ);
                const maxLag = Math.ceil(sampleRate / MIN_FREQ);
                let bestLag = 0;
                let bestCorr = -Infinity;

                for (let lag = minLag; lag <= maxLag; lag++) {
                    let correlation = 0;
                    for (let i = 0; i < len - lag; i++) {
                        correlation += timeData[i] * timeData[i + lag];
                    }
                    // normalize by length (optional) – but we just compare peaks
                    if (correlation > bestCorr) {
                        bestCorr = correlation;
                        bestLag = lag;
                    }
                }

                if (bestLag === 0) return null;

                // parabolic interpolation around the peak for better accuracy
                if (bestLag > minLag && bestLag < maxLag) {
                    const y1 = bestCorr;
                    const y0 = 0; // placeholder, we need values at lag-1, lag+1
                    // recompute correlations for neighbors (simplified but okay)
                    let corrPrev = 0, corrNext = 0;
                    for (let i = 0; i < len - (bestLag - 1); i++) {
                        corrPrev += timeData[i] * timeData[i + bestLag - 1];
                    }
                    for (let i = 0; i < len - (bestLag + 1); i++) {
                        corrNext += timeData[i] * timeData[i + bestLag + 1];
                    }
                    // parabolic fit:  a = (y1 + y-1 - 2*y0)/2, but we treat y0 as current peak
                    const a = (corrPrev + corrNext - 2 * bestCorr) / 2;
                    const b = (corrNext - corrPrev) / 2;
                    if (a !== 0) {
                        const shift = -b / (2 * a); // offset from center (in samples)
                        const refinedLag = bestLag + shift;
                        if (refinedLag > minLag && refinedLag < maxLag) {
                            bestLag = refinedLag;
                        }
                    }
                }

                const frequency = sampleRate / bestLag;
                return frequency;
            }

            // ----- convert frequency to note name, cents, and midi -----
            function freqToNote(freq) {
                if (!freq || freq < MIN_FREQ || freq > MAX_FREQ) return null;

                const semitonesFromA4 = 12 * Math.log2(freq / A4_FREQ);
                const midiNumber = 69 + semitonesFromA4; // A4 = 69
                const roundedMidi = Math.round(midiNumber);
                const cents = Math.round(100 * (midiNumber - roundedMidi));

                const noteIndex = roundedMidi % 12;
                const octave = Math.floor(roundedMidi / 12) - 1; // MIDI octave standard
                const noteName = NOTE_NAMES[noteIndex] + octave;

                return {
                    name: noteName,
                    cents: cents,
                    freq: freq,
                    targetFreq: A4_FREQ * Math.pow(2, (roundedMidi - 69) / 12)
                };
            }

            // ----- update UI with note info -----
            function updateTunerDisplay(freq) {
                if (!freq) {
                    // no valid pitch
                    noteDisplay.textContent = '—';
                    freqDisplay.textContent = '0.0';
                    centsDisplay.textContent = '0';
                    centsLarge.textContent = '♭♯';
                    meterFill.style.width = '50%';
                    return;
                }

                const noteInfo = freqToNote(freq);
                if (!noteInfo) return;

                noteDisplay.textContent = noteInfo.name;
                freqDisplay.textContent = noteInfo.freq.toFixed(1);
                centsDisplay.textContent = noteInfo.cents;

                // show cents with sign
                const cents = noteInfo.cents;
                centsLarge.textContent = (cents > 0 ? '+' : '') + cents + ' ¢';

                // map cents -50..50 to meter width 0%..100% (clipped)
                let percent = 50 + (cents / 50) * 50; // at -50 -> 0%, +50 -> 100%
                percent = Math.min(100, Math.max(0, percent));
                meterFill.style.width = percent + '%';
            }

            // ----- audio processing loop (via rAF) -----
            function updateLoop() {
                if (!isRunning || !analyser || !audioContext) return;

                // get time-domain data
                const bufferLength = analyser.fftSize;
                const timeData = new Uint8Array(bufferLength);
                analyser.getByteTimeDomainData(timeData);

                // convert to float -1..1
                const floatData = new Float32Array(bufferLength);
                for (let i = 0; i < bufferLength; i++) {
                    floatData[i] = (timeData[i] - 128) / 128;
                }

                // detect pitch
                const detectedFreq = detectPitch(floatData, audioContext.sampleRate || SAMPLE_RATE);
                if (detectedFreq) {
                    updateTunerDisplay(detectedFreq);
                } else {
                    updateTunerDisplay(null);
                }

                // continue loop
                animationFrame = requestAnimationFrame(updateLoop);
            }

            // ----- start microphone & tuner -----
            async function startTuner() {
                hideError();
                if (isRunning) return;

                try {
                    // request microphone
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

                    // create audio context (must be done after user gesture)
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    await audioContext.resume(); // Safari may need explicit resume

                    source = audioContext.createMediaStreamSource(mediaStream);

                    // analyser node with decent resolution
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 4096;          // larger fft = better low-freq resolution
                    analyser.smoothingTimeConstant = 0.2;

                    source.connect(analyser);
                    // no output needed (avoid feedback)
                    isRunning = true;

                    // start UI update loop
                    updateLoop();

                    // update buttons & status
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    micStatus.innerHTML = '<i class="fas fa-microphone"></i> listening · pitch active';
                    liveIndicator.style.color = '#33ff99';

                } catch (err) {
                    console.error(err);
                    let msg = 'Microphone access denied or not available.';
                    if (err.message) msg += ' ' + err.message;
                    showError(msg);
                    stopTuner(); // clean up partial state
                }
            }

            // ----- stop everything and release resources -----
            function stopTuner() {
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
                isRunning = false;

                // disconnect and close audio context
                if (source) {
                    try { source.disconnect(); } catch (e) {}
                    source = null;
                }
                if (analyser) {
                    try { analyser.disconnect(); } catch (e) {}
                    analyser = null;
                }
                if (audioContext) {
                    audioContext.close().catch(console.warn);
                    audioContext = null;
                }
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }

                // reset UI
                startBtn.disabled = false;
                stopBtn.disabled = true;
                micStatus.innerHTML = '⏸️ tuner stopped';
                liveIndicator.style.color = '#ff8000';
                updateTunerDisplay(null); // blank
            }

            // ----- event listeners -----
            startBtn.addEventListener('click', () => {
                startTuner();
            });

            stopBtn.addEventListener('click', () => {
                stopTuner();
            });

            // if user navigates away, try to stop
            window.addEventListener('beforeunload', () => {
                if (isRunning) stopTuner();
            });

            // initial blank display
            updateTunerDisplay(null);

            // optional: warn about https (but localhost often ok)
            if (window.location.protocol !== 'https:' && location.hostname !== 'localhost' && !location.hostname.includes('127.0.0.1')) {
                console.warn('Microphone requires HTTPS or localhost');
            }
        })();
    </script>
</body>
</html>
