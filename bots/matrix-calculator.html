<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matrix Calculator · dark orange</title>
<link rel="icon" type="image/x-icon" href="favcon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- math.js for robust matrix operations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.12.0/math.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #f0f0f0;
            min-height: 100vh;
            padding: 24px 20px;
        }

        /* navigation – exactly from template */
        .navbar {
            margin-bottom: 30px;
        }
        .back-btn {
            padding: 8px 15px;
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            font-weight: 500;
        }
        .back-btn:hover {
            background: rgba(255, 128, 0, 0.3);
        }

        h1 {
            font-weight: 400;
            margin-bottom: 25px;
            letter-spacing: 1px;
            border-left: 5px solid #ff8000;
            padding-left: 20px;
            color: #fff;
        }

        /* main calculator panel */
        .calc-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: space-between;
        }

        .matrix-panel {
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid #ff8000;
            border-radius: 16px;
            padding: 20px 18px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            flex: 1 1 280px;
        }

        .panel-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #ff8000;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px dashed #ff8000;
            padding-bottom: 8px;
        }

        .dim-controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .dim-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dim-item label {
            color: #ccc;
            font-size: 0.95rem;
        }
        .dim-input {
            width: 70px;
            background: transparent;
            border: 1px solid #ff8000;
            color: #ff8000;
            padding: 6px 8px;
            border-radius: 6px;
            font-weight: 500;
            text-align: center;
        }
        .dim-input:focus {
            outline: none;
            box-shadow: 0 0 8px #ff8000;
        }
        .dim-input:disabled {
            opacity: 0.4;
            border-color: #666;
        }

        /* matrix table grid */
        .matrix-table {
            border-collapse: collapse;
            margin: 15px 0 5px;
        }
        .matrix-table td {
            padding: 5px;
        }
        .matrix-table input {
            width: 70px;
            height: 48px;
            background: #0f0f1f;
            border: 1px solid #ff8000;
            color: white;
            text-align: center;
            font-size: 1.1rem;
            border-radius: 8px;
            transition: 0.15s;
        }
        .matrix-table input:focus {
            outline: none;
            border-color: #ffaa33;
            box-shadow: 0 0 12px #ff8000;
        }
        .matrix-table input:disabled {
            border-color: #444;
            background: #1a1a2a;
            color: #777;
        }

        /* operation center */
        .operation-panel {
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-width: 200px;
            flex: 0 1 auto;
            border: 1px solid #ff8000;
        }
        .op-select {
            background: #0f0f20;
            border: 2px solid #ff8000;
            color: #ff8000;
            padding: 12px 18px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .op-select option {
            background: #1a1a2e;
            color: white;
        }
        .action-btn {
            background: rgba(255, 128, 0, 0.2);
            border: 2px solid #ff8000;
            color: #ff8000;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .action-btn:hover {
            background: rgba(255, 128, 0, 0.4);
            transform: scale(1.02);
        }

        /* result area */
        .result-area {
            margin-top: 40px;
            background: rgba(26, 10, 46, 0.7);
            border: 2px solid #ff8000;
            border-radius: 24px;
            padding: 25px 25px;
            backdrop-filter: blur(3px);
        }
        .result-title {
            font-size: 1.8rem;
            color: #ff8000;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .matrix-result {
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }
        .result-table {
            border-collapse: collapse;
            background: #0d0d1a;
        }
        .result-table td {
            border: 1px solid #ff8000;
            padding: 14px 20px;
            min-width: 70px;
            text-align: center;
            font-size: 1.2rem;
            color: #fff;
        }
        .error-message {
            color: #ff6060;
            font-size: 1.3rem;
            padding: 20px;
            border: 1px solid #ff6060;
            border-radius: 16px;
            background: rgba(255,80,80,0.1);
        }

        .footnote {
            margin-top: 30px;
            color: #aaa;
            font-style: italic;
        }
        hr {
            border: 0.5px solid #ff8000;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <!-- navbar with back button exactly as given -->
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <h1>⚡ MATRIX CALCULATOR · addition · multiplication · inverse</h1>

    <!-- main interactive area -->
    <div class="calc-wrapper">
        <!-- MATRIX A PANEL -->
        <div class="matrix-panel" id="panelA">
            <div class="panel-title"><i class="fas fa-matrix" style="color:#ff8000;"></i> Matrix A</div>
            <div class="dim-controls">
                <div class="dim-item">
                    <label>Rows</label>
                    <input type="number" id="rowsA" class="dim-input" min="1" max="4" value="2">
                </div>
                <div class="dim-item">
                    <label>Cols</label>
                    <input type="number" id="colsA" class="dim-input" min="1" max="4" value="2">
                </div>
            </div>
            <div id="matrixA-container" class="matrix-container"></div>
        </div>

        <!-- MATRIX B PANEL -->
        <div class="matrix-panel" id="panelB">
            <div class="panel-title"><i class="fas fa-matrix" style="color:#ff8000;"></i> Matrix B</div>
            <div class="dim-controls">
                <div class="dim-item">
                    <label>Rows</label>
                    <input type="number" id="rowsB" class="dim-input" min="1" max="4" value="2">
                </div>
                <div class="dim-item">
                    <label>Cols</label>
                    <input type="number" id="colsB" class="dim-input" min="1" max="4" value="2">
                </div>
            </div>
            <div id="matrixB-container" class="matrix-container"></div>
        </div>

        <!-- OPERATION + CALCULATE -->
        <div class="operation-panel">
            <select id="operationSelect" class="op-select">
                <option value="add">A + B  (addition)</option>
                <option value="multiply">A × B  (multiplication)</option>
                <option value="inverse">A⁻¹  (inverse of A)</option>
            </select>
            <button id="calculateBtn" class="action-btn"><i class="fas fa-equals"></i>  COMPUTE</button>
        </div>
    </div>

    <!-- RESULT SECTION -->
    <div class="result-area">
        <div class="result-title"><i class="fas fa-calculator"></i> Result matrix</div>
        <div id="resultDisplay" class="matrix-result">
            <!-- dynamic result will be injected here -->
            <span style="color: #aaa;">awaiting calculation ...</span>
        </div>
    </div>
    <div class="footnote">* Matrices limited to 4×4 for clarity. Inverse requires square, invertible matrix.</div>

    <script>
        (function() {
            // references
            const rowsAinp = document.getElementById('rowsA');
            const colsAinp = document.getElementById('colsA');
            const rowsBinp = document.getElementById('rowsB');
            const colsBinp = document.getElementById('colsB');
            const matrixACont = document.getElementById('matrixA-container');
            const matrixBCont = document.getElementById('matrixB-container');
            const opSelect = document.getElementById('operationSelect');
            const calcBtn = document.getElementById('calculateBtn');
            const resultDiv = document.getElementById('resultDisplay');

            // helper: generate matrix table inside container with current dimensions
            function renderMatrix(container, rows, cols, prefix) {
                let html = '<table class="matrix-table">';
                for (let r = 0; r < rows; r++) {
                    html += '<tr>';
                    for (let c = 0; c < cols; c++) {
                        html += `<td><input type="number" value="0" step="any" id="${prefix}_${r}_${c}" class="matrix-cell"></td>`;
                    }
                    html += '</tr>';
                }
                html += '</table>';
                container.innerHTML = html;
            }

            // initial render
            function renderAll() {
                let rA = parseInt(rowsAinp.value) || 2;
                let cA = parseInt(colsAinp.value) || 2;
                let rB = parseInt(rowsBinp.value) || 2;
                let cB = parseInt(colsBinp.value) || 2;
                // clamp 1..4
                rA = Math.min(4, Math.max(1, rA));
                cA = Math.min(4, Math.max(1, cA));
                rB = Math.min(4, Math.max(1, rB));
                cB = Math.min(4, Math.max(1, cB));
                rowsAinp.value = rA;
                colsAinp.value = cA;
                rowsBinp.value = rB;
                colsBinp.value = cB;

                renderMatrix(matrixACont, rA, cA, 'A');
                renderMatrix(matrixBCont, rB, cB, 'B');
            }

            // attach dimension events
            rowsAinp.addEventListener('input', renderAll);
            colsAinp.addEventListener('input', renderAll);
            rowsBinp.addEventListener('input', renderAll);
            colsBinp.addEventListener('input', renderAll);

            // handle operation change: disable matrix B for inverse
            function updateDisableForInverse() {
                const isInverse = (opSelect.value === 'inverse');
                // disable entire matrix B panel? we disable inputs inside B table & dimension controls
                const matrixBInputs = document.querySelectorAll('#matrixB-container input');
                matrixBInputs.forEach(inp => inp.disabled = isInverse);
                // also disable rowsB, colsB
                rowsBinp.disabled = isInverse;
                colsBinp.disabled = isInverse;
                // cosmetic: panel B opacity
                const panelB = document.getElementById('panelB');
                if (isInverse) {
                    panelB.style.opacity = '0.6';
                } else {
                    panelB.style.opacity = '1';
                }
            }

            opSelect.addEventListener('change', () => {
                updateDisableForInverse();
            });

            // also when rendering new tables we need to respect inverse state
            const originalRender = renderAll;
            renderAll = function() {
                originalRender();
                updateDisableForInverse(); // after new tables, disable if needed
            };
            renderAll(); // init

            // re-apply disable after dimension changes (renderAll calls original + update)
            // but we overrode renderAll, so good.

            // ---- matrix value extractor ----
            function getMatrixFromInputs(prefix, rows, cols) {
                const mat = [];
                for (let r = 0; r < rows; r++) {
                    const row = [];
                    for (let c = 0; c < cols; c++) {
                        const cell = document.getElementById(`${prefix}_${r}_${c}`);
                        let val = cell ? parseFloat(cell.value) : 0;
                        if (isNaN(val)) val = 0;
                        row.push(val);
                    }
                    mat.push(row);
                }
                return mat;
            }

            // display result (as matrix or number)
            function displayResult(data) {
                if (typeof data === 'number') {
                    // 1x1 scalar
                    const html = `<table class="result-table"><tr><td>${data}</td></tr></table>`;
                    resultDiv.innerHTML = html;
                } else if (Array.isArray(data)) {
                    let html = '<table class="result-table">';
                    for (let r = 0; r < data.length; r++) {
                        html += '<tr>';
                        const row = data[r];
                        if (Array.isArray(row)) {
                            for (let c = 0; c < row.length; c++) {
                                let val = row[c];
                                if (typeof val === 'number') val = Math.round(val * 1e12) / 1e12; // tidy
                                html += `<td>${val}</td>`;
                            }
                        } else {
                            // fallback for vector? not expected
                            html += `<td>${row}</td>`;
                        }
                        html += '</tr>';
                    }
                    html += '</table>';
                    resultDiv.innerHTML = html;
                } else {
                    // math.js matrix type ?
                    try {
                        const arr = data.toArray ? data.toArray() : data;
                        displayResult(arr);
                    } catch (e) {
                        resultDiv.innerHTML = `<div class="error-message">⚠️ unknown result format</div>`;
                    }
                }
            }

            // calculate button logic
            calcBtn.addEventListener('click', () => {
                // get current dimensions (clamped)
                let rA = parseInt(rowsAinp.value) || 2;
                let cA = parseInt(colsAinp.value) || 2;
                let rB = parseInt(rowsBinp.value) || 2;
                let cB = parseInt(colsBinp.value) || 2;
                rA = Math.min(4, Math.max(1, rA));
                cA = Math.min(4, Math.max(1, cA));
                rB = Math.min(4, Math.max(1, rB));
                cB = Math.min(4, Math.max(1, cB));

                const op = opSelect.value;

                try {
                    if (op === 'inverse') {
                        // inverse of A only
                        if (rA !== cA) {
                            resultDiv.innerHTML = `<div class="error-message">❌ Inverse requires square matrix (A has ${rA} rows, ${cA} cols)</div>`;
                            return;
                        }
                        const A = getMatrixFromInputs('A', rA, cA);
                        // math.inv works with array or matrix
                        const inv = math.inv(A);
                        displayResult(inv);
                    } 
                    else if (op === 'add') {
                        // addition A+B , same dimensions
                        if (rA !== rB || cA !== cB) {
                            resultDiv.innerHTML = `<div class="error-message">❌ Addition requires identical dimensions. A: ${rA}x${cA}, B: ${rB}x${cB}</div>`;
                            return;
                        }
                        const A = getMatrixFromInputs('A', rA, cA);
                        const B = getMatrixFromInputs('B', rB, cB);
                        const sum = math.add(A, B);
                        displayResult(sum);
                    } 
                    else if (op === 'multiply') {
                        // multiplication A * B , colsA == rowsB
                        if (cA !== rB) {
                            resultDiv.innerHTML = `<div class="error-message">❌ Multiplication: columns of A (${cA}) must equal rows of B (${rB})</div>`;
                            return;
                        }
                        const A = getMatrixFromInputs('A', rA, cA);
                        const B = getMatrixFromInputs('B', rB, cB);
                        const prod = math.multiply(A, B);
                        displayResult(prod);
                    }
                } catch (err) {
                    console.error(err);
                    let msg = err.message || 'unknown error during calculation';
                    resultDiv.innerHTML = `<div class="error-message">🚫 Math error: ${msg}</div>`;
                }
            });

            // initialize tooltips / first result placeholder
            // also listen for dimension changes to keep matrix B disabled if inverse
            window.addEventListener('load', function() {
                updateDisableForInverse();
            });
        })();
    </script>

    <!-- subtle extra style for disabled inputs -->
    <style>
        .matrix-table input:disabled {
            border-color: #4a2e00;
            color: #aaa;
        }
        .dim-input:disabled {
            border-color: #4a2e00;
            color: #666;
        }
    </style>
</body>
</html>
