<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Zone Converter</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ----- global reset & palette from template ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #fff;
            min-height: 100vh;
            padding: 24px 24px 40px;
        }

        /* back button – exact style from provided file */
        .back-btn {
            padding: 8px 15px;
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.2s, border-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: rgba(255, 128, 0, 0.3);
            border-color: #ffaa33;
        }

        .navbar {
            margin-bottom: 2rem;
        }

        /* ----- main container / quality extras ----- */
        .converter-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-weight: 400;
            font-size: 2.1rem;
            letter-spacing: 1px;
            background: linear-gradient(130deg, #ffb770, #ff8000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            border-left: 4px solid #ff8000;
            padding-left: 20px;
        }

        h1 small {
            font-size: 1rem;
            background: none;
            -webkit-text-fill-color: rgba(255,255,255,0.6);
            color: rgba(255,255,255,0.6);
            font-weight: 300;
            margin-left: 12px;
        }

        /* search + filter bar */
        .search-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            align-items: center;
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(4px);
            padding: 16px 22px;
            border-radius: 48px;
            border: 1px solid rgba(255, 128, 0, 0.25);
            box-shadow: 0 10px 25px -8px rgba(0,0,0,0.7);
        }

        .search-wrapper {
            flex: 2;
            min-width: 260px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrapper i {
            position: absolute;
            left: 18px;
            color: #ff8000;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-wrapper input {
            width: 100%;
            background: rgba(20, 15, 35, 0.9);
            border: 1px solid #ff8000;
            border-radius: 40px;
            padding: 16px 24px 16px 50px;
            font-size: 1.1rem;
            color: white;
            transition: 0.2s;
            outline: none;
        }

        .search-wrapper input:focus {
            border-color: #ffaa33;
            box-shadow: 0 0 0 3px rgba(255,128,0,0.3);
            background: #120e22;
        }

        .search-wrapper input::placeholder {
            color: #b0a6c5;
            font-weight: 300;
            opacity: 0.7;
        }

        .zone-counter {
            background: rgba(255, 128, 0, 0.1);
            border-radius: 40px;
            padding: 10px 24px;
            border: 1px dashed #ff8000;
            font-weight: 400;
            color: #ffc285;
            white-space: nowrap;
            font-size: 1rem;
            backdrop-filter: blur(2px);
        }

        .zone-counter span {
            color: white;
            font-weight: 600;
            font-size: 1.3rem;
            margin-right: 6px;
        }

        /* ---------- table – cosmic vault ---------- */
        .table-container {
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255,128,0,0.3);
            overflow: auto;
            max-height: 68vh;
            box-shadow: 0 25px 40px -15px black;
        }

        .timezone-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
            min-width: 600px;
        }

        .timezone-table thead tr {
            background: #1a0a2e;  /* deep purple */
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .timezone-table th {
            color: #ff8000;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.85rem;
            padding: 18px 16px;
            text-align: left;
            border-bottom: 2px solid #ff8000;
            white-space: nowrap;
        }

        .timezone-table td {
            padding: 15px 16px;
            border-bottom: 1px solid rgba(255,128,0,0.15);
            color: #f0eaff;
            font-weight: 350;
        }

        .timezone-table tbody tr {
            transition: background 0.15s;
        }

        .timezone-table tbody tr:hover {
            background: rgba(255, 128, 0, 0.12);
            cursor: default;
        }

        /* zone name styling */
        .zone-name {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-weight: 400;
            color: #c2d6ff;
            word-break: break-word;
        }

        /* time cell – monospace for readability */
        .time-cell {
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
            font-weight: 400;
            letter-spacing: 0.3px;
            color: #fff9e6;
        }

        .offset-cell {
            font-family: monospace;
            color: #ffb56b;
            font-weight: 400;
        }

        /* empty state */
        .no-results td {
            text-align: center;
            padding: 48px 20px;
            color: #a89cc0;
            font-style: italic;
            font-size: 1.3rem;
            background: rgba(0,0,0,0.2);
        }

        .no-results i {
            color: #ff8000;
            opacity: 0.7;
            margin-right: 10px;
        }

        /* footer */
        .footer-note {
            margin-top: 24px;
            text-align: right;
            font-size: 0.9rem;
            color: #a592c0;
            border-top: 1px solid rgba(255,128,0,0.2);
            padding-top: 18px;
        }

        .footer-note i {
            color: #ff8000;
            margin: 0 4px;
        }

        /* live badge */
        .live-badge {
            background: #ff8000;
            color: #0a0a1a;
            font-weight: bold;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 30px;
            margin-left: 12px;
            vertical-align: middle;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <!-- navbar with back button (exact from template) -->
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <!-- main content -->
    <div class="converter-header">
        <h1>

        </h1>
    </div>

    <!-- search panel -->
    <div class="search-panel">
        <div class="search-wrapper">
            <i class="fas fa-globe"></i>
            <input type="text" id="zoneSearch" placeholder="Search any territory, city, or zone... (e.g. 'Kolkata', 'Pacific', 'Ulaanbaatar')" autocomplete="off">
        </div>
        <div class="zone-counter" id="zoneCounter">
            <span id="visibleCount">0</span> / <span id="totalCount">0</span> zones
        </div>
    </div>

    <!-- table container (all zones) -->
    <div class="table-container" id="tableContainer">
        <table class="timezone-table" id="tzTable">
            <thead>
                <tr>
                    <th>IANA Time Zone</th>
                    <th>Current Local Time</th>
                    <th>Offset (UTC)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- filled by javascript -->
                <tr class="no-results">
                    <td colspan="3">
                        <i class="fas fa-spinner fa-pulse"></i> Loading all time zones…
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer-note">
        <i class="fas fa-sync-alt fa-spin" style="--fa-animation-duration: 3s;"></i> times refresh every second · 
        <i class="fas fa-map-pin"></i> DST‑aware offsets 
        <span class="live-badge"><i class="fas fa-bolt"></i> LIVE</span>

                    "Australia/Melbourne", "Australia/Perth", "Australia/Sydney", "Europe/Amsterdam", "Europe/Andorra", "Europe/Astrakhan",
                    "Europe/Athens", "Europe/Belgrade", "Europe/Berlin", "Europe/Bratislava", "Europe/Brussels", "Europe/Bucharest",
                    "Europe/Budapest", "Europe/Busingen", "Europe/Chisinau", "Europe/Copenhagen", "Europe/Dublin", "Europe/Gibraltar",

                    "Europe/Kiev", "Europe/Kirov", "Europe/Lisbon", "Europe/Ljubljana", "Europe/London", "Europe/Luxembourg", "Europe/Madrid",

                    "Europe/Podgorica", "Europe/Prague", "Europe/Riga", "Europe/Rome", "Europe/Samara", "Europe/San_Marino", "Europe/Sarajevo",
                    "Europe/Saratov", "Europe/Simferopol", "Europe/Skopje", "Europe/Sofia", "Europe/Stockholm", "Europe/Tallinn",
                    "Europe/Tirane", "Europe/Ulyanovsk", "Europe/Uzhgorod", "Europe/Vaduz", "Europe/Vatican", "Europe/Vienna", "Europe/Vilnius",
                    "Europe/Volgograd", "Europe/Warsaw", "Europe/Zagreb", "Europe/Zaporozhye", "Europe/Zurich", "Indian/Antananarivo",
                    "Indian/Chagos", "Indian/Christmas", "Indian/Cocos", "Indian/Comoro", "Indian/Kerguelen", "Indian/Mahe", "Indian/Maldives",

                    "Pacific/Chatham", "Pacific/Chuuk", "Pacific/Easter", "Pacific/Efate", "Pacific/Enderbury", "Pacific/Fakaofo",
                    "Pacific/Fiji", "Pacific/Funafuti", "Pacific/Galapagos", "Pacific/Gambier", "Pacific/Guadalcanal", "Pacific/Guam",
                    "Pacific/Honolulu", "Pacific/Kiritimati", "Pacific/Kosrae", "Pacific/Kwajalein", "Pacific/Majuro", "Pacific/Marquesas",

                    "Pacific/Tahiti", "Pacific/Tarawa", "Pacific/Tongatapu", "Pacific/Wake", "Pacific/Wallis", "UTC"
                ];
            }
            // sort alphabetically
            allTimeZones.sort((a,b) => a.localeCompare(b));

            // ---------- DOM elements ----------
            const tbody = document.getElementById('tableBody');
            const searchInput = document.getElementById('zoneSearch');
            const visibleSpan = document.getElementById('visibleCount');
            const totalSpan = document.getElementById('totalCount');

            // store row objects for updates
            const rows = [];   // { zone, rowElement, timeCell, offsetCell, timeFormatter, offsetFormatter }

            // ---------- build table ----------
            function buildTable() {
                tbody.innerHTML = ''; // clear loading

                for (let zone of allTimeZones) {
                    const row = document.createElement('tr');

                    // zone name cell
                    const nameCell = document.createElement('td');
                    nameCell.className = 'zone-name';
                    nameCell.textContent = zone;
                    row.appendChild(nameCell);

                    // time cell
                    const timeCell = document.createElement('td');
                    timeCell.className = 'time-cell';
                    row.appendChild(timeCell);

                    // offset cell
                    const offsetCell = document.createElement('td');
                    offsetCell.className = 'offset-cell';
                    row.appendChild(offsetCell);

                    // create formatters (reused each second)
                    let timeFormatter, offsetFormatter;
                    try {
                        timeFormatter = new Intl.DateTimeFormat('en-US', {
                            timeZone: zone,
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit',
                            hour12: false
                        });
                        // offset formatter includes timeZoneName so we can extract the GMT part
                        offsetFormatter = new Intl.DateTimeFormat('en-US', {
                            timeZone: zone,
                            timeZoneName: 'short',
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit',
                            hour12: false
                        });
                    } catch (e) {
                        // fallback for any weird zone (should not happen)
                        timeFormatter = { format: () => '???' };
                        offsetFormatter = { formatToParts: () => [] };
                    }

                    rows.push({
                        zone,
                        rowElement: row,
                        timeCell,
                        offsetCell,
                        timeFormatter,
                        offsetFormatter
                    });

                    tbody.appendChild(row);
                }

                totalSpan.textContent = allTimeZones.length;
                updateVisibleCount();
            }

            // ---------- update times & offsets (called every second) ----------
            function updateAllClocks() {
                const now = new Date();
                for (let r of rows) {
                    try {
                        // update time
                        r.timeCell.textContent = r.timeFormatter.format(now);

                        // update offset by extracting timeZoneName from parts
                        const parts = r.offsetFormatter.formatToParts(now);
                        const tzPart = parts.find(p => p.type === 'timeZoneName');
                        r.offsetCell.textContent = tzPart ? tzPart.value : 'UTC';
                    } catch (e) {
                        // avoid breaking whole loop
                        r.timeCell.textContent = '—';
                        r.offsetCell.textContent = '—';
                    }
                }
            }

            // ---------- search filter ----------
            function filterZones() {
                const term = searchInput.value.trim().toLowerCase();
                let visible = 0;

                for (let r of rows) {
                    const match = term === '' || r.zone.toLowerCase().includes(term);
                    r.rowElement.style.display = match ? 'table-row' : 'none';
                    if (match) visible++;
                }

                // check if no results
                const noResultsRow = document.getElementById('noResultsRow');
                if (visible === 0 && rows.length > 0) {
                    if (!noResultsRow) {
                        const tbody = document.getElementById('tableBody');
                        const tr = document.createElement('tr');
                        tr.id = 'noResultsRow';
                        tr.className = 'no-results';
                        tr.innerHTML = '<td colspan="3"><i class="fas fa-map-marked-alt"></i> No time zone matches — try a broader term</td>';
                        tbody.appendChild(tr);
                    }
                } else {
                    const existing = document.getElementById('noResultsRow');
                    if (existing) existing.remove();
                }

                visibleSpan.textContent = visible;
            }

            function updateVisibleCount() {
                // count visible rows (excluding possible no-results row)
                let visible = 0;
                for (let r of rows) {
                    if (r.rowElement.style.display !== 'none') visible++;
                }
                visibleSpan.textContent = visible;
            }

            // ---------- initial load ----------
            buildTable();

            // first update immediately
            updateAllClocks();

            // live timer every second
            setInterval(updateAllClocks, 1000);

            // search listener
            searchInput.addEventListener('input', function() {
                filterZones();
            });

            // also update visible count after filter (filter calls updateVisibleCount indirectly via filterZones)
            // patch filterZones to update count correctly
            const originalFilter = filterZones;
            filterZones = function() {
                originalFilter();
                // count manually
                let cnt = 0;
                for (let r of rows) {
                    if (r.rowElement.style.display !== 'none') cnt++;
                }
                visibleSpan.textContent = cnt;
            };
            // replace
            filterZones = filterZones.bind(this);
            // but we already called original in event, so we re-assign:
            searchInput.removeEventListener('input', originalFilter);
            searchInput.addEventListener('input', filterZones);

            // initialize visible count
            filterZones();

            // extra: make sure noResultsRow does not disturb count
            const countInterval = setInterval(() => {
                // sync count every second (safe)
                let cnt = 0;
                for (let r of rows) {
                    if (r.rowElement.style.display !== 'none') cnt++;
                }
                visibleSpan.textContent = cnt;
            }, 500);
        })();
    </script>
</body>
