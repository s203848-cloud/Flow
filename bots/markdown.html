            font-size: 0.9em;

            margin-bottom: 20px;
            border-left: 4px solid #ff8000;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);

        .preview-area pre code {
            background: transparent;
            padding: 0;
            color: #f0f0f0;
            font-size: 0.95em;
        }
        
        .preview-area blockquote {

            margin-right: 0;

            border-radius: 0 8px 8px 0;

            width: 100%;
            background: rgba(30, 30, 60, 0.5);
            border-radius: 8px;
            overflow: hidden;

## The Ultimate Markdown Editor

This editor provides a **live preview** of your markdown as you type. All formatting is rendered in real-time on the right side.

### Key Features

- **Real-time preview** with syntax highlighting
- **Download** your markdown as .md files
- **Upload** existing .md files to edit
- **Advanced formatting** support
- **Word/character count** and statistics
- **Clean, dark theme** with orange accents

### Code Example

```javascript
// JavaScript code with syntax highlighting
function calculateStats(text) {
    const words = text.trim().split(/\s+/).length;
    const chars = text.length;
    const lines = text.split('\n').length;
    
    return { words, chars, lines };
}

// Call the function
const stats = calculateStats("Hello Markdown Editor!");
console.log(stats);
