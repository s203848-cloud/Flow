<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
<link rel="icon" type="image/x-icon" href="favcon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navigation bar matching the given template */
        .navbar {
            width: 100%;
            max-width: 800px;
            margin-bottom: 30px;
        }

        .back-btn {
            display: inline-block;
            padding: 8px 15px;
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 128, 0, 0.3);
        }

        /* Main card container */
        .timer-card {
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 128, 0, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 10px;
            color: #ff8000;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #ccc;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* Input area */
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .datetime-input {
            flex: 1 1 250px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 50px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .datetime-input:focus {
            border-color: #ff8000;
        }

        .datetime-input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .set-btn {
            padding: 12px 35px;
            background: transparent;
            border: 2px solid #ff8000;
            border-radius: 50px;
            color: #ff8000;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .set-btn:hover {
            background: #ff8000;
            color: #0a0a1a;
            box-shadow: 0 0 15px rgba(255, 128, 0, 0.5);
        }

        /* Countdown display */
        .countdown {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0 20px;
        }

        .time-block {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px 15px;
            min-width: 120px;
            border: 1px solid rgba(255, 128, 0, 0.3);
            box-shadow: inset 0 0 15px rgba(255, 128, 0, 0.1);
        }

        .time-value {
            font-size: 3.5rem;
            font-weight: 700;
            color: #ff8000;
            line-height: 1.2;
            text-shadow: 0 0 20px rgba(255, 128, 0, 0.5);
        }

        .time-label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaa;
        }

        .message {
            font-size: 1.5rem;
            color: #ff8000;
            margin: 30px 0;
            min-height: 60px;
        }

        .error-message {
            color: #ff4444;
            font-size: 1rem;
            margin-top: 10px;
            min-height: 24px;
        }

        footer {
            margin-top: 30px;
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <div class="timer-card">
        <h1>COUNTDOWN TIMER</h1>
        <div class="subtitle">Set a future date and watch the time fly</div>

        <!-- Input section for date and time -->
        <div class="input-group">
            <input type="datetime-local" id="datetimePicker" class="datetime-input" 
                   min="" step="1" value="">
            <button id="setTimerBtn" class="set-btn">Start Countdown</button>
        </div>
        <div id="errorDisplay" class="error-message"></div>

        <!-- Countdown display blocks -->
        <div class="countdown" id="countdownDisplay">
            <div class="time-block">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <!-- Expired / status message -->
        <div id="messageArea" class="message"></div>
        <footer>⏳ Countdown until the moment you choose</footer>
    </div>

    <script>
        (function() {
            "use strict";

            // DOM elements
            const datetimePicker = document.getElementById('datetimePicker');
            const setTimerBtn = document.getElementById('setTimerBtn');
            const errorDisplay = document.getElementById('errorDisplay');
            const daysSpan = document.getElementById('days');
            const hoursSpan = document.getElementById('hours');
            const minutesSpan = document.getElementById('minutes');
            const secondsSpan = document.getElementById('seconds');
            const messageArea = document.getElementById('messageArea');

            // State
            let targetDate = null;          // Date object for the target
            let timerInterval = null;        // Interval ID

            // Set min attribute to current date/time (prevents past selection)
            const setMinDateTime = () => {
                const now = new Date();
                // Convert to ISO string and remove milliseconds / timezone to fit datetime-local format
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                // Min should be current time rounded down to minute (seconds not critical)
                datetimePicker.min = `${year}-${month}-${day}T${hours}:${minutes}`;
                // Optionally set default to one hour from now
                const defaultDate = new Date(now.getTime() + 60 * 60 * 1000); // +1 hour
                const defYear = defaultDate.getFullYear();
                const defMonth = String(defaultDate.getMonth() + 1).padStart(2, '0');
                const defDay = String(defaultDate.getDate()).padStart(2, '0');
                const defHours = String(defaultDate.getHours()).padStart(2, '0');
                const defMinutes = String(defaultDate.getMinutes()).padStart(2, '0');
                datetimePicker.value = `${defYear}-${defMonth}-${defDay}T${defHours}:${defMinutes}`;
            };
            setMinDateTime();

            // Helper to clear existing timer
            const stopTimer = () => {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            };

            // Update the countdown display based on remaining milliseconds
            const updateDisplay = (remainingMs) => {
                if (remainingMs < 0) {
                    // Countdown finished
                    daysSpan.textContent = '00';
                    hoursSpan.textContent = '00';
                    minutesSpan.textContent = '00';
                    secondsSpan.textContent = '00';
                    messageArea.textContent = '⏰ Time is up!';
                    stopTimer();
                    return;
                }

                const totalSeconds = Math.floor(remainingMs / 1000);
                const days = Math.floor(totalSeconds / (3600 * 24));
                const hours = Math.floor((totalSeconds % (3600 * 24)) / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                daysSpan.textContent = String(days).padStart(2, '0');
                hoursSpan.textContent = String(hours).padStart(2, '0');
                minutesSpan.textContent = String(minutes).padStart(2, '0');
                secondsSpan.textContent = String(seconds).padStart(2, '0');
                messageArea.textContent = ''; // clear any finished message
            };

            // Start countdown from a given target date
            const startCountdown = (target) => {
                stopTimer(); // stop any previous countdown

                const now = new Date();
                let remaining = target.getTime() - now.getTime();

                if (remaining <= 0) {
                    errorDisplay.textContent = 'Selected date/time is in the past. Please choose a future moment.';
                    // Reset display to zeros
                    daysSpan.textContent = '00';
                    hoursSpan.textContent = '00';
                    minutesSpan.textContent = '00';
                    secondsSpan.textContent = '00';
                    messageArea.textContent = '';
                    return false;
                }

                errorDisplay.textContent = ''; // clear errors
                updateDisplay(remaining);

                // Set interval to update every second
                timerInterval = setInterval(() => {
                    const now = new Date();
                    const remaining = target.getTime() - now.getTime();

                    if (remaining <= 0) {
                        // Countdown finished
                        updateDisplay(0); // show zeros and message
                        stopTimer();
                    } else {
                        updateDisplay(remaining);
                    }
                }, 1000);

                return true;
            };

            // Event listener for the Set button
            setTimerBtn.addEventListener('click', () => {
                const selectedValue = datetimePicker.value;
                if (!selectedValue) {
                    errorDisplay.textContent = 'Please select a date and time.';
                    return;
                }

                // Create date object from input (local time)
                const selectedDate = new Date(selectedValue);
                // Validate if it's a real date
                if (isNaN(selectedDate.getTime())) {
                    errorDisplay.textContent = 'Invalid date format.';
                    return;
                }

                // Check if selected date is in future (compare with current)
                const now = new Date();
                if (selectedDate <= now) {
                    errorDisplay.textContent = 'Selected date/time must be in the future.';
                    return;
                }

                // Everything ok: set target and start countdown
                targetDate = selectedDate;
                startCountdown(targetDate);
            });

            // Optional: prevent manual entry of past dates via keyboard (but min attribute already helps)
            datetimePicker.addEventListener('change', function() {
                const val = this.value;
                if (val) {
                    const selected = new Date(val);
                    const now = new Date();
                    if (selected <= now) {
                        errorDisplay.textContent = 'Please pick a future date/time.';
                    } else {
                        errorDisplay.textContent = '';
                    }
                }
            });

            // Cleanup interval on page unload (good practice)
            window.addEventListener('beforeunload', () => {
                stopTimer();
            });

            // Initialize display to zeros
            daysSpan.textContent = '00';
            hoursSpan.textContent = '00';
            minutesSpan.textContent = '00';
            secondsSpan.textContent = '00';
        })();
    </script>
</body>
</html>
