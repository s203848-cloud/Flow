<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../favcon.png">
<title>Console - EZ Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:linear-gradient(135deg,#0a0a1a,#1a0a2e);color:#fff;min-height:100vh;padding:20px;transition:all .3s ease}
body.light-mode{background:linear-gradient(135deg,#f0f2f5,#fff);color:#333}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:rgba(20,20,35,.8);border-bottom:1px solid rgba(255,69,0,.2);margin:0 auto 30px;max-width:1100px;border-radius:10px;transition:all .3s}
body.light-mode .navbar{background:rgba(240,242,245,.9);border-bottom-color:rgba(255,128,0,.4)}
.logo,.grad{background:linear-gradient(to right,#ffbb00,#ff8000,#ff5900,#ff7700,#ff5900,#ff8000,#ffbb00);background-size:800% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow 8s linear infinite;font-weight:bold}
.logo{font-size:3rem}
@keyframes rainbow{to{background-position:200% center}}
.nav-right{display:flex;gap:12px;align-items:center}
.nav-btn{padding:8px 15px;background:rgba(255,128,0,.2);border:1px solid #ff8000;border-radius:5px;color:#ff8000;cursor:pointer;font-size:.9rem;transition:all .3s}
.nav-btn:hover{background:rgba(255,128,0,.3)}
body.light-mode .nav-btn{background:rgba(255,128,0,.1);color:#ff6b00;border-color:#ff8c00}
.theme-toggle{width:40px;height:40px;background:none;border:1px solid rgba(255,128,0,.3);border-radius:5px;color:#ff8000;font-size:1.2rem;cursor:pointer;transition:all .3s}
.theme-toggle:hover{background:rgba(255,128,0,.1);transform:translateY(-5px) rotate(5deg) scale(1.1)}
.container{max-width:1100px;margin:0 auto}
.section{background:rgba(20,20,35,.5);border:1px solid rgba(255,69,0,.2);border-radius:10px;padding:25px;transition:all .3s}
body.light-mode .section{background:rgba(240,242,245,.7);border-color:rgba(255,128,0,.3)}
.section-title{font-size:1.5rem;margin-bottom:15px;color:#ff8000;display:flex;justify-content:space-between;align-items:center;gap:10px}
body.light-mode .section-title{color:#ff6b00}
.hint{font-size:.8rem;color:#aaa;font-weight:normal}
body.light-mode .hint{color:#666}
#screen{height:58vh;min-height:320px;overflow-y:auto;background:rgba(30,30,50,.8);border:1px solid rgba(255,128,0,.3);border-radius:8px;padding:16px;font-family:Consolas,'Courier New',monospace;font-size:.92rem;line-height:1.55;cursor:text}
body.light-mode #screen{background:rgba(255,255,255,.9);border-color:rgba(255,128,0,.4);color:#333}
#screen::-webkit-scrollbar{width:8px}#screen::-webkit-scrollbar-thumb{background:rgba(255,128,0,.4);border-radius:4px}
.line{white-space:pre-wrap;word-break:break-word}
.err{color:#ff4500}.ok{color:#5be37d}.dim{color:#888}.acc{color:#ff8000}.gold{color:#ffbb00}
body.light-mode .ok{color:#1a9c3e}body.light-mode .gold{color:#c98a00}
.screen a{color:#ffbb00}
#screen a{color:#ffbb00;text-decoration:none;border-bottom:1px dashed rgba(255,187,0,.5);transition:all .2s}
#screen a:hover{color:#ff5900;border-bottom-style:solid}
body.light-mode #screen a{color:#d46a00}
.cmd-name{color:#ff8000;font-weight:bold;display:inline-block;min-width:110px}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.prompt{white-space:nowrap;font-weight:bold}
#input{flex:1;background:none;border:none;outline:none;color:#fff;font:inherit;caret-color:#ff8000}
body.light-mode #input{color:#222}
.link-card{display:grid;grid-template-columns:34px 140px 1fr;gap:6px;padding:2px 0}
.footer{margin-top:12px;font-size:.8rem;color:#888;text-align:center}
@media(max-width:600px){.logo{font-size:2rem}.navbar{padding:12px 16px}.link-card{grid-template-columns:28px 1fr}.link-card span:last-child{grid-column:2}}
</style>
</head>
<body>
<div class="navbar">
  <div class="logo">EZ Console</div>
  <div class="nav-right">
    <button class="nav-btn" onclick="run('help')">Help</button>
    <button class="nav-btn" onclick="run('clear')">Clear</button>
    <button class="theme-toggle" onclick="run('theme')" title="Toggle theme">&#9680;</button>
  </div>
</div>

<div class="container">
  <div class="section">
    <div class="section-title"><span>Terminal</span><span class="hint">Tab completes &middot; &uarr;/&darr; history &middot; Ctrl+L clears</span></div>
    <div id="screen" onclick="input.focus()">
      <div id="out"></div>
      <div class="row"><span class="prompt grad" id="promptText">ez@platform:~$</span><input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></div>
    </div>
    <div class="footer">Type <span class="acc">help</span> to see every command, or <span class="acc">open</span> to browse pages.</div>
  </div>
</div>

<script>
/* ======================================================================
   1. OPEN LINKS  -  add a page by adding one line to this array.
      { name:'short-name', href:'file-or-url.html', desc:'what it is', newTab:false }
   ====================================================================== */
const OPEN_LINKS = [
  { name:'BlockWelt', href:'modules/blockwelt/index.html', desc:'Retro Minecraft like thing', newTab:true },
  { name:'Snow Rider', href:'modules/snow-rider/index.html', desc:'Snow like thing', newTab:true },
  // { name:'my-page', href:'pages/my-page.html', desc:'Add yours here' },
];

/* ======================================================================
   2. EXTRA MODULE FILES  -  optional. List .js files that call
      registerCommand(...) and they are loaded on startup.
      e.g. MODULE_FILES = ['commands/games.js', 'commands/math.js']
   ====================================================================== */
const MODULE_FILES = [];

/* ======================================================================
   3. CORE ENGINE  -  you shouldn't need to edit below this line
   ====================================================================== */
const out = document.getElementById('out'), input = document.getElementById('input'), screen = document.getElementById('screen');
const COMMANDS = {}, ALIASES = {};
const history = []; let hIdx = 0; const startTime = Date.now();

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function print(html, cls=''){ const d=document.createElement('div'); d.className='line '+cls; d.innerHTML=html; out.appendChild(d); screen.scrollTop=screen.scrollHeight; return d; }
function println(text, cls=''){ return print(esc(text), cls); }
function registerCommand(c){ COMMANDS[c.name]=c; (c.aliases||[]).forEach(a=>ALIASES[a]=c.name); }
function resolve(n){ return COMMANDS[n] || COMMANDS[ALIASES[n]]; }

function run(line){
  line = line.trim(); if(!line) return;
  print(`<span class="grad">ez@platform:~$</span> ${esc(line)}`);
  history.push(line); hIdx = history.length;
  const [name, ...args] = line.split(/\s+/);
  const cmd = resolve(name.toLowerCase());
  if(!cmd){ println(`'${name}' is not a command. Type help to see the list.`, 'err'); return; }
  try { cmd.run(args, args.join(' ')); } catch(e){ println('Error: ' + e.message, 'err'); }
}

input.addEventListener('keydown', e => {
  if(e.key==='Enter'){ run(input.value); input.value=''; }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(hIdx>0) input.value = history[--hIdx]; }
  else if(e.key==='ArrowDown'){ e.preventDefault(); input.value = hIdx<history.length-1 ? history[++hIdx] : (hIdx=history.length, ''); }
  else if(e.key==='Tab'){
    e.preventDefault();
    const v = input.value.toLowerCase(), parts = v.split(/\s+/);
    if(parts.length===1){
      const m = Object.keys(COMMANDS).filter(n=>n.startsWith(v));
      if(m.length===1) input.value = m[0]+' '; else if(m.length>1) println(m.join('   '), 'dim');
    } else if(parts[0]==='open'){
      const m = OPEN_LINKS.filter(l=>l.name.startsWith(parts[1]||''));
      if(m.length===1) input.value = 'open '+m[0].name;
    }
  }
  else if(e.key==='l' && e.ctrlKey){ e.preventDefault(); out.innerHTML=''; }
});

/* ======================================================================
   4. COMMAND MODULES  -  copy any block to add a command.
      registerCommand({ name, aliases, desc, usage, run(args, rawText){} })
   ====================================================================== */

/* ---- System ---- */
registerCommand({ name:'help', aliases:['?','commands'], desc:'List commands, or help <command> for details', usage:'help [command]',
  run(args){
    if(args[0]){ const c=resolve(args[0]); if(!c) return println(`No command named '${args[0]}'.`,'err');
      print(`<span class="cmd-name">${esc(c.name)}</span>${esc(c.desc)}`);
      println('Usage:   '+(c.usage||c.name),'dim');
      if(c.aliases&&c.aliases.length) println('Aliases: '+c.aliases.join(', '),'dim'); return; }
    print('<span class="gold">Available commands</span>');
    Object.values(COMMANDS).sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>print(`<span class="cmd-name">${esc(c.name)}</span><span class="dim">${esc(c.desc)}</span>`));
    println('\nTip: help <command> shows usage. "open" lists every page you can jump to.','dim');
  }});
registerCommand({ name:'clear', aliases:['cls'], desc:'Clear the screen', run(){ out.innerHTML=''; }});
registerCommand({ name:'banner', desc:'Show the welcome banner', run(){ banner(); }});
registerCommand({ name:'history', desc:'Show commands you have run', run(){ history.forEach((h,i)=>println(String(i+1).padStart(3)+'  '+h,'dim')); }});
registerCommand({ name:'uptime', desc:'How long this console has been open', run(){ const s=Math.floor((Date.now()-startTime)/1000); println(`Up for ${Math.floor(s/60)}m ${s%60}s`,'ok'); }});
registerCommand({ name:'theme', desc:'Toggle light / dark mode', run(){ const l=document.body.classList.toggle('light-mode'); println('Theme: '+(l?'light':'dark'),'ok'); }});
registerCommand({ name:'prompt', desc:'Change the prompt name', usage:'prompt <name>', run(a){ if(!a[0]) return println('Usage: prompt <name>','err'); document.getElementById('promptText').textContent=a[0]+'@platform:~$'; println('Prompt updated.','ok'); }});

/* ---- Navigation: open ---- */
registerCommand({ name:'open', aliases:['go','goto'], desc:'List pages, or open one by name or number', usage:'open [name|number]',
  run(a){
    if(!a[0]){
      print('<span class="gold">Pages</span>  <span class="dim">(click a link, or type: open &lt;name&gt;)</span>');
      OPEN_LINKS.forEach((l,i)=>print(`<div class="link-card"><span class="dim">${i+1}.</span><a href="${esc(l.href)}" ${l.newTab?'target="_blank" rel="noopener"':''}>${esc(l.name)}</a><span class="dim">${esc(l.desc||'')}</span></div>`));
      return;
    }
    const q=a[0].toLowerCase();
    const l = OPEN_LINKS[parseInt(q,10)-1] || OPEN_LINKS.find(x=>x.name.toLowerCase()===q) || OPEN_LINKS.find(x=>x.name.toLowerCase().startsWith(q));
    if(!l) return println(`No page called '${a[0]}'. Type open to see the list.`,'err');
    println(`Opening ${l.name}...`,'ok');
    setTimeout(()=>{ l.newTab ? window.open(l.href,'_blank','noopener') : (location.href=l.href); },350);
  }});
registerCommand({ name:'url', desc:'Open any web address', usage:'url <address>', run(a){
  if(!a[0]) return println('Usage: url <address>','err');
  const u=/^https?:\/\//.test(a[0])?a[0]:'https://'+a[0]; println('Opening '+u,'ok'); window.open(u,'_blank','noopener'); }});

/* ---- Info ---- */
registerCommand({ name:'date', desc:'Show today\'s date', run(){ println(new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}),'acc'); }});
registerCommand({ name:'time', desc:'Show the current time', run(){ println(new Date().toLocaleTimeString(),'acc'); }});
registerCommand({ name:'whoami', desc:'Show browser info', run(){ println(`user      guest\nbrowser   ${navigator.userAgent.split(') ').pop()}\nscreen    ${innerWidth}x${innerHeight}\nlanguage  ${navigator.language}`,'acc'); }});

/* ---- Fun & random ---- */
registerCommand({ name:'echo', desc:'Repeat text back', usage:'echo <text>', run(a,r){ println(r); }});
registerCommand({ name:'roll', desc:'Roll dice (default 1d6)', usage:'roll [NdM]  e.g. roll 2d20', run(a){
  const m=(a[0]||'1d6').match(/^(\d+)d(\d+)$/i); if(!m) return println('Use the form NdM, like 2d20.','err');
  const n=Math.min(+m[1],100), s=+m[2]; if(s<2) return println('Dice need at least 2 sides.','err');
  const r=Array.from({length:n},()=>1+Math.floor(Math.random()*s)); println(`${r.join(' + ')} = ${r.reduce((x,y)=>x+y,0)}`,'ok'); }});
registerCommand({ name:'flip', desc:'Flip a coin', run(){ println(Math.random()<.5?'Heads':'Tails','ok'); }});
registerCommand({ name:'8ball', desc:'Ask the magic 8-ball', usage:'8ball <question>', run(){
  const r=['Yes.','No.','Definitely.','Not a chance.','Ask again later.','Signs point to yes.','Very doubtful.','Absolutely.','It is uncertain.'];
  println('🎱 '+r[Math.floor(Math.random()*r.length)],'gold'); }});
registerCommand({ name:'random', desc:'Random number between two values', usage:'random [min] [max]', run(a){
  const lo=+a[0]||1, hi=+a[1]||100; println(String(lo+Math.floor(Math.random()*(hi-lo+1))),'ok'); }});
registerCommand({ name:'fortune', desc:'Get a random fortune', run(){
  const f=['A small tool you build today saves an hour next week.','The bug is in the line you trust most.','Ship it, then polish it.','Something orange is in your future.','Clear the cache. Then clear your head.'];
  println(f[Math.floor(Math.random()*f.length)],'gold'); }});
registerCommand({ name:'matrix', desc:'Run a quick matrix rain burst', run(){
  const chars='01アイウエオカキクケコ'; for(let i=0;i<8;i++) println(Array.from({length:60},()=>chars[Math.floor(Math.random()*chars.length)]).join(''),'ok'); }});

/* ---- Text & math tools ---- */
registerCommand({ name:'calc', aliases:['math'], desc:'Evaluate a math expression', usage:'calc <expression>  e.g. calc (4+5)*2', run(a,r){
  if(!/^[\d+\-*/().%\s^]+$/.test(r)) return println('Only numbers and + - * / % ^ ( ) are allowed.','err');
  println('= '+Function('"use strict";return ('+r.replace(/\^/g,'**')+')')(),'ok'); }});
registerCommand({ name:'reverse', desc:'Reverse text', usage:'reverse <text>', run(a,r){ println([...r].reverse().join('')); }});
registerCommand({ name:'upper', desc:'UPPERCASE text', usage:'upper <text>', run(a,r){ println(r.toUpperCase()); }});
registerCommand({ name:'lower', desc:'lowercase text', usage:'lower <text>', run(a,r){ println(r.toLowerCase()); }});
registerCommand({ name:'b64', desc:'Base64 encode / decode', usage:'b64 <enc|dec> <text>', run(a){
  const mode=a.shift(), t=a.join(' '); if(!['enc','dec'].includes(mode)||!t) return println('Usage: b64 <enc|dec> <text>','err');
  println(mode==='enc'?btoa(unescape(encodeURIComponent(t))):decodeURIComponent(escape(atob(t))),'ok'); }});

/* ======================================================================
   5. STARTUP
   ====================================================================== */
function banner(){
  print('<span class="grad" style="font-size:1.4rem">EZ Platform Console</span>');
  println('Type "help" for commands. Type "open" to jump to a page.\n','dim');
}
MODULE_FILES.forEach(f=>{ const s=document.createElement('script'); s.src=f; s.onerror=()=>println(`Module failed to load: ${f}`,'err'); document.body.appendChild(s); });
banner(); input.focus();
</script>
</body>
</html>
