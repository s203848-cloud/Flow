<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Text Formatter</title><link rel="icon" type="image/x-icon" href="favcon.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}body{background:linear-gradient(135deg,#0a0a1a,#1a0a2e);color:#fff;min-height:100vh;padding:20px}.navbar{display:flex;justify-content:space-between;padding:15px 30px;background:rgba(20,20,35,.8);margin-bottom:30px;border-radius:10px}.back-btn{padding:8px 15px;background:rgba(255,128,0,.2);border:1px solid #ff8000;border-radius:5px;color:#ff8000;cursor:pointer;text-decoration:none}.container{max-width:900px;margin:0 auto}.section{background:rgba(20,20,35,.5);border:1px solid rgba(255,69,0,.2);border-radius:10px;padding:25px}textarea{width:100%;padding:15px;background:rgba(50,50,70,.4);border:1px solid rgba(255,128,0,.3);border-radius:8px;color:#fff;min-height:100px;margin:10px 0}.btn{padding:10px 20px;background:linear-gradient(to right,#ff7e00,#ff4500);border:none;border-radius:8px;color:#fff;cursor:pointer;margin:5px}</style></head><body><div class="navbar"><a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a><span style="font-size:1.5rem;font-weight:bold">Text Formatter</span></div><div class="container"><div class="section"><h2 style="margin-bottom:15px"><i class="fas fa-align-left"></i> Format Text</h2><textarea id="textInput" placeholder="Enter text..."></textarea><div><button class="btn" onclick="format('center')"><i class="fas fa-align-center"></i> Center</button><button class="btn" onclick="format('left')"><i class="fas fa-align-left"></i> Left</button><button class="btn" onclick="format('right')"><i class="fas fa-align-right"></i> Right</button><button class="btn" onclick="format('justify')"><i class="fas fa-align-justify"></i> Justify</button></div><div id="preview" style="background:rgba(50,50,70,.3);padding:15px;border-radius:8px;margin-top:15px;min-height:80px"></div></div></div><script>function format(type){const text=document.getElementById('textInput').value;const preview=document.getElementById('preview');preview.textContent=text;if(type==='center')preview.style.textAlign='center';else if(type==='left')preview.style.textAlign='left';else if(type==='right')preview.style.textAlign='right';else if(type==='justify')preview.style.textAlign='justify';}</script></body></html>
