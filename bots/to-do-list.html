<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | To-Do List</title>
<link rel="icon" type="image/x-icon" href="favcon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background: rgba(20, 20, 35, 0.85);
            border-bottom: 1px solid rgba(255, 69, 0, 0.3);
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .back-btn {
            padding: 10px 18px;
            background: rgba(255, 128, 0, 0.15);
            border: 1px solid #ff8000;
            border-radius: 8px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:hover {
            background: rgba(255, 128, 0, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 128, 0, 0.2);
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .section {
            background: rgba(20, 20, 35, 0.6);
            border: 1px solid rgba(255, 69, 0, 0.25);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            color: #ff8c42;
            font-size: 1.5rem;
        }
        
        .input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        input, input:focus {
            flex: 1;
            padding: 14px 18px;
            background: rgba(50, 50, 70, 0.5);
            border: 1px solid rgba(255, 128, 0, 0.4);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        input:focus {
            border-color: #ff7e00;
            box-shadow: 0 0 0 3px rgba(255, 126, 0, 0.2);
        }
        
        input::placeholder {
            color: #aaa;
        }
        
        .btn {
            padding: 14px 24px;
            background: linear-gradient(to right, #ff7e00, #ff4500);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(255, 126, 0, 0.4);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 10px 20px;
            background: rgba(50, 50, 70, 0.4);
            border: 1px solid rgba(255, 128, 0, 0.3);
            border-radius: 8px;
            color: #ddd;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover {
            background: rgba(255, 128, 0, 0.15);
        }
        
        .filter-btn.active {
            background: rgba(255, 128, 0, 0.25);
            border-color: #ff8000;
            color: #ff8000;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            background: rgba(30, 30, 45, 0.6);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 69, 0, 0.1);
        }
        
        .stat-item {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff8c42;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
        
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .todo-item {
            background: rgba(50, 50, 70, 0.4);
            padding: 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 128, 0, 0.15);
        }
        
        .todo-item:hover {
            background: rgba(50, 50, 70, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        
        .todo-item.done {
            opacity: 0.7;
            background: rgba(50, 50, 70, 0.25);
        }
        
        .todo-checkbox {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #ff7e00;
        }
        
        .todo-text {
            flex: 1;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .todo-item.done .todo-text {
            text-decoration: line-through;
            color: #aaa;
        }
        
        .todo-actions {
            display: flex;
            gap: 10px;
        }
        
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .edit-btn {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        
        .edit-btn:hover {
            background: rgba(255, 193, 7, 0.25);
        }
        
        .delete-btn {
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }
        
        .delete-btn:hover {
            background: rgba(255, 68, 68, 0.25);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #555;
        }
        
        .empty-state h3 {
            margin-bottom: 10px;
            color: #aaa;
        }
        
        .empty-state p {
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.5;
        }
        
        .edit-input {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 128, 0, 0.5);
            border-radius: 6px;
            color: #fff;
            flex: 1;
            font-size: 16px;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }
            
            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            
            .input-area {
                flex-direction: column;
            }
            
            .filters {
                justify-content: center;
            }
            
            .stats {
                flex-direction: column;
                gap: 15px;
            }
            
            .todo-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            
            .todo-actions {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Tools
        </a>
        <span style="font-size: 1.5rem; font-weight: bold;">
            <i class="fas fa-tasks"></i> Task Manager
        </span>
    </div>
    
    <div class="container">
        <div class="section">
            <h2 class="section-title">
                <i class="fas fa-list-check"></i> My Tasks
            </h2>
            
            <div class="input-area">
                <input type="text" id="newTask" placeholder="What needs to be done?">
                <button class="btn" id="addTaskBtn">
                    <i class="fas fa-plus"></i> Add Task
                </button>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalTasks">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="pendingTasks">0</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="completedTasks">0</div>
                    <div class="stat-label">Completed</div>
                </div>
            </div>
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All Tasks</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            
            <div class="todo-list" id="todoList">
                <!-- Tasks will be added here dynamically -->
            </div>
        </div>
        
        <div class="footer">
            <p>Tasks are saved automatically in your browser's local storage</p>
            <p>© 2023 Task Manager | Made with <i class="fas fa-heart" style="color:#ff4444;"></i></p>
        </div>
    </div>

    <script>
        // Task management
        let tasks = JSON.parse(localStorage.getItem('todoTasks')) || [];
        let currentFilter = 'all';
        
        // DOM elements
        const newTaskInput = document.getElementById('newTask');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const todoList = document.getElementById('todoList');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const totalTasksEl = document.getElementById('totalTasks');
        const pendingTasksEl = document.getElementById('pendingTasks');
        const completedTasksEl = document.getElementById('completedTasks');
        
        // Initialize the app
        function init() {
            renderTasks();
            updateStats();
            
            // Event listeners
            addTaskBtn.addEventListener('click', addTask);
            newTaskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask();
            });
            
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTasks();
                });
            });
        }
        
        // Add a new task
        function addTask() {
            const taskText = newTaskInput.value.trim();
            
            if (taskText) {
                const newTask = {
                    id: Date.now(),
                    text: taskText,
                    done: false,
                    createdAt: new Date().toISOString()
                };
                
                tasks.unshift(newTask); // Add to beginning
                saveTasks();
                renderTasks();
                updateStats();
                newTaskInput.value = '';
                newTaskInput.focus();
                
                // Show a brief visual feedback
                addTaskBtn.innerHTML = '<i class="fas fa-check"></i> Added!';
                setTimeout(() => {
                    addTaskBtn.innerHTML = '<i class="fas fa-plus"></i> Add Task';
                }, 1000);
            }
        }
        
        // Delete a task
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
            updateStats();
        }
        
        // Toggle task completion
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                task.completedAt = task.done ? new Date().toISOString() : null;
                saveTasks();
                renderTasks();
                updateStats();
            }
        }
        
        // Edit a task
        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            
            const taskElement = document.querySelector(`[data-id="${id}"]`);
            const taskTextElement = taskElement.querySelector('.todo-text');
            
            // Create input field for editing
            const editInput = document.createElement('input');
            editInput.type = 'text';
            editInput.className = 'edit-input';
            editInput.value = task.text;
            
            // Replace text with input
            taskTextElement.replaceWith(editInput);
            editInput.focus();
            editInput.select();
            
            // Save on Enter, cancel on Escape
            editInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    saveEdit(id, editInput.value);
                } else if (e.key === 'Escape') {
                    renderTasks();
                }
            });
            
            // Save on blur
            editInput.addEventListener('blur', () => {
                saveEdit(id, editInput.value);
            });
        }
        
        // Save edited task
        function saveEdit(id, newText) {
            const task = tasks.find(t => t.id === id);
            if (task && newText.trim()) {
                task.text = newText.trim();
                saveTasks();
                renderTasks();
            } else if (!newText.trim()) {
                // If empty text, delete the task
                deleteTask(id);
            }
        }
        
        // Save tasks to local storage
        function saveTasks() {
            localStorage.setItem('todoTasks', JSON.stringify(tasks));
        }
        
        // Update statistics
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.done).length;
            const pending = total - completed;
            
            totalTasksEl.textContent = total;
            completedTasksEl.textContent = completed;
            pendingTasksEl.textContent = pending;
        }
        
        // Render tasks based on current filter
        function renderTasks() {
            // Filter tasks based on current selection
            let filteredTasks = tasks;
            if (currentFilter === 'pending') {
                filteredTasks = tasks.filter(t => !t.done);
            } else if (currentFilter === 'completed') {
                filteredTasks = tasks.filter(t => t.done);
            }
            
            // Clear the list
            todoList.innerHTML = '';
            
            // Show empty state if no tasks
            if (filteredTasks.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                
                if (currentFilter === 'all' && tasks.length === 0) {
                    emptyState.innerHTML = `
                        <i class="fas fa-clipboard-list"></i>
                        <h3>No tasks yet</h3>
                        <p>Add your first task using the input above. Tasks will be saved automatically.</p>
                    `;
                } else if (currentFilter === 'pending') {
                    emptyState.innerHTML = `
                        <i class="fas fa-check-circle"></i>
                        <h3>No pending tasks</h3>
                        <p>All tasks are completed! Add more tasks or check completed tasks.</p>
                    `;
                } else if (currentFilter === 'completed') {
                    emptyState.innerHTML = `
                        <i class="fas fa-hourglass-half"></i>
                        <h3>No completed tasks</h3>
                        <p>Complete some tasks to see them here.</p>
                    `;
                }
                
                todoList.appendChild(emptyState);
                return;
            }
            
            // Render each task
            filteredTasks.forEach(task => {
                const taskElement = document.createElement('div');
                taskElement.className = `todo-item ${task.done ? 'done' : ''}`;
                taskElement.dataset.id = task.id;
                
                taskElement.innerHTML = `
                    <input type="checkbox" class="todo-checkbox" ${task.done ? 'checked' : ''} 
                           onchange="toggleTask(${task.id})">
                    <span class="todo-text">${escapeHtml(task.text)}</span>
                    <div class="todo-actions">
                        <div class="icon-btn edit-btn" onclick="editTask(${task.id})">
                            <i class="fas fa-edit"></i>
                        </div>
                        <div class="icon-btn delete-btn" onclick="deleteTask(${task.id})">
                            <i class="fas fa-trash"></i>
                        </div>
                    </div>
                `;
                
                todoList.appendChild(taskElement);
            });
        }
        
        // Helper function to escape HTML (prevents XSS)
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
