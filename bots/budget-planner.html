<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Planner · Income vs Expenses</title>
    <!-- Font Awesome 6 (free) for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Chart.js 3 for clean charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        /* ----- global reset & inherited template scheme ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #f0f0f0;
            min-height: 100vh;
            padding: 24px 20px;
        }

        /* orange accent / back button exactly as provided */
        .back-btn {
            padding: 8px 15px;
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, border-color 0.2s;
            font-weight: 500;
        }

        .back-btn:hover {
            background: rgba(255, 128, 0, 0.3);
            border-color: #ffaa33;
        }

        .back-btn i {
            font-size: 0.9rem;
        }

        /* ----- custom layout for budget planner ----- */
        .planner-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 0 30px;
        }

        h1 {
            font-weight: 400;
            font-size: 2rem;
            margin: 10px 0 20px 0;
            letter-spacing: 0.5px;
            border-left: 5px solid #ff8000;
            padding-left: 20px;
        }

        h1 span {
            font-weight: 300;
            color: #ffaa33;
        }

        /* summary cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 30px 0 35px;
        }

        .summary-card {
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 128, 0, 0.25);
            border-radius: 20px;
            padding: 22px 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: transform 0.15s;
        }

        .summary-card:hover {
            transform: translateY(-4px);
            border-color: #ff8000;
        }

        .card-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-label i {
            color: #ff8000;
            width: 20px;
        }

        .card-value {
            font-size: 2.2rem;
            font-weight: 500;
            color: white;
            line-height: 1.2;
        }

        .balance-positive { color: #6fcf97; }   /* soft green */
        .balance-negative { color: #ff7070; }   /* soft red for negative */

        /* form panel */
        .add-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 28px;
            padding: 28px 25px;
            margin: 30px 0 35px;
            border: 1px solid rgba(255,128,0,0.25);
            backdrop-filter: blur(4px);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 20px;
        }

        .input-group {
            flex: 1 1 180px;
            min-width: 160px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #ffaa66;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            background: #1e1a2b;
            border: 1px solid #3a2e4a;
            border-radius: 40px;
            padding: 14px 18px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #ff8000;
            background: #2a1f36;
            box-shadow: 0 0 0 2px rgba(255,128,0,0.2);
        }

        .input-group input[type="number"] {
            -moz-appearance: textfield;
            -webkit-appearance: textfield;
            appearance: textfield;
        }
        .input-group input[type="number"]::-webkit-outer-spin-button,
        .input-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .add-btn {
            background: #ff8000;
            border: none;
            border-radius: 40px;
            padding: 14px 32px;
            font-weight: 600;
            font-size: 1rem;
            color: #0a0a1a;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            border: 1px solid #ffaa33;
            flex: 0 0 auto;
        }

        .add-btn:hover {
            background: #ff9933;
            transform: scale(1.02);
            box-shadow: 0 0 15px #ff8000;
        }

        /* transactions + chart area */
        .data-row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 25px;
            margin-top: 25px;
        }

        .transactions-col {
            flex: 2;
            min-width: 320px;
            background: rgba(10, 8, 20, 0.7);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255,128,0,0.2);
            backdrop-filter: blur(4px);
            max-height: 400px;
            overflow-y: auto;
        }

        .transactions-col h3 {
            font-weight: 400;
            border-bottom: 1px solid #ff8000;
            padding-bottom: 12px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .transactions-col h3 i {
            color: #ff8000;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            margin: 8px 0;
            padding: 12px 16px;
            border-radius: 40px;
            border-left: 4px solid transparent;
            transition: 0.15s;
        }

        .transaction-item.income {
            border-left-color: #2ecc71;
        }
        .transaction-item.expense {
            border-left-color: #ff8000;
        }

        .trans-desc {
            display: flex;
            align-items: center;
            gap: 12px;
            word-break: break-word;
            flex: 2;
        }

        .trans-desc i {
            width: 24px;
            color: #ff8000;
            font-size: 1.1rem;
        }

        .trans-amount {
            font-weight: 600;
            margin: 0 15px;
            white-space: nowrap;
        }

        .income .trans-amount {
            color: #6fcf97;
        }
        .expense .trans-amount {
            color: #ffb08a;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #aa8bb0;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px 10px;
            border-radius: 30px;
            transition: 0.2s;
        }

        .delete-btn:hover {
            color: #ff6060;
            background: rgba(255,96,96,0.15);
        }

        .empty-list {
            text-align: center;
            color: #7a6b8a;
            padding: 30px 0;
            font-style: italic;
        }

        .chart-col {
            flex: 1.2;
            min-width: 280px;
            background: rgba(10, 8, 20, 0.7);
            border-radius: 24px;
            padding: 20px 15px;
            border: 1px solid rgba(255,128,0,0.2);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
        }

        .chart-col h3 {
            font-weight: 400;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ff8000;
            padding-bottom: 10px;
        }

        .chart-col h3 i {
            color: #ff8000;
        }

        canvas {
            max-height: 240px;
            max-width: 100%;
            margin: 0 auto;
        }

        /* small text */
        .footnote {
            text-align: right;
            color: #5f5570;
            margin-top: 25px;
            font-size: 0.8rem;
        }

        /* scrollbar style */
        .transactions-col::-webkit-scrollbar {
            width: 8px;
        }
        .transactions-col::-webkit-scrollbar-track {
            background: #1e1a2b;
            border-radius: 10px;
        }
        .transactions-col::-webkit-scrollbar-thumb {
            background: #ff8000;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- navbar with back button (exact style from prompt) -->
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>

    <main class="planner-container">
        <h1>Budget Planner <span>· income vs expenses</span></h1>

        <!-- summary cards: dynamic values injected via JS -->
        <div class="summary-grid" id="summaryCards">
            <div class="summary-card">
                <div class="card-label"><i class="fas fa-circle-dollar"></i> Total Income</div>
                <div class="card-value" id="totalIncomeDisplay">$0.00</div>
            </div>
            <div class="summary-card">
                <div class="card-label"><i class="fas fa-cart-shopping"></i> Total Expenses</div>
                <div class="card-value" id="totalExpenseDisplay">$0.00</div>
            </div>
            <div class="summary-card">
                <div class="card-label"><i class="fas fa-scale-balanced"></i> Balance</div>
                <div class="card-value" id="balanceDisplay">$0.00</div>
            </div>
        </div>

        <!-- form to add new transaction -->
        <div class="add-panel">
            <div class="form-row">
                <div class="input-group">
                    <label for="descInput"><i class="fas fa-pen"></i> Description</label>
                    <input type="text" id="descInput" placeholder="e.g. Salary, Groceries..." maxlength="50">
                </div>
                <div class="input-group">
                    <label for="amountInput"><i class="fas fa-dollar-sign"></i> Amount</label>
                    <input type="number" id="amountInput" min="0.01" step="0.01" placeholder="0.00">
                </div>
                <div class="input-group">
                    <label for="typeSelect"><i class="fas fa-arrows-spin"></i> Type</label>
                    <select id="typeSelect">
                        <option value="income">💰 Income</option>
                        <option value="expense">💸 Expense</option>
                    </select>
                </div>
                <button class="add-btn" id="addBtn"><i class="fas fa-plus-circle"></i> Add entry</button>
            </div>
        </div>

        <!-- transactions list and chart side by side -->
        <div class="data-row">
            <!-- left: transaction history -->
            <div class="transactions-col">
                <h3><i class="fas fa-list-ul"></i> Recent transactions</h3>
                <div id="transactionList"></div>  <!-- dynamic rows -->
            </div>

            <!-- right: doughnut chart income vs expense -->
            <div class="chart-col">
                <h3><i class="fas fa-chart-pie"></i> Income vs Expense</h3>
                <canvas id="budgetChart" width="300" height="240"></canvas>
                <div style="text-align: center; margin-top: 15px; color: #b5a6c9;">
                    <span style="color:#6fcf97;">● Income</span> <span style="color:#ff8000;">● Expense</span>
                </div>
            </div>
        </div>
        <div class="footnote">
            <i class="fas fa-database"></i> data saved automatically in your browser
        </div>
    </main>

    <script>
        (function() {
            // ---------- strict, modern, production-style ----------
            'use strict';

            // --- constants & storage key ---
            const STORAGE_KEY = 'budget_planner_transactions';
            // Chart.js instance (will be initialized later)
            let chartInstance = null;

            // --- in-memory data ---
            let transactions = [];

            // --- DOM references ---
            const totalIncomeEl = document.getElementById('totalIncomeDisplay');
            const totalExpenseEl = document.getElementById('totalExpenseDisplay');
            const balanceEl = document.getElementById('balanceDisplay');
            const transactionListEl = document.getElementById('transactionList');
            const descInput = document.getElementById('descInput');
            const amountInput = document.getElementById('amountInput');
            const typeSelect = document.getElementById('typeSelect');
            const addBtn = document.getElementById('addBtn');
            const chartCanvas = document.getElementById('budgetChart');

            // --- helper: format as USD (simple) ---
            const formatMoney = (value) => {
                return value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            };

            // --- load from localStorage ---
            const loadFromStorage = () => {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        // basic validation: must be array
                        if (Array.isArray(parsed)) {
                            // ensure each item has required fields, filter out malformed
                            transactions = parsed.filter(t => 
                                t && typeof t === 'object' && 
                                typeof t.id === 'number' && 
                                typeof t.description === 'string' && 
                                typeof t.amount === 'number' && 
                                (t.type === 'income' || t.type === 'expense')
                            );
                        }
                    }
                } catch (e) {
                    console.warn('Failed to load from localStorage', e);
                    transactions = [];
                }
                // always fallback to empty array
                if (!transactions.length) {
                    // seed some demo entries for better first experience (optional)
                    transactions = [
                        { id: Date.now() - 100000, description: 'Salary', amount: 3200.00, type: 'income' },
                        { id: Date.now() - 200000, description: 'Rent', amount: 1200.00, type: 'expense' },
                        { id: Date.now() - 150000, description: 'Groceries', amount: 215.30, type: 'expense' },
                        { id: Date.now() - 50000, description: 'Freelance', amount: 400.00, type: 'income' },
                    ];
                }
            };

            // --- save to localStorage ---
            const persistToStorage = () => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
                } catch (e) {}
            };

            // --- totals calculations ---
            const calcTotals = () => {
                let income = 0, expense = 0;
                for (let t of transactions) {
                    if (t.type === 'income') income += t.amount;
                    else expense += t.amount;
                }
                return { income, expense, balance: income - expense };
            };

            // --- update summary cards and chart, and list ---
            const refreshUI = () => {
                const { income, expense, balance } = calcTotals();

                // update summary cards
                totalIncomeEl.textContent = '$' + formatMoney(income);
                totalExpenseEl.textContent = '$' + formatMoney(expense);
                balanceEl.textContent = '$' + formatMoney(balance);
                // color balance based on sign
                if (balance >= 0) {
                    balanceEl.className = 'card-value balance-positive';
                } else {
                    balanceEl.className = 'card-value balance-negative';
                }

                // render transaction list
                renderTransactionList();

                // update chart
                updateChart(income, expense);

                // persist after every change
                persistToStorage();
            };

            // --- render the list of transactions with delete buttons ---
            const renderTransactionList = () => {
                if (!transactions.length) {
                    transactionListEl.innerHTML = '<div class="empty-list"><i class="fas fa-receipt"></i> No transactions yet. Add one above.</div>';
                    return;
                }

                // sort by newest first (by id descending)
                const sorted = [...transactions].sort((a,b) => b.id - a.id);

                let html = '';
                for (let t of sorted) {
                    const icon = t.type === 'income' ? 'fa-arrow-trend-up' : 'fa-cart-shopping';
                    const sign = t.type === 'income' ? '' : '−';  // minus sign for expense
                    const amountClass = t.type;
                    html += `
                        <div class="transaction-item ${t.type}" data-id="${t.id}">
                            <div class="trans-desc">
                                <i class="fas ${icon}"></i>
                                <span>${escapeHtml(t.description) || 'untitled'}</span>
                            </div>
                            <div class="trans-amount">${sign}$${formatMoney(t.amount)}</div>
                            <button class="delete-btn" data-id="${t.id}" title="delete transaction"><i class="fas fa-trash-can"></i></button>
                        </div>
                    `;
                }

                transactionListEl.innerHTML = html;

                // attach delete events to each delete button (delegation also possible, but direct binding is simple)
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = Number(btn.getAttribute('data-id'));
                        deleteTransactionById(id);
                    });
                });
            };

            // simple escape to avoid XSS from description
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // --- delete transaction by id ---
            const deleteTransactionById = (id) => {
                transactions = transactions.filter(t => t.id !== id);
                refreshUI();
            };

            // --- chart update (creates or updates doughnut) ---
            const updateChart = (income, expense) => {
                if (!chartCanvas) return;

                const ctx = chartCanvas.getContext('2d');

                // destroy previous chart instance if exists (clean)
                if (chartInstance) {
                    chartInstance.destroy();
                }

                // if both zero, show placeholder empty slice
                const dataValues = (income === 0 && expense === 0) ? [1] : [income, expense];
                const backgroundColors = (income === 0 && expense === 0) 
                    ? ['#3a2e4a'] 
                    : ['#2ecc71', '#ff8000'];  // green / orange

                const labels = (income === 0 && expense === 0) 
                    ? ['no data'] 
                    : ['Income', 'Expenses'];

                chartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: dataValues,
                            backgroundColor: backgroundColors,
                            borderColor: 'rgba(20,15,30,0.5)',
                            borderWidth: 2,
                            borderRadius: 6,
                            spacing: 8,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        cutout: '65%',
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: (context) => {
                                        const val = context.raw;
                                        const total = context.dataset.data.reduce((a,b) => a + b, 0);
                                        const percentage = total > 0 ? ((val / total) * 100).toFixed(1) : '0';
                                        return ` $${formatMoney(val)} (${percentage}%)`;
                                    }
                                }
                            }
                        },
                        layout: { padding: 8 }
                    }
                });
            };

            // --- add new transaction from form ---
            const addTransactionFromForm = () => {
                // validate description
                const description = descInput.value.trim();
                if (!description) {
                    alert('Please enter a description');
                    descInput.focus();
                    return;
                }

                // validate amount
                const amountRaw = amountInput.value.trim();
                if (!amountRaw) {
                    alert('Please enter an amount');
                    amountInput.focus();
                    return;
                }
                const amount = parseFloat(amountRaw);
                if (isNaN(amount) || amount <= 0) {
                    alert('Amount must be a positive number');
                    amountInput.value = '';
                    amountInput.focus();
                    return;
                }

                const type = typeSelect.value; // 'income' or 'expense'

                // create new transaction object
                const newTransaction = {
                    id: Date.now(),   // unique enough
                    description: description,
                    amount: amount,
                    type: type,
                };

                transactions.push(newTransaction);
                
                // clear inputs (keep type as default income, but reset description/amount)
                descInput.value = '';
                amountInput.value = '';
                // optionally focus back to description
                descInput.focus();

                // refresh everything
                refreshUI();
            };

            // --- initial load & set up listeners ---
            const initApp = () => {
                loadFromStorage();
                refreshUI();

                // add button click
                addBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    addTransactionFromForm();
                });

                // allow pressing Enter in fields (optional)
                [descInput, amountInput].forEach(field => {
                    field.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            addTransactionFromForm();
                        }
                    });
                });
            };

            // start everything after DOM ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initApp);
            } else {
                initApp();
            }

        })();
    </script>
</body>
</html>
