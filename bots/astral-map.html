<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Astral Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(20, 20, 35, 0.9);
            border-bottom: 1px solid rgba(255, 69, 0, 0.2);
            position: relative;
            z-index: 100;
        }

        .back-btn {
            padding: 8px 15px;
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 128, 0, 0.3);
            transform: translateY(-1px);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-btn {
            padding: 8px 15px;
            background: rgba(50, 50, 70, 0.4);
            border: 1px solid rgba(255, 128, 0, 0.3);
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: rgba(255, 128, 0, 0.2);
            transform: translateY(-1px);
        }

        .fullscreen-btn {
            padding: 8px 15px;
            background: rgba(255, 69, 0, 0.2);
            border: 1px solid #ff4500;
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            transition: all 0.3s;
        }

        .fullscreen-btn:hover {
            background: rgba(255, 69, 0, 0.3);
            transform: translateY(-1px);
        }

        .search-container {
            position: relative;
            margin-left: 15px;
        }

        .search-input {
            padding: 8px 15px 8px 35px;
            background: rgba(50, 50, 70, 0.4);
            border: 1px solid rgba(255, 128, 0, 0.3);
            border-radius: 5px;
            color: #fff;
            width: 200px;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff8000;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 73px);
        }

        .sidebar {
            width: 300px;
            background: rgba(20, 20, 35, 0.7);
            border-right: 1px solid rgba(255, 69, 0, 0.2);
            padding: 20px;
            overflow-y: auto;
            transition: transform 0.3s;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-section {
            background: rgba(50, 50, 70, 0.3);
            border: 1px solid rgba(255, 128, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .filter-group {
            margin: 10px 0;
        }

        .filter-label {
            display: block;
            margin-bottom: 5px;
            color: #ff8000;
            font-size: 0.9rem;
        }

        .filter-checkbox {
            margin-right: 8px;
            accent-color: #ff8000;
        }

        .star-map-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .star-map {
            width: 4000px;
            height: 2000px;
            position: relative;
            transform-origin: center center;
            transition: transform 0.1s;
        }

        .constellation {
            position: absolute;
            pointer-events: none;
        }

        .constellation-line {
            stroke: rgba(100, 100, 200, 0.3);
            stroke-width: 1;
            fill: none;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2;
        }

        .star:hover, .star.highlighted {
            transform: scale(2);
            box-shadow: 0 0 20px currentColor;
            z-index: 10;
        }

        .star-label {
            position: absolute;
            color: #ff8000;
            font-size: 0.8rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(20, 20, 35, 0.8);
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid rgba(255, 128, 0, 0.3);
        }

        .star:hover .star-label {
            opacity: 1;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 1;
        }

        .planet:hover, .planet.highlighted {
            transform: scale(1.5);
            box-shadow: 0 0 15px currentColor;
            z-index: 9;
        }

        .planet-label {
            position: absolute;
            color: #4caf50;
            font-size: 0.8rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(20, 20, 35, 0.8);
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .planet:hover .planet-label {
            opacity: 1;
        }

        .detail-panel {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 350px;
            background: rgba(20, 20, 35, 0.9);
            border: 1px solid rgba(255, 128, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            display: none;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .detail-panel.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #ff8000;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 50;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(255, 128, 0, 0.3);
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .zoom-btn:hover {
            background: rgba(255, 128, 0, 0.2);
            transform: scale(1.1);
        }

        .zoom-level {
            position: absolute;
            bottom: 100px;
            right: 20px;
            background: rgba(20, 20, 35, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 128, 0, 0.3);
            color: #ff8000;
            font-size: 0.9rem;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 35, 0.8);
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid rgba(255, 128, 0, 0.3);
            color: #ff8000;
            font-size: 0.8rem;
            max-width: 300px;
        }

        .object-counter {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(20, 20, 35, 0.8);
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid rgba(255, 128, 0, 0.3);
            color: #ff8000;
            font-size: 0.9rem;
        }

        /* Star type colors */
        .star.main-sequence { color: #87ceeb; background-color: #87ceeb; }
        .star.red-giant { color: #ff4500; background-color: #ff4500; }
        .star.blue-giant { color: #1e90ff; background-color: #1e90ff; }
        .star.white-dwarf { color: #f0f8ff; background-color: #f0f8ff; }
        .star.neutron { color: #ff69b4; background-color: #ff69b4; }
        .star.supergiant { color: #ffd700; background-color: #ffd700; }

        /* Planet type colors */
        .planet.terrestrial { color: #8b4513; background-color: #8b4513; }
        .planet.gas-giant { color: #ffa500; background-color: #ffa500; }
        .planet.ice-giant { color: #00bfff; background-color: #00bfff; }
        .planet.exoplanet { color: #9acd32; background-color: #9acd32; }
        .planet.dwarf { color: #a9a9a9; background-color: #a9a9a9; }

        /* Constellation colors */
        .constellation-label {
            position: absolute;
            color: rgba(100, 100, 200, 0.7);
            font-size: 0.9rem;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

            <div class="sidebar-section">

                <p style="color: #ddd; margin-bottom: 8px;"><i class="fas fa-search"></i> Scroll to zoom</p>

        <div class="star-map-container" id="mapContainer">

            <div class="object-counter" id="objectCounter"></div>
            <div class="instructions">

        // Initialize variables

        // Generate stars
        function generateStars() {
            stars.forEach(star => {
                const size = Math.max(2, 6 - (star.magnitude / 2));
                
                const starEl = document.createElement('div');
                starEl.className = `star ${star.type}`;
                starEl.style.width = `${size}px`;
                starEl.style.height = `${size}px`;
                starEl.style.left = `${star.x}px`;
                starEl.style.top = `${star.y}px`;
                starEl.title = star.name;
                starEl.dataset.id = star.id;
                
                const label = document.createElement('div');
                label.className = 'star-label';
                label.textContent = star.name;
                label.style.left = `${size + 5}px`;
                label.style.top = `${-size}px`;
                
                starEl.appendChild(label);
                starMap.appendChild(starEl);
                
                // Add click event
                starEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showStarDetails(star);
                });
            });
        }

        // Generate planets
        function generatePlanets() {
            planets.forEach(planet => {
                const size = planet.type === 'gas-giant' ? 8 : 
                            planet.type === 'ice-giant' ? 7 : 
                            planet.type === 'exoplanet' ? 6 : 5;
                
                const planetEl = document.createElement('div');
                planetEl.className = `planet ${planet.type}`;
                planetEl.style.width = `${size}px`;
                planetEl.style.height = `${size}px`;
                planetEl.style.left = `${planet.x}px`;
                planetEl.style.top = `${planet.y}px`;
                planetEl.title = planet.name;
                planetEl.dataset.id = planet.id;
                
                const label = document.createElement('div');
                label.className = 'planet-label';
                label.textContent = planet.name;
                label.style.left = `${size + 5}px`;
                label.style.top = `${-size}px`;
                
                planetEl.appendChild(label);
                starMap.appendChild(planetEl);
                
                // Add click event
                planetEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showPlanetDetails(planet);
                });
            });
        }

        // Generate constellations
        function generateConstellations() {
            constellations.forEach(constellation => {
                // Create constellation lines
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.classList.add('constellation');
                svg.style.left = `${constellation.points[0][0] - 10}px`;
                svg.style.top = `${constellation.points[0][1] - 10}px`;
                svg.style.width = '200px';
                svg.style.height = '200px';
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                let pathData = `M 10,10 `;
                
                for (let i = 1; i < constellation.points.length; i++) {
                    const dx = constellation.points[i][0] - constellation.points[0][0];
                    const dy = constellation.points[i][1] - constellation.points[0][1];
                    pathData += `L ${dx + 10} ${dy + 10} `;
                }
                
                path.setAttribute('d', pathData);
                path.classList.add('constellation-line');
                svg.appendChild(path);
                starMap.appendChild(svg);
                
                // Add constellation label
                const label = document.createElement('div');
                label.className = 'constellation-label';
                label.textContent = constellation.name;
                label.style.left = `${constellation.points[2][0]}px`;
                label.style.top = `${constellation.points[2][1] - 20}px`;
                starMap.appendChild(label);
                
                // Add click event to label
                label.addEventListener('click', () => {
                    showConstellationDetails(constellation);
                });
            });
        }

        // Show star details
        function showStarDetails(star) {
            detailTitle.textContent = star.name;
            detailContent.innerHTML = `
                <p><strong>Type:</strong> ${star.type.replace('-', ' ').toUpperCase()}</p>
                <p><strong>Apparent Magnitude:</strong> ${star.magnitude}</p>
                <p><strong>Description:</strong> ${star.description}</p>
                <p><strong>Coordinates:</strong> X: ${star.x}, Y: ${star.y}</p>
            `;
            detailPanel.classList.add('show');
            
            // Highlight the star
            document.querySelectorAll('.star, .planet').forEach(el => {
                el.classList.remove('highlighted');
            });
            const starEl = document.querySelector(`.star[data-id="${star.id}"]`);
            if (starEl) starEl.classList.add('highlighted');
        }

        // Show planet details
        function showPlanetDetails(planet) {
            detailTitle.textContent = planet.name;
            detailContent.innerHTML = `
                <p><strong>Type:</strong> ${planet.type.replace('-', ' ').toUpperCase()}</p>
                <p><strong>Description:</strong> ${planet.description}</p>
                <p><strong>Coordinates:</strong> X: ${planet.x}, Y: ${planet.y}</p>
            `;
            detailPanel.classList.add('show');
            
            // Highlight the planet
            document.querySelectorAll('.star, .planet').forEach(el => {
                el.classList.remove('highlighted');
            });
            const planetEl = document.querySelector(`.planet[data-id="${planet.id}"]`);
            if (planetEl) planetEl.classList.add('highlighted');
        }

        // Show constellation details
        function showConstellationDetails(constellation) {
            detailTitle.textContent = constellation.name;
            detailContent.innerHTML = `
                <p><strong>Description:</strong> ${constellation.description}</p>
                <p><strong>Number of Points:</strong> ${constellation.points.length}</p>
                <p><strong>Shape:</strong> ${constellation.points.length}-point constellation</p>
            `;
            detailPanel.classList.add('show');
        }

        // Update view transform
        function updateView() {
            starMap.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${zoom})`;
            zoomLevel.textContent = `${zoom.toFixed(1)}x`;
            updateObjectCounter();
        }

        // Zoom in
        function zoomIn() {
            zoom *= 1.2;
            updateView();
        }

        // Zoom out
        function zoomOut() {
            zoom /= 1.2;
            updateView();
        }

        // Reset view
        function resetView() {
            zoom = 1;
            offsetX = 0;
            offsetY = 0;
            updateView();
        }

        // Update object counter
        function updateObjectCounter() {
            const visibleStars = document.querySelectorAll('.star:not([style*="display: none"])').length;
            const visiblePlanets = document.querySelectorAll('.planet:not([style*="display: none"])').length;
            objectCounter.textContent = `Stars: ${visibleStars} | Planets: ${visiblePlanets}`;
            
            // Update sidebar stats
            document.getElementById('totalStars').textContent = stars.length;
            document.getElementById('totalPlanets').textContent = planets.length;
            document.getElementById('totalConstellations').textContent = constellations.length;
            document.getElementById('visibleObjects').textContent = visibleStars + visiblePlanets;
        }

        // Initialize filters
        function initFilters() {
            const checkboxes = document.querySelectorAll('.filter-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', applyFilters);
            });
        }

        // Apply filters
        function applyFilters() {
            const showMainSeq = document.getElementById('filterMainSeq').checked;
            const showRedGiant = document.getElementById('filterRedGiant').checked;
            const showBlueGiant = document.getElementById('filterBlueGiant').checked;
            const showWhiteDwarf = document.getElementById('filterWhiteDwarf').checked;
            const showSupergiant = document.getElementById('filterSupergiant').checked;
            
            const showTerrestrial = document.getElementById('filterTerrestrial').checked;
            const showGasGiant = document.getElementById('filterGasGiant').checked;
            const showIceGiant = document.getElementById('filterIceGiant').checked;
            const showExoplanet = document.getElementById('filterExoplanet').checked;
            const showDwarf = document.getElementById('filterDwarf').checked;
            
            const showConstellations = document.getElementById('filterConstellations').checked;
            const showLabels = document.getElementById('filterLabels').checked;
            
            // Filter stars
            document.querySelectorAll('.star').forEach(star => {
                const type = star.classList[1];
                let visible = false;
                
                if (type === 'main-sequence' && showMainSeq) visible = true;
                if (type === 'red-giant' && showRedGiant) visible = true;
                if (type === 'blue-giant' && showBlueGiant) visible = true;
                if (type === 'white-dwarf' && showWhiteDwarf) visible = true;
                if (type === 'supergiant' && showSupergiant) visible = true;
                
                star.style.display = visible ? 'block' : 'none';
            });
            
            // Filter planets
            document.querySelectorAll('.planet').forEach(planet => {
                const type = planet.classList[1];
                let visible = false;
                
                if (type === 'terrestrial' && showTerrestrial) visible = true;
                if (type === 'gas-giant' && showGasGiant) visible = true;
                if (type === 'ice-giant' && showIceGiant) visible = true;
                if (type === 'exoplanet' && showExoplanet) visible = true;
                if (type === 'dwarf' && showDwarf) visible = true;
                
                planet.style.display = visible ? 'block' : 'none';
            });
            
            // Filter constellations
            document.querySelectorAll('.constellation, .constellation-label').forEach(el => {
                el.style.display = showConstellations ? 'block' : 'none';
            });
            
            // Filter labels
            document.querySelectorAll('.star-label, .planet-label').forEach(label => {
                label.style.opacity = showLabels ? '0' : '0';
            });
            
            updateObjectCounter();
        }

        // Search functionality
        function initSearch() {
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase().trim();
                
                if (searchTerm === '') {
                    // Reset all highlights
                    document.querySelectorAll('.star, .planet').forEach(el => {
                        el.classList.remove('highlighted');
                    });
                    return;
                }
                
                // Search in stars
                stars.forEach(star => {
                    if (star.name.toLowerCase().includes(searchTerm)) {
                        const starEl = document.querySelector(`.star[data-id="${star.id}"]`);
                        if (starEl) {
                            starEl.classList.add('highlighted');
                            // Center view on found object
                            const rect = starMap.getBoundingClientRect();
                            const containerRect = mapContainer.getBoundingClientRect();
                            offsetX = -star.x * zoom + containerRect.width / 2;
                            offsetY = -star.y * zoom + containerRect.height / 2;
                            updateView();
                        }
                    }
                });
                
                // Search in planets
                planets.forEach(planet => {
                    if (planet.name.toLowerCase().includes(searchTerm)) {
                        const planetEl = document.querySelector(`.planet[data-id="${planet.id}"]`);
                        if (planetEl) {
                            planetEl.classList.add('highlighted');
                        }
                    }
                });
            });
        }

        // Initialize dragging
        function initDragging() {
            mapContainer.addEventListener('mousedown', (e) => {
                if (e.target.closest('.star, .planet, .constellation-label, .zoom-controls, .zoom-level, .instructions, .object-counter')) {
                    return;
                }
                
                isDragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
                mapContainer.style.cursor = 'grabbing';
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                
                offsetX += dx / zoom;
                offsetY += dy / zoom;
                
                lastX = e.clientX;
                lastY = e.clientY;
                
                updateView();
            });
            
            document.addEventListener('mouseup', () => {
                isDragging = false;
                mapContainer.style.cursor = 'default';
            });
            
            // Mouse wheel zoom
            mapContainer.addEventListener('wheel', (e) => {
                e.preventDefault();
                
                const rect = mapContainer.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                const worldX = (mouseX - offsetX) / zoom;
                const worldY = (mouseY - offsetY) / zoom;
                
                if (e.deltaY < 0) {
                    zoom *= 1.1;
                } else {
                    zoom /= 1.1;
                }
                
                // Keep zoom within bounds
                zoom = Math.max(0.1, Math.min(10, zoom));
                
                offsetX = mouseX - worldX * zoom;
                offsetY = mouseY - worldY * zoom;
                
                updateView();
            });
        }

        // Fullscreen functionality
        function initFullscreen() {
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                    fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i> Exit Fullscreen';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                        fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Fullscreen';
                    }
                }
            });
            
            // Update button text when exiting fullscreen with ESC
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Fullscreen';
                }
            });
        }

        // Initialize everything
        function init() {
            generateStars();
            generatePlanets();
            generateConstellations();
            initFilters();
            initSearch();
            initDragging();
            initFullscreen();
            updateView();
            updateObjectCounter();
            
            // Event listeners
            zoomInBtn.addEventListener('click', zoomIn);
            zoomOutBtn.addEventListener('click', zoomOut);
            resetViewBtn.addEventListener('click', resetView);
            closeDetails.addEventListener('click', () => {
                detailPanel.classList.remove('show');
                document.querySelectorAll('.star, .planet').forEach(el => {
                    el.classList.remove('highlighted');
                });
            });
            
            toggleSidebar.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
            });
            
            // Close details when clicking outside
            document.addEventListener('click', (e) => {
                if (!detailPanel.contains(e.target) && !e.target.closest('.star, .planet, .constellation-label')) {
                    detailPanel.classList.remove('show');
                    document.querySelectorAll('.star, .planet').forEach(el => {
                        el.classList.remove('highlighted');
                    });
                }
            });
            
            // Apply initial filters
            applyFilters();
        }

        // Start when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
