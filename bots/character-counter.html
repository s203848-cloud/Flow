<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Character Counter</title><link rel="icon" type="image/x-icon" href="favcon.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}body{background:linear-gradient(135deg,#0a0a1a,#1a0a2e);color:#fff;min-height:100vh;padding:20px}.navbar{display:flex;justify-content:space-between;padding:15px 30px;background:rgba(20,20,35,.8);margin-bottom:30px;border-radius:10px}.back-btn{padding:8px 15px;background:rgba(255,128,0,.2);border:1px solid #ff8000;border-radius:5px;color:#ff8000;cursor:pointer;text-decoration:none}.container{max-width:900px;margin:0 auto}.section{background:rgba(20,20,35,.5);border:1px solid rgba(255,69,0,.2);border-radius:10px;padding:25px}textarea{width:100%;min-height:150px;padding:15px;background:rgba(50,50,70,.4);border:1px solid rgba(255,128,0,.3);border-radius:8px;color:#fff;resize:vertical}textarea::placeholder{color:#888}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-top:20px}.stat{background:rgba(50,50,70,.3);border:1px solid rgba(255,128,0,.2);border-radius:8px;padding:15px;text-align:center}.stat-label{color:#aaa;font-size:.9rem;margin-bottom:8px}.stat-value{font-size:2rem;font-weight:bold;color:#ff8000}</style></head><body><div class="navbar"><a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a><span style="font-size:1.5rem;font-weight:bold">Character Counter</span></div><div class="container"><div class="section"><h2 style="margin-bottom:15px"><i class="fas fa-hashtag"></i> Count Characters</h2><textarea id="textInput" placeholder="Type or paste text..." oninput="updateCount()"></textarea><div class="stats"><div class="stat"><div class="stat-label">Characters</div><div class="stat-value" id="charCount">0</div></div><div class="stat"><div class="stat-label">Spaces</div><div class="stat-value" id="spaceCount">0</div></div><div class="stat"><div class="stat-label">No Spaces</div><div class="stat-value" id="noSpaceCount">0</div></div></div></div></div><script>function updateCount(){const text=document.getElementById('textInput').value;const chars=text.length;const spaces=text.split(' ').length-1;const noSpaces=text.replace(/ /g,'').length;document.getElementById('charCount').textContent=chars;document.getElementById('spaceCount').textContent=spaces;document.getElementById('noSpaceCount').textContent=noSpaces;}</script></body></html>
