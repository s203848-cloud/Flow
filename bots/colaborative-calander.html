<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Collaborative Calendar</title>
<link rel="icon" type="image/x-icon" href="favcon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 128, 0, 0.2);
        }
        
        .back-btn {
            padding: 8px 15px;
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:hover {
            background: rgba(255, 128, 0, 0.3);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .role-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .admin-badge {
            background: rgba(255, 50, 50, 0.2);
            color: #ff6666;
            border: 1px solid #ff6666;
        }
        
        .editor-badge {
            background: rgba(50, 150, 255, 0.2);
            color: #66aaff;
            border: 1px solid #66aaff;
        }
        
        .viewer-badge {
            background: rgba(100, 200, 100, 0.2);
            color: #88cc88;
            border: 1px solid #88cc88;
        }
        
        .container {
            display: flex;
            gap: 20px;
            height: calc(100vh - 120px);
        }
        
        .sidebar {
            width: 280px;
            background: rgba(20, 20, 40, 0.7);
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid rgba(255, 128, 0, 0.1);
        }
        
        .calendar-main {
            flex: 1;
            background: rgba(20, 20, 40, 0.7);
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid rgba(255, 128, 0, 0.1);
        }
        
        .section-title {
            margin-bottom: 15px;
            color: #ff8000;
            font-size: 1.2rem;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 128, 0, 0.3);
        }
        
        .user-list, .template-list {
            list-style: none;
            margin-bottom: 25px;
        }
        
        .user-item, .template-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .user-item:hover, .template-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(3px);
        }
        
        .user-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .user-name {
            flex: 1;
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .nav-btn {
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            color: #ff8000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .nav-btn:hover {
            background: rgba(255, 128, 0, 0.3);
        }
        
        .current-month {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffb366;
        }
        
        .view-options {
            display: flex;
            gap: 10px;
        }
        
        .view-btn {
            padding: 6px 15px;
            background: rgba(100, 100, 200, 0.2);
            border: 1px solid #6666cc;
            color: #aaaaff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        .view-btn.active {
            background: rgba(100, 100, 200, 0.4);
            color: #ccccff;
            font-weight: 600;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .calendar-day-header {
            padding: 12px;
            background: rgba(40, 40, 80, 0.8);
            text-align: center;
            font-weight: 600;
            color: #ffb366;
        }
        
        .calendar-day {
            min-height: 120px;
            background: rgba(30, 30, 60, 0.7);
            padding: 8px;
            overflow-y: auto;
            transition: background 0.2s;
        }
        
        .calendar-day:hover {
            background: rgba(40, 40, 80, 0.7);
        }
        
        .day-number {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #ccccff;
        }
        
        .event {
            padding: 5px 8px;
            margin-bottom: 5px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            border-left: 3px solid;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        
        .event:hover {
            filter: brightness(1.2);
        }
        
        .add-event-btn {
            margin-top: 5px;
            padding: 3px 6px;
            background: rgba(255, 128, 0, 0.1);
            border: 1px dashed #ff8000;
            color: #ff8000;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
            text-align: center;
        }
        
        .add-event-btn:hover {
            background: rgba(255, 128, 0, 0.2);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #151530, #251545);
            width: 90%;
            max-width: 500px;
            border-radius: 10px;
            padding: 25px;
            border: 1px solid rgba(255, 128, 0, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .modal-title {
            color: #ff8000;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 5px;
            color: #ccccff;
        }
        
        .form-input, .form-select {
            width: 100%;
            padding: 10px;
            background: rgba(20, 20, 40, 0.8);
            border: 1px solid rgba(255, 128, 0, 0.3);
            border-radius: 5px;
            color: #fff;
        }
        
        .color-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .color-option.selected {
            border-color: #fff;
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-weight: 600;
        }
        
        .btn-primary {
            background: rgba(255, 128, 0, 0.8);
            color: #fff;
        }
        
        .btn-primary:hover {
            background: rgba(255, 128, 0, 1);
        }
        
        .btn-secondary {
            background: rgba(100, 100, 150, 0.5);
            color: #ccccff;
        }
        
        .btn-secondary:hover {
            background: rgba(100, 100, 150, 0.7);
        }
        
        .today {
            background: rgba(255, 128, 0, 0.1);
            border: 1px solid rgba(255, 128, 0, 0.3);
        }
        
        .other-month {
            color: #666;
            background: rgba(30, 30, 60, 0.4);
        }
        
        .permission-options {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        
        .permission-option {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        
        .template-icon {
            margin-right: 10px;
            color: #ff8000;
        }
        
        @media (max-width: 1100px) {
            .container {
                flex-direction: column;
                height: auto;
            }
            
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <h1>Collaborative Calendar</h1>
        <div class="user-info">
            <span>Logged in as: <strong>Alex Johnson</strong></span>
            <span class="role-badge admin-badge">Admin</span>
        </div>
    </div>
    
    <div class="container">
        <!-- Sidebar with users/teams and templates -->
        <div class="sidebar">
            <h3 class="section-title">Users & Teams</h3>
            <ul class="user-list" id="userList">
                <!-- User items will be populated by JavaScript -->
            </ul>
            
            <h3 class="section-title">Event Templates</h3>
            <ul class="template-list" id="templateList">
                <!-- Template items will be populated by JavaScript -->
            </ul>
            
            <h3 class="section-title">Role Permissions</h3>
            <div class="permission-info">
                <p><strong>Admin:</strong> Full access to all events and settings</p>
                <p><strong>Editor:</strong> Can create and edit events</p>
                <p><strong>Viewer:</strong> Can only view events</p>
            </div>
        </div>
        
        <!-- Main calendar area -->
        <div class="calendar-main">
            <div class="calendar-header">
                <div class="calendar-nav">
                    <button class="nav-btn" id="prevMonth"><i class="fas fa-chevron-left"></i></button>
                    <h2 class="current-month" id="currentMonth">September 2023</h2>
                    <button class="nav-btn" id="nextMonth"><i class="fas fa-chevron-right"></i></button>
                </div>
                
                <div class="view-options">
                    <button class="view-btn" data-view="month">Month</button>
                    <button class="view-btn active" data-view="week">Week</button>
                    <button class="view-btn" data-view="day">Day</button>
                </div>
            </div>
            
            <div class="calendar-grid" id="calendarGrid">
                <!-- Calendar will be populated by JavaScript -->
            </div>
        </div>
    </div>
    
    <!-- Event Modal -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle">Create New Event</h3>
            
            <div class="form-group">
                <label class="form-label">Event Title</label>
                <input type="text" class="form-input" id="eventTitle" placeholder="Enter event title">
            </div>
            
            <div class="form-group">
                <label class="form-label">Date & Time</label>
                <input type="datetime-local" class="form-input" id="eventDateTime">
            </div>
            
            <div class="form-group">
                <label class="form-label">Duration (hours)</label>
                <input type="number" class="form-input" id="eventDuration" value="1" min="0.5" step="0.5">
            </div>
            
            <div class="form-group">
                <label class="form-label">Assigned To</label>
                <select class="form-select" id="eventAssignedTo">
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Color</label>
                <div class="color-options" id="colorOptions">
                    <!-- Color options will be populated by JavaScript -->
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Permissions</label>
                <div class="permission-options">
                    <div class="permission-option">
                        <input type="radio" id="permAdmin" name="permission" value="admin" checked>
                        <label for="permAdmin">Admin Only</label>
                    </div>
                    <div class="permission-option">
                        <input type="radio" id="permEditor" name="permission" value="editor">
                        <label for="permEditor">Editors+</label>
                    </div>
                    <div class="permission-option">
                        <input type="radio" id="permViewer" name="permission" value="viewer">
                        <label for="permViewer">All Users</label>
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="saveEventBtn">Save Event</button>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize data
        const users = [
            { id: 1, name: "Alex Johnson", role: "admin", color: "#ff6666" },
            { id: 2, name: "Sam Davis", role: "editor", color: "#66aaff" },
            { id: 3, name: "Taylor Smith", role: "editor", color: "#88cc88" },
            { id: 4, name: "Jordan Lee", role: "viewer", color: "#ffcc66" },
            { id: 5, name: "Marketing Team", role: "editor", color: "#cc66ff" },
            { id: 6, name: "Development Team", role: "editor", color: "#66cccc" },
            { id: 7, name: "Design Team", role: "editor", color: "#ff9966" }
        ];
        
        const eventTemplates = [
            { id: 1, name: "Team Meeting", color: "#66aaff", duration: 1, assignedTo: "Marketing Team" },
            { id: 2, name: "Sports Practice", color: "#88cc88", duration: 2, assignedTo: "Alex Johnson" },
            { id: 3, name: "Client Call", color: "#ffcc66", duration: 0.5, assignedTo: "Sam Davis" },
            { id: 4, name: "Project Review", color: "#cc66ff", duration: 1.5, assignedTo: "Development Team" },
            { id: 5, name: "Design Sprint", color: "#ff9966", duration: 3, assignedTo: "Design Team" }
        ];
        
        const colorPalette = [
            "#ff6666", "#66aaff", "#88cc88", "#ffcc66", "#cc66ff", 
            "#66cccc", "#ff9966", "#ff66a3", "#66ffcc", "#a366ff"
        ];
        
        let events = [
            { id: 1, title: "Weekly Standup", date: "2023-09-15T10:00:00", duration: 1, userId: 2, color: "#66aaff", permission: "editor" },
            { id: 2, title: "Basketball Practice", date: "2023-09-16T17:00:00", duration: 2, userId: 1, color: "#ff6666", permission: "viewer" },
            { id: 3, title: "Marketing Strategy", date: "2023-09-18T14:00:00", duration: 1.5, userId: 5, color: "#cc66ff", permission: "editor" },
            { id: 4, title: "Code Review", date: "2023-09-20T11:00:00", duration: 1, userId: 6, color: "#66cccc", permission: "admin" },
            { id: 5, title: "Design Review", date: "2023-09-22T13:00:00", duration: 2, userId: 7, color: "#ff9966", permission: "editor" }
        ];
        
        // Calendar state
        let currentDate = new Date();
        let currentView = "week";
        let selectedDate = new Date();
        let editingEventId = null;
        
        // DOM elements
        const calendarGrid = document.getElementById('calendarGrid');
        const currentMonthElement = document.getElementById('currentMonth');
        const prevMonthBtn = document.getElementById('prevMonth');
        const nextMonthBtn = document.getElementById('nextMonth');
        const viewButtons = document.querySelectorAll('.view-btn');
        const userList = document.getElementById('userList');
        const templateList = document.getElementById('templateList');
        const eventModal = document.getElementById('eventModal');
        const modalTitle = document.getElementById('modalTitle');
        const eventTitle = document.getElementById('eventTitle');
        const eventDateTime = document.getElementById('eventDateTime');
        const eventDuration = document.getElementById('eventDuration');
        const eventAssignedTo = document.getElementById('eventAssignedTo');
        const colorOptions = document.getElementById('colorOptions');
        const saveEventBtn = document.getElementById('saveEventBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        
        // Initialize the calendar
        function initCalendar() {
            renderUserList();
            renderTemplateList();
            renderCalendar();
            setupEventListeners();
            populateAssignedToDropdown();
            renderColorOptions();
            
            // Set default datetime to now rounded to next half hour
            const now = new Date();
            const roundedMinutes = Math.ceil(now.getMinutes() / 30) * 30;
            now.setMinutes(roundedMinutes);
            now.setSeconds(0);
            eventDateTime.value = now.toISOString().slice(0, 16);
        }
        
        // Render the user list in the sidebar
        function renderUserList() {
            userList.innerHTML = '';
            users.forEach(user => {
                const li = document.createElement('li');
                li.className = 'user-item';
                li.innerHTML = `
                    <div class="user-color" style="background-color: ${user.color}"></div>
                    <div class="user-name">${user.name}</div>
                    <span class="role-badge ${user.role}-badge">${user.role}</span>
                `;
                userList.appendChild(li);
            });
        }
        
        // Render the template list in the sidebar
        function renderTemplateList() {
            templateList.innerHTML = '';
            eventTemplates.forEach(template => {
                const li = document.createElement('li');
                li.className = 'template-item';
                li.innerHTML = `
                    <i class="fas fa-clone template-icon"></i>
                    <div style="flex: 1;">${template.name}</div>
                    <div class="user-color" style="background-color: ${template.color}"></div>
                `;
                
                // Add click event to use template
                li.addEventListener('click', () => {
                    useTemplate(template);
                });
                
                templateList.appendChild(li);
            });
        }
        
        // Use a template to create an event
        function useTemplate(template) {
            // Find the user for this template
            const user = users.find(u => u.name === template.assignedTo) || users[0];
            
            // Set modal values from template
            eventTitle.value = template.name;
            eventDuration.value = template.duration;
            eventAssignedTo.value = user.id;
            
            // Set the color
            document.querySelectorAll('.color-option').forEach(option => {
                if (option.getAttribute('data-color') === template.color) {
                    option.classList.add('selected');
                } else {
                    option.classList.remove('selected');
                }
            });
            
            // Show the modal
            modalTitle.textContent = `Create Event: ${template.name}`;
            eventModal.style.display = 'flex';
            editingEventId = null;
        }
        
        // Render the calendar based on current view
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            // Update current month/year display
            currentMonthElement.textContent = currentDate.toLocaleDateString('en-US', { 
                month: 'long', 
                year: 'numeric' 
            });
            
            if (currentView === 'month') {
                renderMonthView();
            } else if (currentView === 'week') {
                renderWeekView();
            } else {
                renderDayView();
            }
        }
        
        // Render month view
        function renderMonthView() {
            // Add day headers
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'calendar-day-header';
                dayHeader.textContent = day;
                calendarGrid.appendChild(dayHeader);
            });
            
            // Get first day of month and total days
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDay = firstDay.getDay();
            
            // Add empty cells for days before the first day of month
            for (let i = 0; i < startingDay; i++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day other-month';
                calendarGrid.appendChild(dayCell);
            }
            
            // Add cells for each day of the month
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                const cellDate = new Date(year, month, day);
                
                dayCell.className = 'calendar-day';
                if (day === today.getDate() && 
                    month === today.getMonth() && 
                    year === today.getFullYear()) {
                    dayCell.classList.add('today');
                }
                
                dayCell.innerHTML = `<div class="day-number">${day}</div>`;
                
                // Add events for this day
                const dayEvents = getEventsForDate(cellDate);
                dayEvents.forEach(event => {
                    const eventElement = document.createElement('div');
                    eventElement.className = 'event';
                    eventElement.style.backgroundColor = `${event.color}30`;
                    eventElement.style.borderLeftColor = event.color;
                    eventElement.style.color = '#fff';
                    eventElement.textContent = event.title;
                    eventElement.title = `${event.title} (${getUserById(event.userId).name})`;
                    
                    // Add click event to edit
                    eventElement.addEventListener('click', (e) => {
                        e.stopPropagation();
                        editEvent(event.id);
                    });
                    
                    dayCell.appendChild(eventElement);
                });
                
                // Add "add event" button
                const addBtn = document.createElement('div');
                addBtn.className = 'add-event-btn';
                addBtn.innerHTML = '<i class="fas fa-plus"></i> Add Event';
                addBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedDate = cellDate;
                    openEventModal(cellDate);
                });
                dayCell.appendChild(addBtn);
                
                calendarGrid.appendChild(dayCell);
            }
            
            // Add empty cells for days after the last day of month
            const totalCells = 42; // 6 rows * 7 days
            const cellsUsed = startingDay + daysInMonth;
            for (let i = cellsUsed; i < totalCells; i++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day other-month';
                calendarGrid.appendChild(dayCell);
            }
        }
        
        // Render week view (simplified version)
        function renderWeekView() {
            // Clear and set grid for week view
            calendarGrid.style.gridTemplateColumns = 'repeat(7, 1fr)';
            
            // Add day headers
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'calendar-day-header';
                dayHeader.textContent = day;
                calendarGrid.appendChild(dayHeader);
            });
            
            // Get current week dates
            const today = new Date();
            const currentDay = today.getDay();
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - currentDay);
            
            // Create day cells for the week
            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(startOfWeek.getDate() + i);
                
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                if (i === currentDay && 
                    today.getMonth() === dayDate.getMonth() && 
                    today.getFullYear() === dayDate.getFullYear()) {
                    dayCell.classList.add('today');
                }
                
                dayCell.innerHTML = `<div class="day-number">${dayDate.getDate()} ${dayDate.toLocaleDateString('en-US', { month: 'short' })}</div>`;
                
                // Add events for this day
                const dayEvents = getEventsForDate(dayDate);
                dayEvents.forEach(event => {
                    const eventElement = document.createElement('div');
                    eventElement.className = 'event';
                    eventElement.style.backgroundColor = `${event.color}30`;
                    eventElement.style.borderLeftColor = event.color;
                    eventElement.style.color = '#fff';
                    eventElement.textContent = `${formatTime(event.date)} ${event.title}`;
                    eventElement.title = `${event.title} (${getUserById(event.userId).name})`;
                    
                    // Add click event to edit
                    eventElement.addEventListener('click', (e) => {
                        e.stopPropagation();
                        editEvent(event.id);
                    });
                    
                    dayCell.appendChild(eventElement);
                });
                
                // Add "add event" button
                const addBtn = document.createElement('div');
                addBtn.className = 'add-event-btn';
                addBtn.innerHTML = '<i class="fas fa-plus"></i> Add Event';
                addBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedDate = dayDate;
                    openEventModal(dayDate);
                });
                dayCell.appendChild(addBtn);
                
                calendarGrid.appendChild(dayCell);
            }
        }
        
        // Render day view (simplified version)
        function renderDayView() {
            // For simplicity, we'll just show a message
            calendarGrid.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                    <h3 style="color: #ff8000; margin-bottom: 20px;">Day View</h3>
                    <p>Day view would show detailed schedule for a single day with hourly breakdown.</p>
                    <p>This is a simplified demo showing the month and week views.</p>
                    <button id="switchToWeekView" style="margin-top: 20px; padding: 10px 20px; background: rgba(255, 128, 0, 0.8); color: white; border: none; border-radius: 5px; cursor: pointer;">
                        Switch to Week View
                    </button>
                </div>
            `;
            
            // Add event listener to the button
            document.getElementById('switchToWeekView').addEventListener('click', () => {
                currentView = 'week';
                updateViewButtons();
                renderCalendar();
            });
        }
        
        // Get events for a specific date
        function getEventsForDate(date) {
            return events.filter(event => {
                const eventDate = new Date(event.date);
                return eventDate.getDate() === date.getDate() &&
                       eventDate.getMonth() === date.getMonth() &&
                       eventDate.getFullYear() === date.getFullYear();
            });
        }
        
        // Format time from ISO string
        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        // Get user by ID
        function getUserById(id) {
            return users.find(user => user.id === id) || users[0];
        }
        
        // Open event modal for creating/editing events
        function openEventModal(date) {
            modalTitle.textContent = 'Create New Event';
            eventTitle.value = '';
            eventDuration.value = 1;
            
            // Set date/time to selected date at 9 AM
            const eventDate = new Date(date);
            eventDate.setHours(9, 0, 0, 0);
            eventDateTime.value = eventDate.toISOString().slice(0, 16);
            
            // Set default user
            eventAssignedTo.value = users[0].id;
            
            // Set default color
            document.querySelectorAll('.color-option').forEach(option => {
                if (option.getAttribute('data-color') === users[0].color) {
                    option.classList.add('selected');
                } else {
                    option.classList.remove('selected');
                }
            });
            
            // Set default permission
            document.getElementById('permEditor').checked = true;
            
            eventModal.style.display = 'flex';
            editingEventId = null;
        }
        
        // Edit an existing event
        function editEvent(eventId) {
            const event = events.find(e => e.id === eventId);
            if (!event) return;
            
            editingEventId = eventId;
            modalTitle.textContent = 'Edit Event';
            eventTitle.value = event.title;
            
            const eventDate = new Date(event.date);
            eventDateTime.value = eventDate.toISOString().slice(0, 16);
            
            eventDuration.value = event.duration;
            eventAssignedTo.value = event.userId;
            
            // Set color
            document.querySelectorAll('.color-option').forEach(option => {
                if (option.getAttribute('data-color') === event.color) {
                    option.classList.add('selected');
                } else {
                    option.classList.remove('selected');
                }
            });
            
            // Set permission
            document.querySelector(`input[value="${event.permission}"]`).checked = true;
            
            eventModal.style.display = 'flex';
        }
        
        // Save event (create or update)
        function saveEvent() {
            const title = eventTitle.value.trim();
            if (!title) {
                alert('Please enter an event title');
                return;
            }
            
            const dateTime = new Date(eventDateTime.value);
            const duration = parseFloat(eventDuration.value);
            const userId = parseInt(eventAssignedTo.value);
            const permission = document.querySelector('input[name="permission"]:checked').value;
            
            // Get selected color
            const selectedColorOption = document.querySelector('.color-option.selected');
            const color = selectedColorOption ? selectedColorOption.getAttribute('data-color') : colorPalette[0];
            
            if (editingEventId) {
                // Update existing event
                const eventIndex = events.findIndex(e => e.id === editingEventId);
                if (eventIndex !== -1) {
                    events[eventIndex] = {
                        ...events[eventIndex],
                        title,
                        date: dateTime.toISOString(),
                        duration,
                        userId,
                        color,
                        permission
                    };
                }
            } else {
                // Create new event
                const newId = events.length > 0 ? Math.max(...events.map(e => e.id)) + 1 : 1;
                events.push({
                    id: newId,
                    title,
                    date: dateTime.toISOString(),
                    duration,
                    userId,
                    color,
                    permission
                });
            }
            
            // Close modal and refresh calendar
            eventModal.style.display = 'none';
            renderCalendar();
        }
        
        // Populate assigned to dropdown
        function populateAssignedToDropdown() {
            eventAssignedTo.innerHTML = '';
            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user.id;
                option.textContent = user.name;
                eventAssignedTo.appendChild(option);
            });
        }
        
        // Render color options
        function renderColorOptions() {
            colorOptions.innerHTML = '';
            colorPalette.forEach(color => {
                const colorOption = document.createElement('div');
                colorOption.className = 'color-option';
                colorOption.style.backgroundColor = color;
                colorOption.setAttribute('data-color', color);
                
                // Select first color by default
                if (color === colorPalette[0]) {
                    colorOption.classList.add('selected');
                }
                
                colorOption.addEventListener('click', () => {
                    document.querySelectorAll('.color-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    colorOption.classList.add('selected');
                });
                
                colorOptions.appendChild(colorOption);
            });
        }
        
        // Update view buttons active state
        function updateViewButtons() {
            viewButtons.forEach(btn => {
                if (btn.getAttribute('data-view') === currentView) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // Set up event listeners
        function setupEventListeners() {
            // Month navigation
            prevMonthBtn.addEventListener('click', () => {
                if (currentView === 'month') {
                    currentDate.setMonth(currentDate.getMonth() - 1);
                } else {
                    currentDate.setDate(currentDate.getDate() - 7);
                }
                renderCalendar();
            });
            
            nextMonthBtn.addEventListener('click', () => {
                if (currentView === 'month') {
                    currentDate.setMonth(currentDate.getMonth() + 1);
                } else {
                    currentDate.setDate(currentDate.getDate() + 7);
                }
                renderCalendar();
            });
            
            // View switching
            viewButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentView = btn.getAttribute('data-view');
                    updateViewButtons();
                    renderCalendar();
                });
            });
            
            // Event modal buttons
            saveEventBtn.addEventListener('click', saveEvent);
            cancelBtn.addEventListener('click', () => {
                eventModal.style.display = 'none';
            });
            
            // Close modal when clicking outside
            window.addEventListener('click', (e) => {
                if (e.target === eventModal) {
                    eventModal.style.display = 'none';
                }
            });
            
            // Today button functionality (not implemented in UI but could be added)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    eventModal.style.display = 'none';
                }
            });
        }
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', initCalendar);
    </script>
</body>
</html>
