<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Generator</title>
<link rel="icon" type="image/x-icon" href="favcon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #f0eaff;
            min-height: 100vh;
            padding: 24px;
        }

        /* glass panel effect */
        .glass-panel {
            background: rgba(20, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 128, 0, 0.15);
            border-radius: 28px;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 128, 0, 0.1) inset;
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }

        .back-btn {
            padding: 10px 20px;
            background: rgba(255, 128, 0, 0.12);
            border: 1px solid #ff8000;
            border-radius: 40px;
            color: #ffb066;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
        }

        .back-btn:hover {
            background: rgba(255, 128, 0, 0.25);
            color: #ffd9b0;
            border-color: #ffa64d;
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(255, 128, 0, 0.3);
        }

        .back-btn i {
            font-size: 0.9rem;
        }

        h1 {
            font-weight: 500;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
            background: linear-gradient(120deg, #ffb870, #ffd9b0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-left: 8px;
            text-shadow: 0 2px 5px rgba(255, 128, 0, 0.2);
        }

        /* main grid */
        .generator-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr;
            gap: 28px;
            max-width: 1500px;
            margin: 0 auto;
        }

        /* preview panel */
        .preview-card {
            border-radius: 32px;
            padding: 28px;
            background: rgba(8, 8, 20, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 128, 0, 0.2);
            box-shadow: 0 20px 35px -10px #00000080;
        }

        .gradient-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 28px;
            border: 3px solid rgba(255, 128, 0, 0.35);
            box-shadow: 0 18px 30px -8px black, 0 0 0 1px #ff8000 inset;
            transition: background 0.1s ease;
            margin-bottom: 28px;
            background: linear-gradient(135deg, #ff8000, #b85ecc);
        }

        .code-section {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 22px;
            padding: 20px;
            border: 1px solid rgba(255, 128, 0, 0.3);
            backdrop-filter: blur(6px);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #ffb27a;
            font-weight: 500;
        }

        .css-output {
            background: #0d0b1a;
            padding: 18px 20px;
            border-radius: 18px;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            border: 1px solid #ff800040;
            color: #cfc5e6;
            word-break: break-word;
            white-space: pre-wrap;
            box-shadow: inset 0 5px 12px #00000055;
        }

        .copy-btn {
            background: rgba(255, 128, 0, 0.18);
            border: 1px solid #ff8000;
            color: #ffb050;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-btn:hover {
            background: rgba(255, 128, 0, 0.3);
            color: #ffd19b;
            border-color: #ffaa33;
            box-shadow: 0 0 12px #ff800070;
        }

        /* right panel — controls */
        .controls-panel {
            border-radius: 32px;
            padding: 30px;
            background: rgba(12, 8, 24, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 128, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .control-group {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 22px;
            padding: 22px 20px;
            border: 1px solid #ff800020;
        }

        .group-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 18px;
            color: #ffb459;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px dashed #ff800040;
            padding-bottom: 10px;
        }

        .type-toggle {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .type-btn {
            background: transparent;
            border: 1.5px solid #ff800060;
            color: #ddd;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s;
            flex: 1 1 auto;
        }

        .type-btn.active {
            background: #ff8000;
            border-color: #ffaa33;
            color: #0a0a1a;
            box-shadow: 0 0 20px #ff8000;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 18px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            color: #ccc;
        }

        input[type=range] {
            width: 100%;
            height: 8px;
            background: rgba(255, 128, 0, 0.2);
            border-radius: 20px;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #ff8000;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffa64d;
            border: 2px solid #ffd9b0;
            cursor: pointer;
            margin-top: -7px;
        }

        input[type=range]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            background: #ff8000;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        /* color stops */
        .stops-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 18px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .stop-item {
            background: rgba(255, 128, 0, 0.08);
            border-radius: 40px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #ff800025;
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
        }

        .stop-color {
            width: 48px;
            height: 40px;
            border: 2px solid #ff8000;
            border-radius: 30px;
            background: #ff8000;
            cursor: pointer;
        }

        input[type=color] {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .stop-position {
            flex: 3;
            min-width: 150px;
        }

        .stop-position span {
            color: #ffb27a;
            font-weight: 600;
            margin-left: 6px;
        }

        .remove-stop {
            background: rgba(255, 60, 60, 0.2);
            border: 1px solid #ff6060;
            color: #ffa0a0;
            border-radius: 30px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .remove-stop:hover {
            background: rgba(255, 0, 0, 0.3);
            color: #ffd0d0;
        }

        .add-stop-btn {
            background: rgba(255, 128, 0, 0.15);
            border: 1px dashed #ff8000;
            color: #ffae6a;
            padding: 12px 0;
            border-radius: 40px;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 6px;
        }

        .add-stop-btn:hover {
            background: rgba(255, 128, 0, 0.3);
            color: #ffdbb5;
        }

        .random-btn {
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            color: #ffc285;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }

        .random-btn:hover {
            background: #ff800030;
            color: #ffe5c8;
            box-shadow: 0 0 16px #ff8000;
        }

        .radial-options {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        select, .pos-inputs {
            background: #130e22;
            border: 1px solid #ff800070;
            color: #ffc68a;
            padding: 10px 15px;
            border-radius: 40px;
            font-weight: 500;
            width: 100%;
        }

        .pos-inputs {
            display: flex;
            gap: 15px;
        }

        .pos-inputs input {
            width: 45%;
            background: #1f1738;
            border: 1px solid #ff8000;
            color: #ffae6a;
            border-radius: 30px;
            padding: 8px 12px;
        }

        .footer-note {
            text-align: center;
            color: #ff9f4b60;
            margin-top: 30px;
            font-size: 0.9rem;
        }

        @media (max-width: 950px) {
            .generator-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to tools</a>
        <h1>✶ gradient forge</h1>
    </div>

    <div class="generator-grid">
        <!-- LEFT: preview & code -->
        <div class="preview-card">
            <div class="gradient-box" id="previewBox"></div>
            <div class="code-section">
                <div class="code-header">
                    <span><i class="fas fa-code"></i> CSS background</span>
                    <button class="copy-btn" id="copyBtn"><i class="far fa-copy"></i> copy</button>
                </div>
                <div class="css-output" id="cssOutput">background: linear-gradient(90deg, #ff8000, #b85ecc);</div>
            </div>
        </div>

        <!-- RIGHT: controls -->
        <div class="controls-panel">
            <!-- gradient type -->
            <div class="control-group">
                <div class="group-title"><i class="fas fa-paint-brush"></i> type</div>
                <div class="type-toggle">
                    <button class="type-btn active" id="typeLinear">linear</button>
                    <button class="type-btn" id="typeRadial">radial</button>
                </div>
            </div>

            <!-- linear options (angle) -->
            <div class="control-group" id="linearControls">
                <div class="group-title"><i class="fas fa-compass"></i> angle</div>
                <div class="slider-container">
                    <div class="slider-label"><span>angle</span> <span id="angleValue">90°</span></div>
                    <input type="range" id="angleSlider" min="0" max="360" value="90" step="1">
                </div>
            </div>

            <!-- radial options (hidden by default) -->
            <div class="control-group" id="radialControls" style="display: none;">
                <div class="group-title"><i class="fas fa-circle"></i> radial settings</div>
                <div class="radial-options">
                    <select id="radialShape">
                        <option value="circle">circle</option>
                        <option value="ellipse">ellipse</option>
                    </select>
                    <select id="radialSize">
                        <option value="closest-side">closest-side</option>
                        <option value="farthest-side">farthest-side</option>
                        <option value="closest-corner">closest-corner</option>
                        <option value="farthest-corner" selected>farthest-corner</option>
                    </select>
                    <div class="pos-inputs">
                        <input type="number" id="radialX" min="0" max="100" value="50" step="1"> <span>% X</span>
                        <input type="number" id="radialY" min="0" max="100" value="50" step="1"> <span>% Y</span>
                    </div>
                </div>
            </div>

            <!-- color stops -->
            <div class="control-group">
                <div class="group-title"><i class="fas fa-stop-circle"></i> color stops</div>
                <div class="stops-container" id="stopsContainer"></div>
                <button class="add-stop-btn" id="addStop"><i class="fas fa-plus"></i> add stop</button>
            </div>

            <!-- random + extras -->
            <button class="random-btn" id="randomGradient"><i class="fas fa-shuffle"></i> random gradient</button>
        </div>
    </div>
    <div class="footer-note">⇢ drag stops · click color to edit · live preview</div>

    <script>
        (function() {
            // ----- state -----
            let gradientType = 'linear';        // 'linear' or 'radial'
            let linearAngle = 90;
            let radialShape = 'circle';
            let radialSize = 'farthest-corner';
            let radialX = 50;
            let radialY = 50;
            
            // stops: array of {color, pos}
            let stops = [
                { color: '#ff8000', pos: 0 },
                { color: '#b85ecc', pos: 100 }
            ];

            // ----- DOM elements -----
            const preview = document.getElementById('previewBox');
            const cssOutput = document.getElementById('cssOutput');
            const copyBtn = document.getElementById('copyBtn');

            // type buttons
            const linearTypeBtn = document.getElementById('typeLinear');
            const radialTypeBtn = document.getElementById('typeRadial');
            const linearControlsDiv = document.getElementById('linearControls');
            const radialControlsDiv = document.getElementById('radialControls');

            // linear controls
            const angleSlider = document.getElementById('angleSlider');
            const angleSpan = document.getElementById('angleValue');

            // radial controls
            const radialShapeSelect = document.getElementById('radialShape');
            const radialSizeSelect = document.getElementById('radialSize');
            const radialXInput = document.getElementById('radialX');
            const radialYInput = document.getElementById('radialY');

            const stopsContainer = document.getElementById('stopsContainer');
            const addStopBtn = document.getElementById('addStop');
            const randomBtn = document.getElementById('randomGradient');

            // ----- helper: sort stops by position -----
            function sortStops() {
                stops.sort((a, b) => a.pos - b.pos);
            }

            // ----- build gradient css string -----
            function buildGradientString() {
                sortStops();
                let colorStopsString = stops.map(s => `${s.color} ${s.pos}%`).join(', ');
                
                if (gradientType === 'linear') {
                    return `linear-gradient(${linearAngle}deg, ${colorStopsString})`;
                } else {
                    // radial-gradient(shape size at position, colors)
                    const atPos = `at ${radialX}% ${radialY}%`;
                    return `radial-gradient(${radialShape} ${radialSize} ${atPos}, ${colorStopsString})`;
                }
            }

            // ----- update UI (preview + code) -----
            function updateGradient() {
                const gradientCss = buildGradientString();
                preview.style.background = gradientCss;
                cssOutput.innerText = `background: ${gradientCss};`;
            }

            // ----- re-render stops controls (based on stops array) -----
            function renderStops() {
                sortStops();
                let html = '';
                stops.forEach((stop, index) => {
                    html += `
                        <div class="stop-item" data-index="${index}">
                            <div class="stop-color" style="background: ${stop.color};"></div>
                            <input type="color" class="stop-color-picker" value="${stop.color}" data-index="${index}" style="position:absolute; opacity:0; width:0; height:0">
                            <div class="stop-position">
                                <input type="range" min="0" max="100" value="${stop.pos}" step="1" data-index="${index}" style="width:100%;">
                                <span>${Math.round(stop.pos)}%</span>
                            </div>
                            ${stops.length > 2 ? `<div class="remove-stop" data-index="${index}"><i class="fas fa-times"></i></div>` : '<div style="width:38px;"></div>'}
                        </div>
                    `;
                });
                stopsContainer.innerHTML = html;

                // attach events to new controls
                document.querySelectorAll('.stop-color-picker').forEach(picker => {
                    picker.addEventListener('input', function(e) {
                        const idx = this.dataset.index;
                        stops[idx].color = this.value;
                        // update swatch background
                        const parent = this.closest('.stop-item').querySelector('.stop-color');
                        if (parent) parent.style.background = this.value;
                        updateGradient();
                    });
                });

                document.querySelectorAll('.stop-position input[type=range]').forEach(slider => {
                    slider.addEventListener('input', function(e) {
                        const idx = this.dataset.index;
                        stops[idx].pos = parseFloat(this.value);
                        const span = this.closest('.stop-position').querySelector('span');
                        if (span) span.innerText = Math.round(this.value) + '%';
                        updateGradient();
                    });
                });

                document.querySelectorAll('.remove-stop').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const idx = this.dataset.index;
                        if (stops.length > 2) {
                            stops.splice(idx, 1);
                            renderStops();
                            updateGradient();
                        }
                    });
                });
            }

            // ----- add a new stop (mid color) -----
            function addColorStop() {
                if (stops.length >= 8) return; // reasonable limit
                // find a midpoint position not used
                sortStops();
                let newPos = 50;
                for (let i = 0; i < stops.length - 1; i++) {
                    if (stops[i+1].pos - stops[i].pos > 10) {
                        newPos = (stops[i].pos + stops[i+1].pos) / 2;
                        break;
                    }
                }
                // fallback: 50 if no wide gap
                if (newPos === 50 && stops.some(s => Math.abs(s.pos - 50) < 5)) {
                    newPos = 75; // just try another spot
                }
                // random bright color
                const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                stops.push({ color: randomColor, pos: Math.min(100, Math.max(0, newPos)) });
                sortStops();
                renderStops();
                updateGradient();
            }

            // ----- random gradient generator (high quality) -----
            function randomGradient() {
                // random type
                gradientType = Math.random() > 0.5 ? 'linear' : 'radial';
                // update UI accordingly
                setTypeUI(gradientType);

                // random angle 0-360
                linearAngle = Math.floor(Math.random() * 360);
                angleSlider.value = linearAngle;
                angleSpan.innerText = linearAngle + '°';

                // random radial params
                radialShape = Math.random() > 0.5 ? 'circle' : 'ellipse';
                const sizeOpts = ['closest-side', 'farthest-side', 'closest-corner', 'farthest-corner'];
                radialSize = sizeOpts[Math.floor(Math.random() * sizeOpts.length)];
                radialX = Math.floor(Math.random() * 101);
                radialY = Math.floor(Math.random() * 101);
                radialShapeSelect.value = radialShape;
                radialSizeSelect.value = radialSize;
                radialXInput.value = radialX;
                radialYInput.value = radialY;

                // generate 2-6 random stops
                const stopCount = Math.floor(Math.random() * 5) + 2; // 2 to 6
                stops = [];
                for (let i = 0; i < stopCount; i++) {
                    let color = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                    let pos = Math.floor(Math.random() * 101);
                    stops.push({ color, pos });
                }
                sortStops();
                // ensure first and last are 0/100? not necessary but nicer
                if (stops[0].pos > 0) stops[0].pos = 0;
                if (stops[stops.length-1].pos < 100) stops[stops.length-1].pos = 100;
                sortStops();

                renderStops();
                updateGradient();
            }

            // ----- switch type UI -----
            function setTypeUI(type) {
                gradientType = type;
                if (type === 'linear') {
                    linearTypeBtn.classList.add('active');
                    radialTypeBtn.classList.remove('active');
                    linearControlsDiv.style.display = 'block';
                    radialControlsDiv.style.display = 'none';
                } else {
                    radialTypeBtn.classList.add('active');
                    linearTypeBtn.classList.remove('active');
                    linearControlsDiv.style.display = 'none';
                    radialControlsDiv.style.display = 'block';
                }
                updateGradient();
            }

            // ----- event listeners -----
            linearTypeBtn.addEventListener('click', () => setTypeUI('linear'));
            radialTypeBtn.addEventListener('click', () => setTypeUI('radial'));

            angleSlider.addEventListener('input', (e) => {
                linearAngle = parseInt(e.target.value);
                angleSpan.innerText = linearAngle + '°';
                updateGradient();
            });

            radialShapeSelect.addEventListener('change', (e) => {
                radialShape = e.target.value;
                updateGradient();
            });
            radialSizeSelect.addEventListener('change', (e) => {
                radialSize = e.target.value;
                updateGradient();
            });
            radialXInput.addEventListener('input', (e) => {
                radialX = parseInt(e.target.value) || 50;
                updateGradient();
            });
            radialYInput.addEventListener('input', (e) => {
                radialY = parseInt(e.target.value) || 50;
                updateGradient();
            });

            addStopBtn.addEventListener('click', addColorStop);

            randomBtn.addEventListener('click', randomGradient);

            // copy to clipboard
            copyBtn.addEventListener('click', () => {
                const code = cssOutput.innerText;
                navigator.clipboard.writeText(code).then(() => {
                    const original = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> copied!';
                    setTimeout(() => copyBtn.innerHTML = original, 1500);
                }).catch(() => alert('failed to copy'));
            });

            // init stops render + update
            renderStops();
            updateGradient();

            // initial UI sync
            setTypeUI('linear');
            angleSlider.value = linearAngle;
            angleSpan.innerText = linearAngle + '°';
            radialShapeSelect.value = radialShape;
            radialSizeSelect.value = radialSize;
            radialXInput.value = radialX;
            radialYInput.value = radialY;
        })();
    </script>
</body>
</html>
