<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Translator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(20, 20, 35, 0.8);
            border-bottom: 1px solid rgba(255, 69, 0, 0.2);
            margin-bottom: 30px;
            border-radius: 10px;
        }

        .back-btn {
            padding: 8px 15px;
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .section {
            background: rgba(20, 20, 35, 0.5);
            border: 1px solid rgba(255, 69, 0, 0.2);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            background: rgba(50, 50, 70, 0.4);
            border: 1px solid rgba(255, 128, 0, 0.3);
            border-radius: 8px;
            color: #fff;
            resize: vertical;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #888;
        }

        .form-group {
            margin-bottom: 15px;
            margin-top: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }

        .language-selectors {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .language-box {
            flex: 1;
            background: rgba(50, 50, 70, 0.4);
            border: 1px solid rgba(255, 128, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .language-box h3 {
            margin-bottom: 10px;
            color: #ff8000;
            font-size: 1.1rem;
            position: sticky;
            top: 0;
            background: rgba(50, 50, 70, 0.9);
            padding: 5px;
            border-radius: 4px;
        }

        .language-option {
            display: flex;
            align-items: center;
            padding: 8px 0;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 4px;
            padding-left: 10px;
        }

        .language-option:hover {
            background: rgba(255, 128, 0, 0.1);
        }

        .language-option.selected {
            background: rgba(255, 128, 0, 0.2);
            border-left: 3px solid #ff8000;
        }

        .language-flag {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .language-name {
            flex-grow: 1;
        }

        .radio-btn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #ff8000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
        }

        .radio-btn.selected::after {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff8000;
        }

        .swap-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        .swap-btn button {
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            color: #ff8000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .swap-btn button:hover {
            background: rgba(255, 128, 0, 0.3);
            transform: rotate(180deg);
        }

        .btn {
            padding: 12px 25px;
            background: linear-gradient(to right, #ff7e00, #ff4500);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            background: rgba(50, 50, 70, 0.4);
            border: 1px solid rgba(255, 128, 0, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-text {
            color: #ddd;
            line-height: 1.6;
            min-height: 50px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .char-count {
            color: #aaa;
            font-size: 0.9rem;
            text-align: right;
            margin-top: 5px;
        }

        .char-count span {
            color: #ff8000;
        }

        .translation-info {
            background: rgba(255, 128, 0, 0.1);
            border-left: 3px solid #ff8000;
            padding: 10px;
            margin-top: 15px;
            border-radius: 0 5px 5px 0;
            font-size: 0.9rem;
            color: #ccc;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ff8000;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 50, 50, 0.1);
            border-left: 3px solid #ff5050;
            padding: 10px;
            margin-top: 15px;
            border-radius: 0 5px 5px 0;
            font-size: 0.9rem;
            color: #ffaaaa;
        }

        .api-selector {
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(50, 50, 70, 0.4);
            border-radius: 8px;
        }

        .api-selector select {
            background: rgba(30, 30, 50, 0.8);
            color: white;
            border: 1px solid #ff8000;
            padding: 8px;
            border-radius: 5px;
            width: 100%;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <span style="font-size: 1.5rem; font-weight: bold;">Text Translator</span>
        <div style="width: 60px;"></div>
    </div>

    <div class="container">
        <div class="section">
            <h2 style="margin-bottom: 15px;"><i class="fas fa-language"></i> Translate Text</h2>
            
            <div class="api-selector">
                <label>Translation API:</label>
                <select id="apiSelector">
                    <option value="libretranslate">LibreTranslate (Free, Unlimited)</option>
                    <option value="mymemory">MyMemory (Free, 1000 chars/day)</option>
                </select>
            </div>
            
            <div class="language-selectors">
                <div class="language-box">
                    <h3><i class="fas fa-arrow-down"></i> Source Language</h3>
                    <!-- Languages will be populated by JavaScript -->
                </div>
                
                <div class="swap-btn">
                    <button id="swapLanguages"><i class="fas fa-exchange-alt"></i></button>
                </div>
                
                <div class="language-box">
                    <h3><i class="fas fa-arrow-up"></i> Target Language</h3>
                    <!-- Languages will be populated by JavaScript -->
                </div>
            </div>
            
            <textarea id="sourceText" placeholder="Enter text to translate..."></textarea>
            <div class="char-count">Characters: <span id="charCount">0</span>/5000</div>
            
            <button class="btn" id="translateBtn"><i class="fas fa-exchange-alt"></i> Translate Text</button>
        </div>

        <div class="result" id="result">
            <h2 style="margin-bottom: 15px; color: #ff8000;"><i class="fas fa-globe"></i> Translation</h2>
            <div class="result-text" id="translationResult">Translation will appear here...</div>
            <div class="translation-info" id="translationInfo">
                <i class="fas fa-info-circle"></i> <strong>Detected language:</strong> <span id="detectedLang">Auto detecting...</span>
            </div>
        </div>
    </div>

    <script>
        // Language data with ISO codes
        const languages = [
            {code: 'auto', name: 'Auto Detect', flag: '🌐'},
            {code: 'en', name: 'English', flag: '🇺🇸'},
            {code: 'es', name: 'Spanish', flag: '🇪🇸'},
            {code: 'fr', name: 'French', flag: '🇫🇷'},
            {code: 'de', name: 'German', flag: '🇩🇪'},
            {code: 'it', name: 'Italian', flag: '🇮🇹'},
            {code: 'pt', name: 'Portuguese', flag: '🇵🇹'},
            {code: 'ru', name: 'Russian', flag: '🇷🇺'},
            {code: 'zh', name: 'Chinese', flag: '🇨🇳'},
            {code: 'ja', name: 'Japanese', flag: '🇯🇵'},
            {code: 'ko', name: 'Korean', flag: '🇰🇷'},
            {code: 'ar', name: 'Arabic', flag: '🇸🇦'},
            {code: 'hi', name: 'Hindi', flag: '🇮🇳'},
            {code: 'nl', name: 'Dutch', flag: '🇳🇱'},
            {code: 'tr', name: 'Turkish', flag: '🇹🇷'},
            {code: 'pl', name: 'Polish', flag: '🇵🇱'},
            {code: 'sv', name: 'Swedish', flag: '🇸🇪'},
            {code: 'da', name: 'Danish', flag: '🇩🇰'},
            {code: 'fi', name: 'Finnish', flag: '🇫🇮'},
            {code: 'no', name: 'Norwegian', flag: '🇳🇴'},
            {code: 'el', name: 'Greek', flag: '🇬🇷'},
            {code: 'cs', name: 'Czech', flag: '🇨🇿'},
            {code: 'ro', name: 'Romanian', flag: '🇷🇴'},
            {code: 'hu', name: 'Hungarian', flag: '🇭🇺'},
            {code: 'th', name: 'Thai', flag: '🇹🇭'},
            {code: 'vi', name: 'Vietnamese', flag: '🇻🇳'},
            {code: 'id', name: 'Indonesian', flag: '🇮🇩'},
            {code: 'he', name: 'Hebrew', flag: '🇮🇱'},
            {code: 'uk', name: 'Ukrainian', flag: '🇺🇦'}
        ];

        // Current selected languages
        let sourceLang = 'auto';
        let targetLang = 'es';
        let currentApi = 'libretranslate';

        // DOM elements
        const sourceText = document.getElementById('sourceText');
        const charCount = document.getElementById('charCount');
        const translateBtn = document.getElementById('translateBtn');
        const resultDiv = document.getElementById('result');
        const translationResult = document.getElementById('translationResult');
        const translationInfo = document.getElementById('translationInfo');
        const detectedLang = document.getElementById('detectedLang');
        const swapBtn = document.getElementById('swapLanguages');
        const apiSelector = document.getElementById('apiSelector');

        // Initialize language selectors
        function initializeLanguageSelectors() {
            const sourceBox = document.querySelector('.language-box:first-child');
            const targetBox = document.querySelector('.language-box:last-child');
            
            // Clear existing content
            sourceBox.innerHTML = '<h3><i class="fas fa-arrow-down"></i> Source Language</h3>';
            targetBox.innerHTML = '<h3><i class="fas fa-arrow-up"></i> Target Language</h3>';
            
            // Add languages to source (including auto)
            languages.forEach(lang => {
                const isSelected = lang.code === sourceLang;
                const option = createLanguageOption(lang, isSelected, 'source');
                sourceBox.appendChild(option);
            });
            
            // Add languages to target (excluding auto)
            languages.filter(lang => lang.code !== 'auto').forEach(lang => {
                const isSelected = lang.code === targetLang;
                const option = createLanguageOption(lang, isSelected, 'target');
                targetBox.appendChild(option);
            });
            
            // Reattach event listeners
            attachLanguageOptionListeners();
        }

        // Create a language option element
        function createLanguageOption(lang, isSelected, type) {
            const div = document.createElement('div');
            div.className = `language-option ${isSelected ? 'selected' : ''}`;
            div.dataset.lang = lang.code;
            div.innerHTML = `
                <div class="radio-btn ${isSelected ? 'selected' : ''}"></div>
                <div class="language-flag">${lang.flag}</div>
                <div class="language-name">${lang.name}</div>
            `;
            return div;
        }

        // Attach event listeners to language options
        function attachLanguageOptionListeners() {
            document.querySelectorAll('.language-option').forEach(option => {
                option.addEventListener('click', function() {
                    const langBox = this.closest('.language-box');
                    const langCode = this.dataset.lang;
                    
                    // Update selected state in this box
                    langBox.querySelectorAll('.language-option').forEach(opt => {
                        opt.classList.remove('selected');
                        opt.querySelector('.radio-btn').classList.remove('selected');
                    });
                    
                    this.classList.add('selected');
                    this.querySelector('.radio-btn').classList.add('selected');
                    
                    // Update source or target language
                    if (langBox.querySelector('h3').innerHTML.includes('Source')) {
                        sourceLang = langCode;
                    } else {
                        targetLang = langCode;
                    }
                    
                    // Prevent source and target from being the same (except auto)
                    if (sourceLang === targetLang && sourceLang !== 'auto') {
                        // Find a different language to set as target
                        const availableLangs = languages.filter(lang => lang.code !== sourceLang && lang.code !== 'auto');
                        if (availableLangs.length > 0) {
                            targetLang = availableLangs[0].code;
                            updateLanguageSelection('target', targetLang);
                        }
                    }
                });
            });
        }

        // Update language selection in UI
        function updateLanguageSelection(type, langCode) {
            const selector = type === 'source' ? 
                '.language-box:first-child' : '.language-box:last-child';
            
            const langBox = document.querySelector(selector);
            langBox.querySelectorAll('.language-option').forEach(opt => {
                if (opt.dataset.lang === langCode) {
                    opt.classList.add('selected');
                    opt.querySelector('.radio-btn').classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                    opt.querySelector('.radio-btn').classList.remove('selected');
                }
            });
        }

        // Swap languages
        swapBtn.addEventListener('click', function() {
            // Don't swap if source is auto-detect
            if (sourceLang === 'auto') {
                // Find a language that's not the current target
                const availableLangs = languages.filter(lang => lang.code !== targetLang && lang.code !== 'auto');
                if (availableLangs.length > 0) {
                    sourceLang = targetLang;
                    targetLang = availableLangs[0].code;
                }
            } else {
                // Regular swap
                [sourceLang, targetLang] = [targetLang, sourceLang];
            }
            
            // Update UI
            updateLanguageSelection('source', sourceLang);
            updateLanguageSelection('target', targetLang);
            
            // Also swap text if there's translation
            if (translationResult.textContent !== 'Translation will appear here...' && 
                !translationResult.textContent.includes('Translating...')) {
                const tempText = sourceText.value;
                sourceText.value = translationResult.textContent;
                translationResult.textContent = tempText;
                charCount.textContent = sourceText.value.length;
                
                // Update detected language info
                const detectedText = detectedLang.textContent;
                if (detectedText.includes('Auto-detected')) {
                    detectedLang.textContent = detectedText.replace(/\(Auto-detected\)/, '(Swapped)');
                }
            }
        });

        // Character count update
        sourceText.addEventListener('input', function() {
            const count = this.value.length;
            charCount.textContent = count;
            charCount.style.color = count > 5000 ? '#ff5050' : '#ff8000';
            translateBtn.disabled = count === 0 || count > 5000;
        });

        // API selector change
        apiSelector.addEventListener('change', function() {
            currentApi = this.value;
        });

        // Translation function using LibreTranslate API (free, no key required)
        async function translateText(text, source, target) {
            const api = currentApi;
            
            if (api === 'libretranslate') {
                // Using LibreTranslate public instance
                const url = 'https://libretranslate.com/translate';
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        q: text,
                        source: source === 'auto' ? '' : source,
                        target: target,
                        format: 'text',
                        api_key: '' // No API key needed for public instance
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Translation failed: ${response.status}`);
                }
                
                const data = await response.json();
                return {
                    translatedText: data.translatedText,
                    detectedLanguage: source === 'auto' ? (data.detectedLanguage?.language || 'Unknown') : source
                };
            } else if (api === 'mymemory') {
                // Using MyMemory Translation API (limited to 1000 chars/day)
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source === 'auto' ? '' : source}|${target}`;
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`Translation failed: ${response.status}`);
                }
                
                const data = await response.json();
                return {
                    translatedText: data.responseData.translatedText,
                    detectedLanguage: source === 'auto' ? (data.responseData.detectedLanguage?.split('-')[0] || 'Unknown') : source
                };
            }
        }

        // Get language name from code
        function getLanguageName(code) {
            const lang = languages.find(l => l.code === code);
            return lang ? lang.name : code;
        }

        // Translate button click
        translateBtn.addEventListener('click', async function() {
            const text = sourceText.value.trim();
            
            if (!text) {
                alert('Please enter text to translate');
                return;
            }
            
            if (text.length > 5000) {
                alert('Text is too long. Maximum 5000 characters allowed.');
                return;
            }
            
            if (sourceLang === targetLang && sourceLang !== 'auto') {
                alert('Source and target languages cannot be the same');
                return;
            }
            
            // Show loading state
            translateBtn.innerHTML = '<div class="loading"></div> Translating...';
            translateBtn.disabled = true;
            translationResult.textContent = 'Translating...';
            detectedLang.textContent = 'Detecting...';
            resultDiv.classList.add('show');
            
            // Remove any existing error messages
            const existingError = document.querySelector('.error');
            if (existingError) {
                existingError.remove();
            }
            
            try {
                const result = await translateText(text, sourceLang, targetLang);
                
                translationResult.textContent = result.translatedText;
                detectedLang.textContent = sourceLang === 'auto' ? 
                    `${getLanguageName(result.detectedLanguage)} (Auto-detected)` : 
                    getLanguageName(sourceLang);
                
            } catch (error) {
                console.error('Translation error:', error);
                
                // Show error message
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> <strong>Error:</strong> ${error.message}. Try using a different API or check your internet connection.`;
                translationInfo.parentNode.insertBefore(errorDiv, translationInfo);
                
                translationResult.textContent = 'Translation failed. Please try again.';
                detectedLang.textContent = 'Error';
                
                // Try fallback to sample translations for demo
                if (text.length < 100) {
                    // Simple fallback translation for demo
                    const fallbackTranslations = {
                        'en-es': {
                            'hello': 'hola',
                            'good morning': 'buenos días',
                            'thank you': 'gracias',
                            'how are you': 'cómo estás',
                            'goodbye': 'adiós'
                        },
                        'es-en': {
                            'hola': 'hello',
                            'buenos días': 'good morning',
                            'gracias': 'thank you',
                            'cómo estás': 'how are you',
                            'adiós': 'goodbye'
                        }
                    };
                    
                    const key = `${sourceLang === 'auto' ? 'en' : sourceLang}-${targetLang}`;
                    const lowerText = text.toLowerCase();
                    
                    if (fallbackTranslations[key] && fallbackTranslations[key][lowerText]) {
                        translationResult.textContent = fallbackTranslations[key][lowerText];
                        detectedLang.textContent = sourceLang === 'auto' ? 
                            'English (Auto-detected, Fallback)' : 
                            getLanguageName(sourceLang);
                    }
                }
            } finally {
                // Reset button
                translateBtn.innerHTML = '<i class="fas fa-exchange-alt"></i> Translate Text';
                translateBtn.disabled = false;
            }
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', function() {
            // Initialize language selectors
            initializeLanguageSelectors();
            
            // Set initial text
            sourceText.value = "Hello, welcome to the translator! Type your text and click translate.";
            charCount.textContent = sourceText.value.length;
            
            // Enable/disable button based on text
            translateBtn.disabled = sourceText.value.length === 0;
            
            // Add keyboard shortcut (Ctrl+Enter to translate)
            sourceText.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    translateBtn.click();
                }
            });
        });
    </script>
</body>
</html>
