<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: rgba(20, 20, 35, 0.8);
    border-bottom: 1px solid rgba(255, 69, 0, 0.2);
    margin-bottom: 30px;
    border-radius: 10px;
}

.back-btn {
    padding: 8px 15px;
    background: rgba(255, 128, 0, 0.2);
    border: 1px solid #ff8000;
    border-radius: 5px;
    color: #ff8000;
    cursor: pointer;
    text-decoration: none;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

.section {
    background: rgba(20, 20, 35, 0.5);
    border: 1px solid rgba(255, 69, 0, 0.2);
    border-radius: 10px;
    padding: 25px;
    margin-bottom: 25px;
}

textarea {
    width: 100%;
    min-height: 200px;
    padding: 15px;
    background: rgba(50, 50, 70, 0.4);
    border: 1px solid rgba(255, 128, 0, 0.3);
    border-radius: 8px;
    color: #fff;
    resize: vertical;
    font-family: inherit;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.stat {
    background: rgba(50, 50, 70, 0.3);
    border: 1px solid rgba(255, 128, 0, 0.2);
    border-radius: 8px;
    padding: 15px;
    text-align: center;
}

.stat-label {
    color: #aaa;
    font-size: 0.9rem;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 2rem;
    font-weight: bold;
    color: #ff8000;
}
    </style>
</head>
<body>
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <span style="font-size: 1.5rem; font-weight: bold;">Word Counter</span>
        <div style="width: 60px;"></div>
    </div>

    <div class="container">
        <div class="section">
            <h2 style="margin-bottom: 15px;"><i class="fas fa-file-word"></i> Paste Your Text</h2>
            <textarea id="textInput" placeholder="Paste your text here..." oninput="updateCount()"></textarea>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Words</div>
                    <div class="stat-value" id="wordCount">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Characters</div>
                    <div class="stat-value" id="charCount">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Sentences</div>
                    <div class="stat-value" id="sentenceCount">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Paragraphs</div>
                    <div class="stat-value" id="paraCount">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateCount() {
            const text = document.getElementById('textInput').value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            const sentences = text.split(/[.!?]+/).filter(s => s.trim()).length;
            const paragraphs = text.split(/\n\n+/).filter(p => p.trim()).length;

            document.getElementById('wordCount').textContent = words;
            document.getElementById('charCount').textContent = chars;
            document.getElementById('sentenceCount').textContent = sentences;
            document.getElementById('paraCount').textContent = paragraphs;
        }
    </script>
</body>
</html>
