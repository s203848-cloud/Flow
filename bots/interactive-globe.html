<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>High‑Quality Interactive Globe · Satellite Imagery</title>
    <!-- Font Awesome for back arrow (same as template) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ----- base from template with adjustments for fullscreen globe ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e); /* exactly the provided scheme */
            color: #fff;
            min-height: 100vh;
            overflow: hidden;           /* no scroll — canvas takes over */
            margin: 0;
            padding: 0;
        }
        
        /* navbar / back button – absolute so it floats above the canvas */
        .navbar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        
        .back-btn {
            padding: 8px 15px;
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
            transition: background 0.2s, backdrop-filter 0.2s;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:hover {
            background: rgba(255, 128, 0, 0.3);
            border-color: #ffaa33;
            color: #ffaa33;
        }

        /* optional subtle loading indicator (fades out when globe loads) */
        .loading-message {
            position: absolute;
            bottom: 20px;
            right: 30px;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            z-index: 90;
            pointer-events: none;
            backdrop-filter: blur(2px);
            padding: 4px 12px;
            border-radius: 30px;
            background: rgba(10,10,26,0.3);
            border: 1px solid rgba(255,128,0,0.2);
        }
    </style>
</head>
<body>

    <!-- back button exactly from template (plus icon) -->
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <!-- tiny non‑intrusive loading hint (will be hidden after load) -->
    <div class="loading-message" id="loadingMsg">loading high-res earth ...</div>

    <!-- Three.js will append canvas to body. we style it separately -->
    
    <!-- include Three.js core and OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ----- setup scene, camera, renderer with transparency (to show gradient) -----
        const scene = new THREE.Scene();
        // no background color – transparent, so body gradient shines through
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.2); // slightly zoomed out for better view
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // cap at 2 for performance & sharpness
        renderer.setClearColor(0x000000, 0); // transparent clear
        document.body.appendChild(renderer.domElement);
        
        // ensure canvas is positioned behind everything and fills screen
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '1';
        renderer.domElement.style.width = '100%';
        renderer.domElement.style.height = '100%';
        renderer.domElement.style.pointerEvents = 'auto'; // allow interaction

        // ----- lights: realistic sun simulation + fill -----
        // ambient light to softly illuminate shadows (use low intensity to keep contrast)
        const ambientLight = new THREE.AmbientLight(0x404060); // dark blueish fill
        
        // main directional light (simulating sun)
        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        sunLight.position.set(2, 1, 3); // from upper right
        sunLight.castShadow = false; // no shadows needed for sphere
        
        // secondary fill from opposite side to reduce harshness
        const fillLight = new THREE.DirectionalLight(0xccddff, 0.4);
        fillLight.position.set(-2, -0.5, 1);
        
        scene.add(ambientLight);
        scene.add(sunLight);
        scene.add(fillLight);

        // optional subtle backlight to highlight edges
        const backLight = new THREE.DirectionalLight(0x88aaff, 0.3);
        backLight.position.set(0, 0, -3);
        scene.add(backLight);

        // ----- high‑quality earth sphere -----
        // use 128x128 segments for smooth appearance (not MVP)
        const geometry = new THREE.SphereGeometry(1, 128, 128);
        
        // texture loader with loading manager to hide loading message
        const loader = new THREE.TextureLoader();
        const loadingMsg = document.getElementById('loadingMsg');
        
        // load high‑res satellite / atlas textures from three.js examples (reliable, high quality)
        const mapUrl = 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg';
        const normalUrl = 'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg';
        const specularUrl = 'https://threejs.org/examples/textures/planets/earth_specular_2048.jpg';
        // optional cloud layer? we skip to keep clean, but the atmos texture already includes clouds.
        
        // we'll create material after textures load, but we can start with placeholder and update
        // better: pre-create material with placeholders, then swap maps once loaded.
        const material = new THREE.MeshPhongMaterial({
            color: 0xffffff,
            specular: new THREE.Color(0x333333),       // typical for earth
            shininess: 5,                              // low shininess, specular map controls it
            emissive: 0x000000,
            map: null,
            normalMap: null,
            specularMap: null,
            normalScale: new THREE.Vector2(0.9, 0.9)   // subtle normal intensity
        });
        
        const earth = new THREE.Mesh(geometry, material);
        earth.rotation.y = 4.7; // nice initial rotation (show Americas/Atlantic)
        scene.add(earth);
        
        // load textures and apply to material
        let loadedCount = 0;
        function textureLoaded() {
            loadedCount++;
            if (loadedCount === 3) {
                // all three textures ready -> fade out loading message
                if (loadingMsg) {
                    loadingMsg.style.transition = 'opacity 0.8s';
                    loadingMsg.style.opacity = '0';
                    setTimeout(() => {
                        if (loadingMsg) loadingMsg.style.display = 'none';
                    }, 1000);
                }
            }
        }

        // diffuse (satellite imagery with atmosphere)
        loader.load(mapUrl, (tex) => {
            tex.anisotropy = 16; // improve sharpness at oblique angles
            material.map = tex;
            material.needsUpdate = true;
            textureLoaded();
        }, undefined, (err) => console.warn('Diffuse texture error', err));
        
        // normal map for terrain relief
        loader.load(normalUrl, (tex) => {
            tex.anisotropy = 16;
            material.normalMap = tex;
            material.needsUpdate = true;
            textureLoaded();
        }, undefined, (err) => console.warn('Normal map error', err));
        
        // specular map (shininess for oceans)
        loader.load(specularUrl, (tex) => {
            tex.anisotropy = 16;
            material.specularMap = tex;
            material.needsUpdate = true;
            textureLoaded();
        }, undefined, (err) => console.warn('Specular map error', err));

        // ----- simple starfield? we rely on gradient background, but add tiny floating particles? 
        // optional: very subtle distant stars (barely visible) to enhance depth.
        // we'll create a few thousand small points with low opacity.
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const positions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            // random sphere distribution at radius ~ 10
            const r = 8 + Math.random() * 4; // random distance
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            positions[i] = Math.sin(phi) * Math.cos(theta) * r;
            positions[i+1] = Math.sin(phi) * Math.sin(theta) * r;
            positions[i+2] = Math.cos(phi) * r;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const starsMaterial = new THREE.PointsMaterial({ 
            color: 0x88aadd, 
            size: 0.02, 
            transparent: true, 
            opacity: 0.4,
            blending: THREE.AdditiveBlending
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars); // rotates with camera? actually static, but adds depth.

        // ----- controls: smooth, damped, with auto‑rotate option? we let user rotate freely. -----
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;          // smooth inertia
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;        // gentle rotation, like a real globe
        controls.enableZoom = true;
        controls.zoomSpeed = 1.0;
        controls.minDistance = 1.8;
        controls.maxDistance = 6.0;
        controls.enablePan = false;             // keep earth centered
        controls.maxPolarAngle = Math.PI / 1.8;  // restrict a bit to avoid flipping too much (optional)
        
        // start with a nice view
        controls.target.set(0, 0, 0);

        // ----- animation loop -----
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update(); // handles autoRotate if enabled (true)
            
            // slowly rotate stars for a subtle dynamic effect (optional)
            stars.rotation.y += 0.00002;
            
            renderer.render(scene, camera);
        }
        animate();

        // ----- handle window resize -----
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // hide loading message after 4 seconds even if textures somehow stalled (fallback)
        setTimeout(() => {
            if (loadingMsg && loadingMsg.style.opacity !== '0') {
                loadingMsg.style.transition = 'opacity 0.5s';
                loadingMsg.style.opacity = '0';
                setTimeout(() => {
                    if (loadingMsg) loadingMsg.style.display = 'none';
                }, 600);
            }
        }, 5000);
    </script>
</body>
</html>
