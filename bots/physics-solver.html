<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Solver</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>* {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI';} body {background: linear-gradient(135deg, #0a0a1a, #1a0a2e); color: #fff; min-height: 100vh; padding: 20px;} .navbar {display: flex; justify-content: space-between; padding: 15px 30px; background: rgba(20, 20, 35, 0.8); margin-bottom: 30px; border-radius: 10px;} .back-btn {padding: 8px 15px; background: rgba(255, 128, 0, 0.2); border: 1px solid #ff8000; border-radius: 5px; color: #ff8000; cursor: pointer; text-decoration: none;} .container {max-width: 900px; margin: 0 auto;} .section {background: rgba(20, 20, 35, 0.5); border: 1px solid rgba(255, 69, 0, 0.2); border-radius: 10px; padding: 25px; margin-bottom: 25px;} input {width: 100%; padding: 10px; background: rgba(50, 50, 70, 0.4); border: 1px solid rgba(255, 128, 0, 0.3); border-radius: 5px; color: #fff; margin: 10px 0;} .btn {padding: 12px 25px; background: linear-gradient(to right, #ff7e00, #ff4500); border: none; border-radius: 8px; color: white; cursor: pointer; width: 100%;} .result {background: rgba(50, 50, 70, 0.4); border: 1px solid rgba(255, 128, 0, 0.3); border-radius: 8px; padding: 20px; margin-top: 20px; display: none;} .result.show {display: block;}</style>
</head>
<body>
    <div class="navbar"><a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a><span style="font-size: 1.5rem; font-weight: bold;">Physics Solver</span></div>
    <div class="container"><div class="section"><h2 style="margin-bottom: 15px;"><i class="fas fa-atom"></i> Velocity Calculator</h2><p style="color: #aaa; margin-bottom: 10px;">v = u + at</p><input type="number" id="u" placeholder="Initial velocity (u)"><input type="number" id="a" placeholder="Acceleration (a)"><input type="number" id="t" placeholder="Time (t)"><button class="btn" onclick="solveVelocity()"><i class="fas fa-calculator"></i> Calculate</button><div class="result" id="result"><div id="resultText"></div></div></div></div>
    <script>function solveVelocity() {const u = parseFloat(document.getElementById('u').value); const a = parseFloat(document.getElementById('a').value); const t = parseFloat(document.getElementById('t').value); const v = u + (a * t); document.getElementById('resultText').innerHTML = `<strong>Final Velocity (v) = ${v.toFixed(2)} m/s</strong>`; document.getElementById('result').classList.add('show');}</script>
</body>
</html>
