<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Password Checker</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}body{background:linear-gradient(135deg,#0a0a1a,#1a0a2e);color:#fff;min-height:100vh;padding:20px}.navbar{display:flex;justify-content:space-between;padding:15px 30px;background:rgba(20,20,35,.8);margin-bottom:30px;border-radius:10px}.back-btn{padding:8px 15px;background:rgba(255,128,0,.2);border:1px solid #ff8000;border-radius:5px;color:#ff8000;cursor:pointer;text-decoration:none}.container{max-width:900px;margin:0 auto}.section{background:rgba(20,20,35,.5);border:1px solid rgba(255,69,0,.2);border-radius:10px;padding:25px}input{width:100%;padding:10px;background:rgba(50,50,70,.4);border:1px solid rgba(255,128,0,.3);border-radius:5px;color:#fff;margin:10px 0}.strength{margin-top:20px;padding:15px;border-radius:8px}.strong{background:rgba(76,175,80,.3);border:1px solid #4caf50;color:#4caf50}.weak{background:rgba(244,67,54,.3);border:1px solid #f44336;color:#f44336}.medium{background:rgba(255,152,0,.3);border:1px solid #ff9800;color:#ff9800}</style></head><body><div class="navbar"><a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a><span style="font-size:1.5rem;font-weight:bold">Password Checker</span></div><div class="container"><div class="section"><h2 style="margin-bottom:15px"><i class="fas fa-lock"></i> Check Password Strength</h2><input type="password" id="passInput" placeholder="Enter password" oninput="checkStrength()"><div id="strength"></div></div></div><script>function checkStrength(){const pass=document.getElementById('passInput').value;let strength='Weak';let cls='weak';if(pass.length>=8&&/[A-Z]/.test(pass)&&/[0-9]/.test(pass))strength='Strong',cls='strong';else if(pass.length>=6)strength='Medium',cls='medium';document.getElementById('strength').innerHTML=`<div class="strength ${cls}"><strong>Strength:</strong> ${strength}</div>`;}</script></body></html>
