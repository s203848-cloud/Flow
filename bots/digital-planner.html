<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Web Title based on "Digital Planner" -->
    <title>Digital Planner – Daily/Weekly with goal tracking</title>
    <!-- Font Awesome 6 (free) for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ----- base & inherited styles from template ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .back-btn {
            padding: 8px 15px;
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 128, 0, 0.3);
        }

        .navbar {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        h1 {
            font-weight: 400;
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        h1 i {
            color: #ff8000;
            margin-right: 10px;
        }

        h2 {
            font-weight: 300;
            font-size: 1.6rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,128,0,0.3);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 i {
            color: #ff8000;
            font-size: 1.5rem;
        }

        /* ----- planner grid (cards) ----- */
        .planner-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 10px;
        }

        .card {
            background: rgba(20, 10, 35, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,128,0,0.25);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #ff8000;
        }

        /* ----- task lists ----- */
        .task-list {
            list-style: none;
            margin: 15px 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            border-radius: 40px;
            padding: 8px 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,128,0,0.2);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .task-check {
            width: 18px;
            height: 18px;
            accent-color: #ff8000;
            cursor: pointer;
        }

        .task-text {
            font-size: 1rem;
            word-break: break-word;
        }

        .completed .task-text {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .delete-task {
            background: none;
            border: none;
            color: #ff8000;
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 5px;
        }

        .delete-task:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* ----- add task / goal forms ----- */
        .add-form {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .add-input {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid #ff8000;
            border-radius: 40px;
            padding: 10px 15px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .add-input:focus {
            border-color: #ffaa33;
            box-shadow: 0 0 0 2px rgba(255,128,0,0.3);
        }

        .add-btn {
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            border-radius: 40px;
            color: #ff8000;
            padding: 0 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .add-btn:hover {
            background: rgba(255, 128, 0, 0.4);
        }

        /* ----- goal items & progress ----- */
        .goal-item {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,128,0,0.2);
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .goal-name {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .goal-stats {
            font-size: 0.9rem;
            color: #ffaa33;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff8000, #ffb347);
            width: 0%;
            border-radius: 20px;
        }

        .goal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 8px;
        }

        .inc-btn {
            background: rgba(255,128,0,0.15);
            border: 1px solid #ff8000;
            border-radius: 30px;
            color: #ff8000;
            padding: 5px 15px;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .inc-btn:hover {
            background: rgba(255,128,0,0.3);
        }

        .remove-goal {
            background: none;
            border: none;
            color: #ff8000;
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.7;
        }

        /* responsive */
        @media (max-width: 700px) {
            .planner-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <!-- Back button exactly as requested, pointing to ../tools-list.html -->
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <h1><i class="fas fa-calendar-alt"></i> Digital Planner</h1>
    </div>

    <!-- Main planner grid: daily, weekly, goals -->
    <div class="planner-grid">
        <!-- DAILY LAYOUT CARD -->
        <div class="card" id="daily-card">
            <h2><i class="fas fa-sun"></i> Daily Tasks</h2>
            <div id="daily-date" style="margin-bottom: 10px; color: #ffaa33;">
                <i class="far fa-calendar"></i> 
                <script>
                    // show current date (harmless inline script)
                    document.write(new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }));
                </script>
            </div>
            <ul class="task-list" id="daily-list"></ul>
            <div class="add-form">
                <input type="text" class="add-input" id="new-daily-input" placeholder="e.g., Review emails">
                <button class="add-btn" id="add-daily-btn"><i class="fas fa-plus"></i> Add</button>
            </div>
        </div>

        <!-- WEEKLY LAYOUT CARD -->
        <div class="card">
            <h2><i class="fas fa-calendar-week"></i> Weekly Focus</h2>
            <ul class="task-list" id="weekly-list"></ul>
            <div class="add-form">
                <input type="text" class="add-input" id="new-weekly-input" placeholder="e.g., Plan meeting">
                <button class="add-btn" id="add-weekly-btn"><i class="fas fa-plus"></i> Add</button>
            </div>
        </div>

        <!-- GOAL TRACKING CARD -->
        <div class="card">
            <h2><i class="fas fa-bullseye"></i> Goal Tracking</h2>
            <div id="goals-container"></div>
            <div class="add-form">
                <input type="text" class="add-input" id="new-goal-name" placeholder="Goal name">
                <input type="number" class="add-input" id="new-goal-target" placeholder="Target" min="1" style="max-width: 80px;">
                <button class="add-btn" id="add-goal-btn"><i class="fas fa-plus"></i> Add</button>
            </div>
            <p style="font-size: 0.8rem; margin-top: 12px; opacity: 0.7;"><i class="fas fa-info-circle"></i> Click +1 to increase progress</p>
        </div>
    </div>

    <script>
        (function() {
            // ---------- Data structures (in-memory) ----------
            // Daily tasks
            let dailyTasks = [
                { id: 'd1', text: 'Morning meditation', completed: false },
                { id: 'd2', text: 'Finish report', completed: true },
                { id: 'd3', text: 'Call with client', completed: false }
            ];

            // Weekly tasks
            let weeklyTasks = [
                { id: 'w1', text: 'Review weekly goals', completed: false },
                { id: 'w2', text: 'Prepare presentation', completed: false },
                { id: 'w3', text: 'Team sync', completed: true }
            ];

            // Goals with progress
            let goals = [
                { id: 'g1', name: 'Read 3 books', current: 1, target: 3 },
                { id: 'g2', name: 'Workout sessions', current: 2, target: 5 },
                { id: 'g3', name: 'Save $500', current: 200, target: 500 }
            ];

            // Helper: generate short unique id (for demo)
            function uid() {
                return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            }

            // ---------- Render functions ----------
            function renderDaily() {
                const listEl = document.getElementById('daily-list');
                if (!listEl) return;
                listEl.innerHTML = '';
                dailyTasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;
                    li.dataset.id = task.id;

                    li.innerHTML = `
                        <div class="task-left">
                            <input type="checkbox" class="task-check" ${task.completed ? 'checked' : ''}>
                            <span class="task-text">${escapeHTML(task.text)}</span>
                        </div>
                        <button class="delete-task" title="delete task"><i class="fas fa-trash-alt"></i></button>
                    `;

                    // checkbox toggle
                    const cb = li.querySelector('.task-check');
                    cb.addEventListener('change', (e) => {
                        task.completed = cb.checked;
                        renderDaily();  // re-render to reflect line-through
                    });

                    // delete button
                    const delBtn = li.querySelector('.delete-task');
                    delBtn.addEventListener('click', () => {
                        dailyTasks = dailyTasks.filter(t => t.id !== task.id);
                        renderDaily();
                    });

                    listEl.appendChild(li);
                });
            }

            function renderWeekly() {
                const listEl = document.getElementById('weekly-list');
                if (!listEl) return;
                listEl.innerHTML = '';
                weeklyTasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;
                    li.dataset.id = task.id;

                    li.innerHTML = `
                        <div class="task-left">
                            <input type="checkbox" class="task-check" ${task.completed ? 'checked' : ''}>
                            <span class="task-text">${escapeHTML(task.text)}</span>
                        </div>
                        <button class="delete-task" title="delete task"><i class="fas fa-trash-alt"></i></button>
                    `;

                    const cb = li.querySelector('.task-check');
                    cb.addEventListener('change', () => {
                        task.completed = cb.checked;
                        renderWeekly();
                    });

                    const delBtn = li.querySelector('.delete-task');
                    delBtn.addEventListener('click', () => {
                        weeklyTasks = weeklyTasks.filter(t => t.id !== task.id);
                        renderWeekly();
                    });

                    listEl.appendChild(li);
                });
            }

            function renderGoals() {
                const container = document.getElementById('goals-container');
                if (!container) return;
                container.innerHTML = '';
                goals.forEach(goal => {
                    const percent = Math.min(100, Math.round((goal.current / goal.target) * 100)) || 0;
                    const div = document.createElement('div');
                    div.className = 'goal-item';
                    div.dataset.id = goal.id;

                    div.innerHTML = `
                        <div class="goal-header">
                            <span class="goal-name">${escapeHTML(goal.name)}</span>
                            <span class="goal-stats">${goal.current} / ${goal.target}</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-fill" style="width: ${percent}%;"></div>
                        </div>
                        <div class="goal-actions">
                            <button class="inc-btn" title="Increase progress by 1"><i class="fas fa-plus-circle"></i> +1</button>
                            <button class="remove-goal" title="Remove goal"><i class="fas fa-times"></i></button>
                        </div>
                    `;

                    // +1 button
                    const incBtn = div.querySelector('.inc-btn');
                    incBtn.addEventListener('click', () => {
                        if (goal.current < goal.target) {
                            goal.current = Math.min(goal.current + 1, goal.target);
                        } else {
                            alert('Goal already completed!');
                        }
                        renderGoals();
                    });

                    // remove goal
                    const rmBtn = div.querySelector('.remove-goal');
                    rmBtn.addEventListener('click', () => {
                        goals = goals.filter(g => g.id !== goal.id);
                        renderGoals();
                    });

                    container.appendChild(div);
                });
            }

            // simple escape for XSS prevention
            function escapeHTML(str) {
                return String(str).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // ---------- Add event listeners ----------
            document.addEventListener('DOMContentLoaded', () => {
                // initial render
                renderDaily();
                renderWeekly();
                renderGoals();

                // Daily add
                document.getElementById('add-daily-btn').addEventListener('click', () => {
                    const input = document.getElementById('new-daily-input');
                    const text = input.value.trim();
                    if (text === '') return;
                    dailyTasks.push({ id: uid(), text: text, completed: false });
                    input.value = '';
                    renderDaily();
                });

                // Weekly add
                document.getElementById('add-weekly-btn').addEventListener('click', () => {
                    const input = document.getElementById('new-weekly-input');
                    const text = input.value.trim();
                    if (text === '') return;
                    weeklyTasks.push({ id: uid(), text: text, completed: false });
                    input.value = '';
                    renderWeekly();
                });

                // Goal add
                document.getElementById('add-goal-btn').addEventListener('click', () => {
                    const nameInput = document.getElementById('new-goal-name');
                    const targetInput = document.getElementById('new-goal-target');
                    const name = nameInput.value.trim();
                    const target = parseInt(targetInput.value, 10);

                    if (name === '' || isNaN(target) || target <= 0) {
                        alert('Please enter a valid goal name and target (positive number).');
                        return;
                    }

                    goals.push({
                        id: uid(),
                        name: name,
                        current: 0,
                        target: target
                    });

                    nameInput.value = '';
                    targetInput.value = '';
                    renderGoals();
                });

                // optional: allow enter key on inputs
                const dailyInp = document.getElementById('new-daily-input');
                dailyInp.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') document.getElementById('add-daily-btn').click();
                });
                document.getElementById('new-weekly-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') document.getElementById('add-weekly-btn').click();
                });
            });
        })();
    </script>

    <!-- subtle instruction (execution / dependencies) -->
    <!-- 
        Dependencies: Font Awesome 6 (loaded via CDN). 
        No build step needed – works in any modern browser.
        Data is stored in memory; refresh resets to sample.
        Back button leads to ../tools-list.html (relative).
    -->
</body>
</html>
