<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Graph Plotter</title>
    <!-- Font Awesome for back arrow icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Math.js for safe function parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.7.0/math.min.js"></script>
    <!-- Three.js core and orbit controls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <style>
        /* global reset and scheme exactly from template, extended */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;           /* prevent scroll, canvas fills */
            position: relative;
        }

        /* navigation bar – back button exactly as requested */
        .navbar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;               /* above canvas */
        }

        .back-btn {
            padding: 8px 15px;
            background: rgba(255, 128, 0, 0.2);
            border: 1px solid #ff8000;
            border-radius: 5px;
            color: #ff8000;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        .back-btn:hover {
            background: rgba(255, 128, 0, 0.3);
        }

        /* floating control panel – high‑quality glassmorphism with orange accent */
        .plot-controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 90;
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 128, 0, 0.5);
            border-radius: 16px;
            padding: 20px 24px;
            width: 360px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,128,0,0.2) inset;
            transition: border-color 0.2s;
        }

        .plot-controls:hover {
            border-color: #ff8000;
        }

        .plot-controls h3 {
            font-weight: 400;
            margin-bottom: 15px;
            color: #ffaa44;
            letter-spacing: 1px;
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(255,128,0,0.3);
            padding-bottom: 8px;
        }

        .function-input {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .function-input label {
            font-size: 0.9rem;
            color: #ddd;
            margin-left: 5px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            border: 1px solid #ff8000;
            padding: 2px 2px 2px 18px;
        }

        .input-row span {
            color: #ffaa44;
            font-weight: 500;
            font-size: 1.1rem;
        }

        #funcInput {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 8px 12px 0;
            color: white;
            font-family: 'Segoe UI', monospace;
            font-size: 1rem;
            outline: none;
        }

        #funcInput::placeholder {
            color: #888;
            font-style: italic;
        }

        .btn-plot {
            background: rgba(255, 128, 0, 0.85);
            border: none;
            border-radius: 40px;
            padding: 10px 22px;
            color: #0a0a1a;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 5px 15px rgba(255,128,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            letter-spacing: 0.5px;
        }

        .btn-plot:hover {
            background: rgba(255, 128, 0, 1);
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(255,128,0,0.5);
        }

        .btn-plot i {
            font-size: 1rem;
        }

        .info-hint {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #aaa;
            background: rgba(255,128,0,0.1);
            padding: 8px 12px;
            border-radius: 30px;
            border-left: 3px solid #ff8000;
        }

        .info-hint code {
            color: #ffaa44;
            background: #1e1a2e;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        /* small stats in lower right (optional but clean) */
        .stats {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 90;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            border: 1px solid rgba(255,128,0,0.3);
            padding: 8px 16px;
            font-size: 0.8rem;
            color: #ffaa44;
            pointer-events: none;
        }

        /* canvas fills the space behind */
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- back button exactly from template (with icon) -->
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <!-- main 3D canvas will be injected by Three.js -->
    
    <!-- high‑quality control panel for function input -->
    <div class="plot-controls">
        <h3><i class="fas fa-chart-line" style="color:#ff8000; margin-right: 8px;"></i>3D GRAPH PLOTTER</h3>
        <div class="function-input">
            <label>f(x, y) =</label>
            <div class="input-row">
                <span>z =</span>
                <input type="text" id="funcInput" value="sin(x) * cos(y)" placeholder="e.g., x^2 - y^2">
            </div>
            <button class="btn-plot" id="plotBtn"><i class="fas fa-cube"></i> UPDATE SURFACE</button>
            <div class="info-hint">
                <i class="fas fa-lightbulb" style="color:#ff8000;"></i> 
                Use JavaScript math: <code>sin(x)</code>, <code>cos(y)</code>, <code>x^2</code>, <code>sqrt(x^2+y^2)</code>, <code>exp(-x^2-y^2)</code> …
            </div>
        </div>
    </div>

    <!-- subtle stats (grid size, etc) -->
    <div class="stats" id="statsDisplay">
        <i class="fas fa-grid-2" style="margin-right: 6px;"></i> 80x80 grid · dynamic color
    </div>

    <script type="module">
        // ----- THREE.JS SETUP (high quality, transparent background) -----
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- scene with transparent background to show CSS gradient
        const scene = new THREE.Scene();
        scene.background = null; // transparent

        // --- camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 12);
        camera.lookAt(0, 0, 0);

        // --- renderer (alpha true for gradient)
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // crisp but not overkill
        renderer.shadowMap.enabled = false; // not needed
        renderer.outputEncoding = THREE.sRGBEncoding; // for older three r128? actually use colorManagement
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- controls (smooth, with damping)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2; // restrict below to avoid flipping
        controls.minDistance = 5;
        controls.maxDistance = 30;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.enableZoom = true;
        controls.enablePan = true;

        // --- LIGHTS: create a rich, volumetric feel
        // Ambient for base
        const ambientLight = new THREE.AmbientLight(0x404060); // subtle purple-blue
        scene.add(ambientLight);

        // main key light (orange accent)
        const keyLight = new THREE.DirectionalLight(0xffaa66, 1.2);
        keyLight.position.set(2, 5, 3);
        scene.add(keyLight);

        // fill light cool
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.8);
        fillLight.position.set(-3, 2, 4);
        scene.add(fillLight);

        // back light to pop edges
        const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
        backLight.position.set(0, 2, -8);
        scene.add(backLight);

        // extra point lights for dynamic feel
        const pointLight1 = new THREE.PointLight(0xff6000, 0.6, 20);
        pointLight1.position.set(3, 4, 3);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0x4a80ff, 0.5, 20);
        pointLight2.position.set(-4, 3, -4);
        scene.add(pointLight2);

        // --- GRID & AXES (custom orange style to match scheme)
        const gridHelper = new THREE.GridHelper(14, 20, 0xff8000, 0x443366);
        gridHelper.position.y = -0.01; // slightly below to avoid z-fighting
        scene.add(gridHelper);

        // simple axis lines with orange/white
        const axesMaterial = (color) => new THREE.LineBasicMaterial({ color });
        const axisLength = 6.5;
        
        const xAxisPoints = [new THREE.Vector3(-axisLength, 0, 0), new THREE.Vector3(axisLength, 0, 0)];
        const xAxisGeo = new THREE.BufferGeometry().setFromPoints(xAxisPoints);
        const xAxisLine = new THREE.Line(xAxisGeo, axesMaterial(0xff8000));
        scene.add(xAxisLine);

        const yAxisPoints = [new THREE.Vector3(0, -axisLength, 0), new THREE.Vector3(0, axisLength, 0)];
        const yAxisGeo = new THREE.BufferGeometry().setFromPoints(yAxisPoints);
        const yAxisLine = new THREE.Line(yAxisGeo, axesMaterial(0xff8000));
        scene.add(yAxisLine);

        const zAxisPoints = [new THREE.Vector3(0, 0, -axisLength), new THREE.Vector3(0, 0, axisLength)];
        const zAxisGeo = new THREE.BufferGeometry().setFromPoints(zAxisPoints);
        const zAxisLine = new THREE.Line(zAxisGeo, axesMaterial(0xff8000));
        scene.add(zAxisLine);

        // small axis helpers (arrows) – subtle
        const arrowHelper = (dir, origin, length, color) => {
            const arrow = new THREE.ArrowHelper(new THREE.Vector3(dir[0], dir[1], dir[2]).normalize(), origin, length, color, 0.4, 0.2);
            scene.add(arrow);
        };
        arrowHelper([1,0,0], new THREE.Vector3(axisLength-0.5,0,0), 0.8, 0xff8000);
        arrowHelper([-1,0,0], new THREE.Vector3(-axisLength+0.5,0,0), 0.8, 0xff8000);
        arrowHelper([0,1,0], new THREE.Vector3(0,axisLength-0.5,0), 0.8, 0xff8000);
        arrowHelper([0,-1,0], new THREE.Vector3(0,-axisLength+0.5,0), 0.8, 0xff8000);
        arrowHelper([0,0,1], new THREE.Vector3(0,0,axisLength-0.5), 0.8, 0xff8000);
        arrowHelper([0,0,-1], new THREE.Vector3(0,0,-axisLength+0.5), 0.8, 0xff8000);

        // --- SURFACE MESH (high resolution, dynamic colors)
        const segments = 80; // quality setting
        const width = 12;     // domain from -6 to 6
        const height = 12;

        // Precompute indices (same topology every time)
        const indices = [];
        for (let j = 0; j < segments; j++) {
            for (let i = 0; i < segments; i++) {
                const a = i + j * (segments + 1);
                const b = i + 1 + j * (segments + 1);
                const c = i + (j + 1) * (segments + 1);
                const d = i + 1 + (j + 1) * (segments + 1);
                // two triangles per cell
                indices.push(a, b, c);
                indices.push(b, d, c);
            }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setIndex(indices);
        
        // position array (will be updated)
        const positionCount = (segments + 1) * (segments + 1);
        const positions = new Float32Array(positionCount * 3);
        const colors = new Float32Array(positionCount * 3);
        
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Material with vertex colors for smooth gradient
        const material = new THREE.MeshPhongMaterial({
            vertexColors: true,
            shininess: 40,
            emissive: 0x000000,
            side: THREE.DoubleSide, // to see inside when rotating
            flatShading: false,
            transparent: true,
            opacity: 0.95,
            wireframe: false
        });

        const surfaceMesh = new THREE.Mesh(geometry, material);
        surfaceMesh.castShadow = false;
        surfaceMesh.receiveShadow = false;
        scene.add(surfaceMesh);

        // Also add a fine wireframe overlay with orange tint (enhances quality feel)
        const wireframeMaterial = new THREE.MeshBasicMaterial({ color: 0xff8000, wireframe: true, transparent: true, opacity: 0.12 });
        const wireframeMesh = new THREE.Mesh(geometry, wireframeMaterial);
        surfaceMesh.add(wireframeMesh); // attach to surface so it moves with it

        // --- FUNCTION UPDATE LOGIC (using math.js)
        const funcInput = document.getElementById('funcInput');
        const plotBtn = document.getElementById('plotBtn');
        const statsDiv = document.getElementById('statsDisplay');

        // default function string already in input: sin(x) * cos(y)

        function compileFunction(expr) {
            try {
                return math.compile(expr);
            } catch (e) {
                alert(`Invalid function: ${e.message}`);
                return null;
            }
        }

        function updateSurface() {
            const expr = funcInput.value.trim();
            const compiled = compileFunction(expr);
            if (!compiled) return;

            // get attribute arrays
            const posAttr = geometry.attributes.position;
            const colAttr = geometry.attributes.color;
            const posArray = posAttr.array;
            const colArray = colAttr.array;

            const halfW = width / 2;
            const halfH = height / 2;

            let minZ = Infinity;
            let maxZ = -Infinity;
            const zValues = []; // store for second pass

            // First pass: compute positions and find min/max z
            let idx = 0;
            for (let j = 0; j <= segments; j++) {
                const y = (j / segments) * height - halfH; // -6 .. 6
                for (let i = 0; i <= segments; i++) {
                    const x = (i / segments) * width - halfW; // -6 .. 6
                    
                    let z = 0;
                    try {
                        // evaluate with math.js
                        z = compiled.evaluate({ x: x, y: y });
                        if (!isFinite(z)) z = 0;
                    } catch (e) {
                        z = 0;
                    }
                    
                    posArray[idx] = x;
                    posArray[idx+1] = y;
                    posArray[idx+2] = z;
                    
                    zValues.push(z);
                    if (z < minZ) minZ = z;
                    if (z > maxZ) maxZ = z;
                    
                    idx += 3;
                }
            }

            // Avoid flat range (if all z equal)
            if (maxZ - minZ < 1e-12) {
                maxZ = minZ + 1.0;
            }

            // Second pass: assign colors (interpolate between purple (#a05eff) and orange (#ff8000))
            const purple = new THREE.Color(0xa05eff);
            const orange = new THREE.Color(0xff8000);
            
            idx = 0;
            for (let k = 0; k < zValues.length; k++) {
                const z = zValues[k];
                // map z to t in [0,1]
                const t = (z - minZ) / (maxZ - minZ);
                // blend
                const color = purple.clone().lerp(orange, t);
                
                colArray[idx] = color.r;
                colArray[idx+1] = color.g;
                colArray[idx+2] = color.b;
                idx += 3;
            }

            // mark attributes as needing update
            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;
            
            // update normals for lighting
            geometry.computeVertexNormals();

            // update stats with small range info
            statsDiv.innerHTML = `<i class="fas fa-grid-2" style="margin-right: 6px;"></i> 80x80 grid · z ∈ [${minZ.toFixed(2)}, ${maxZ.toFixed(2)}]`;
        }

        // initial plot
        updateSurface();

        // event listener
        plotBtn.addEventListener('click', () => {
            updateSurface();
            // small auto-rotate reset to enjoy new shape
            controls.autoRotate = true;
        });

        // also allow enter key in input
        funcInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                plotBtn.click();
            }
        });

        // --- RESIZE HANDLER
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);

            // auto-rotate if enabled
            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        // small extra: toggle auto-rotate when user drags
        renderer.domElement.addEventListener('mousedown', () => {
            controls.autoRotate = false;
        });
        renderer.domElement.addEventListener('mouseup', () => {
            // could set to true again after a while, but we leave it off. user can refresh.
        });

        console.log('3D Graph Plotter ready — high quality mode');
    </script>
</body>
</html>
