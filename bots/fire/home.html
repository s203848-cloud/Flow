<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100804">
    <title>FIRE Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: dark;
            --bg: #100804;
            --panel: #1b0d06;
            --panel-raised: #241107;
            --line: #46200e;
            --text: #fff0e3;
            --muted: #b88d72;
            --orange: #ff7029;
            --orange-bright: #ff9a51;
            --orange-dark: #9f370d;
            --sidebar-width: 248px;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
        }
        button, input, select { font: inherit; }
        button, a, select { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--orange-bright);
            outline-offset: 3px;
        }
        .app-shell { min-height: 100vh; }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            width: var(--sidebar-width);
            padding: 26px 18px 20px;
            overflow-y: auto;
            background: #160a05;
            border-right: 1px solid var(--line);
            transition: width .2s ease;
        }
        .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 26px; }
        .brand-mark {
            display: grid;
            width: 40px;
            height: 40px;
            place-items: center;
            color: #210c02;
            background: var(--orange);
            border-radius: 12px;
            box-shadow: 0 6px 20px #ff702933;
            font-size: 19px;
        }
        .brand-name { font: 800 29px/.85 'Barlow Condensed', sans-serif; letter-spacing: 1px; }
        .brand-caption { margin-top: 5px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: 2px; }
        .nav-label { padding: 15px 11px 8px; color: #8c634b; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; }
        .nav-list { display: grid; gap: 4px; }
        .nav-link, .category-link {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 42px;
            gap: 12px;
            padding: 0 12px;
            color: #c9a48d;
            background: transparent;
            border: 0;
            border-radius: 8px;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            transition: background .16s, color .16s;
        }
        .nav-link i, .category-link i { width: 17px; color: #bd7143; text-align: center; }
        .nav-link:hover, .category-link:hover { color: var(--text); background: #281309; }
        .nav-link.active, .category-link.active { color: #ffb078; background: #38200f; }
        .nav-link.active i, .category-link.active i { color: var(--orange); }
        .nav-count { margin-left: auto; color: #a97a5e; font-size: 11px; }
        .sidebar-footer { margin-top: auto; padding: 20px 11px 0; color: #8c634b; font-size: 11px; }
        .sidebar-footer strong { color: #d78a56; font-weight: 600; }

        .main { min-height: 100vh; margin-left: var(--sidebar-width); padding: 30px clamp(22px, 4vw, 58px) 60px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 32px; }
        .eyebrow { color: var(--orange); font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .page-title { margin: 4px 0 0; font: 700 34px/1 'Barlow Condensed', sans-serif; letter-spacing: .3px; }
        .topbar-meta { display: flex; align-items: center; gap: 14px; }
        .library-total { color: var(--muted); font-size: 12px; white-space: nowrap; }
        .library-total strong { color: var(--text); font-size: 14px; }
        .top-play {
            display: inline-flex;
            min-height: 39px;
            align-items: center;
            gap: 8px;
            padding: 0 15px;
            color: #210b02;
            background: var(--orange);
            border-radius: 7px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: background .16s, transform .16s;
        }
        .top-play:hover { background: #ff9250; transform: translateY(-1px); }

        .feature {
            position: relative;
            display: flex;
            min-height: 244px;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            padding: 30px 34px;
            overflow: hidden;
            background:
                linear-gradient(90deg, rgba(28, 12, 4, .98) 4%, rgba(35, 14, 4, .88) 51%, rgba(72, 26, 6, .35)),
                repeating-linear-gradient(135deg, #7d310f22 0 1px, transparent 1px 14px),
                #351707;
            border: 1px solid #78340f;
            border-radius: 12px;
            isolation: isolate;
        }
        .feature::after {
            position: absolute;
            z-index: -1;
            top: -110px;
            right: 7%;
            width: 340px;
            height: 340px;
            border: 1px solid #ff8a3c35;
            border-radius: 50%;
            box-shadow: 0 0 0 28px #ff8a3c0d, 0 0 0 58px #ff8a3c0a;
            content: '';
        }
        .feature-copy { max-width: 620px; }
        .feature-kicker { color: #ffa269; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .feature-title { max-width: 600px; margin: 8px 0 8px; font: 800 clamp(38px, 5vw, 62px)/.95 'Barlow Condensed', sans-serif; overflow-wrap: anywhere; }
        .feature-description { max-width: 540px; margin: 0; color: #d1aa8d; font-size: 13px; line-height: 1.6; }
        .feature-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 12px; }
        .feature-play {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            gap: 10px;
            padding: 0 20px;
            color: #210b02;
            background: var(--orange);
            border: 0;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
            transition: background .16s, transform .16s;
        }
        .feature-play:hover { background: #ff9957; transform: translateY(-2px); }
        .feature-refresh {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            color: #ffc095;
            background: #381a0c;
            border: 1px solid #82401d;
            border-radius: 7px;
            cursor: pointer;
        }
        .feature-refresh:hover { background: #51230e; }

        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 30px 0 18px; }
        .search-box {
            display: flex;
            width: min(440px, 100%);
            min-height: 43px;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            color: #bd825d;
            background: #1a0c06;
            border: 1px solid #48230f;
            border-radius: 7px;
        }
        .search-box:focus-within { border-color: #b9511b; box-shadow: 0 0 0 3px #ff702914; }
        .search-box input { width: 100%; min-width: 0; color: var(--text); background: transparent; border: 0; outline: 0; font-size: 12px; }
        .search-box input::placeholder { color: #8d654e; }
        .shortcut { padding: 3px 6px; color: #a57a61; border: 1px solid #51301e; border-radius: 4px; font-size: 10px; white-space: nowrap; }
        .toolbar-controls { display: flex; align-items: center; gap: 8px; }
        .sort-select, .view-button {
            height: 40px;
            color: #d9b39a;
            background: #1a0c06;
            border: 1px solid #48230f;
            border-radius: 7px;
        }
        .sort-select { padding: 0 30px 0 11px; font-size: 11px; }
        .view-toggle { display: flex; gap: 4px; padding: 3px; background: #1a0c06; border: 1px solid #48230f; border-radius: 7px; }
        .view-button { width: 32px; height: 32px; border: 0; cursor: pointer; }
        .view-button.active { color: #ffad76; background: #3a1c0c; }
        .result-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; color: #a9826b; font-size: 11px; }
        .result-line strong { color: #e4c2aa; font-weight: 600; }
        .clear-filter { padding: 3px 0; color: #ff9b5b; background: none; border: 0; font-size: 11px; cursor: pointer; }
        .clear-filter:hover { color: #ffd0ae; }

        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 12px; }
        .game-card {
            position: relative;
            min-width: 0;
            min-height: 194px;
            padding: 15px;
            overflow: hidden;
            background: linear-gradient(145deg, #231107, #190b05 75%);
            border: 1px solid #46200e;
            border-radius: 9px;
            transition: transform .18s ease, border-color .18s ease, background .18s ease;
            animation: reveal .28s both;
        }
        .game-card:hover { transform: translateY(-3px); background: #291308; border-color: #995021; }
        .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .game-art {
            display: grid;
            width: 43px;
            height: 43px;
            flex: 0 0 auto;
            place-items: center;
            color: #ffd0ad;
            background: linear-gradient(145deg, #a84618, #54200d);
            border: 1px solid #d76b2c66;
            border-radius: 9px;
            font: 700 22px 'Barlow Condensed', sans-serif;
        }
        .favorite-button {
            display: grid;
            width: 30px;
            height: 30px;
            place-items: center;
            color: #a77a60;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
        }
        .favorite-button:hover, .favorite-button.is-favorite { color: #ff8e4a; background: #3b190b; border-color: #6b3013; }
        .game-name { margin: 13px 0 5px; font: 700 21px/1.05 'Barlow Condensed', sans-serif; overflow-wrap: anywhere; }
        .game-description { display: -webkit-box; min-height: 34px; margin: 0; overflow: hidden; color: #b7957f; font-size: 10px; line-height: 1.55; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
        .card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
        .tag-list { display: flex; min-width: 0; gap: 5px; overflow: hidden; }
        .tag { max-width: 82px; overflow: hidden; padding: 4px 6px; color: #d49a70; background: #32190c; border-radius: 4px; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
        .play-link { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 6px; padding: 7px 9px; color: #ffb07a; background: #381a0b; border: 1px solid #713516; border-radius: 5px; font-size: 10px; font-weight: 700; text-decoration: none; }
        .play-link:hover { color: #210b02; background: var(--orange); }
        .game-grid.list-view { grid-template-columns: 1fr; gap: 7px; }
        .list-view .game-card { display: grid; min-height: 0; grid-template-columns: minmax(120px, 1.2fr) minmax(130px, 2fr) auto; align-items: center; gap: 16px; padding: 10px 14px; }
        .list-view .card-top { align-items: center; justify-content: flex-start; }
        .list-view .favorite-button { order: 2; margin-left: auto; }
        .list-view .game-name { margin: 0; }
        .list-view .game-description { min-height: 0; }
        .list-view .card-bottom { margin: 0; }
        .empty-state { grid-column: 1 / -1; padding: 54px 20px; color: #bd9278; background: #1a0c06; border: 1px dashed #6e3518; border-radius: 9px; text-align: center; }
        .empty-state i { display: block; margin-bottom: 12px; color: var(--orange); font-size: 24px; }
        .empty-state strong { display: block; margin-bottom: 5px; color: var(--text); font: 700 24px 'Barlow Condensed', sans-serif; }
        .empty-state span { font-size: 12px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        @keyframes reveal { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 960px) {
            :root { --sidebar-width: 210px; }
            .feature { min-height: 220px; padding: 25px; }
            .game-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }
        @media (max-width: 680px) {
            .sidebar {
                position: static;
                width: auto;
                padding: 12px 16px 10px;
                overflow: visible;
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }
            .brand { padding: 0 2px 12px; }
            .brand-mark { width: 34px; height: 34px; }
            .brand-name { font-size: 26px; }
            .sidebar .nav-label, .sidebar .sidebar-footer, .sidebar #categoryNav { display: none; }
            .sidebar .nav-list { display: flex; gap: 5px; overflow-x: auto; }
            .sidebar .nav-link { min-height: 36px; flex: 0 0 auto; gap: 8px; padding: 0 10px; font-size: 11px; }
            .sidebar .nav-link i { width: 14px; }
            .sidebar .nav-count { display: none; }
            .main { margin-left: 0; padding: 22px 16px 42px; }
            .topbar { align-items: flex-start; margin-bottom: 20px; }
            .page-title { font-size: 29px; }
            .library-total { display: none; }
            .feature { min-height: 250px; align-items: flex-start; flex-direction: column; justify-content: flex-end; gap: 18px; padding: 22px; }
            .feature-title { font-size: 45px; }
            .feature-description { font-size: 12px; }
            .feature-actions { width: 100%; }
            .toolbar { align-items: stretch; flex-direction: column; margin-top: 22px; }
            .search-box { width: 100%; }
            .toolbar-controls { justify-content: space-between; }
            .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
            .game-card { min-height: 190px; padding: 11px; }
            .game-name { font-size: 19px; }
            .list-view .game-card { grid-template-columns: minmax(90px, 1fr) minmax(90px, 1fr) auto; gap: 8px; padding: 9px; }
            .list-view .game-description { display: none; }
            .list-view .game-art { width: 34px; height: 34px; }
            .list-view .favorite-button { display: none; }
        }
        @media (max-width: 380px) {
            .game-grid { grid-template-columns: 1fr; }
            .game-card { min-height: 175px; }
            .list-view .game-card { grid-template-columns: 1fr auto; }
            .list-view .card-top { grid-column: 1; }
            .list-view .card-bottom { grid-column: 2; grid-row: 1; }
            .list-view .tag-list { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="Arcade navigation">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true"><i class="fa-solid fa-fire-flame-curved"></i></div>
                <div><div class="brand-name">FIRE</div><div class="brand-caption">ARCADE / PLAY</div></div>
            </div>
            <div class="nav-label">Your arcade</div>
            <nav class="nav-list" aria-label="Library views">
                <button class="nav-link active" data-view="all"><i class="fa-solid fa-border-all"></i><span>All games</span><span class="nav-count" id="allCount">0</span></button>
                <button class="nav-link" data-view="favorites"><i class="fa-solid fa-heart"></i><span>Favorites</span><span class="nav-count" id="favoriteCount">0</span></button>
                <button class="nav-link" data-view="recent"><i class="fa-solid fa-clock-rotate-left"></i><span>Recently played</span></button>
            </nav>
            <div class="nav-label">Browse by genre</div>
            <nav class="nav-list" id="categoryNav" aria-label="Game genres"></nav>
            <div class="sidebar-footer"><strong>FIRE</strong> Arcade <span aria-hidden="true">·</span> <span id="sidebarTotal">0</span> games</div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div><div class="eyebrow">Pick your next game</div><h1 class="page-title" id="sectionTitle">The arcade</h1></div>
                <div class="topbar-meta"><span class="library-total"><strong id="headerTotal">0</strong> games ready</span><a class="top-play" id="randomPlay" href="#"><i class="fa-solid fa-shuffle"></i> Surprise me</a></div>
            </header>

            <section class="feature" aria-labelledby="featureTitle">
                <div class="feature-copy">
                    <div class="feature-kicker"><i class="fa-solid fa-fire"></i> Featured pick</div>
                    <h2 class="feature-title" id="featureTitle">Loading the arcade...</h2>
                    <p class="feature-description" id="featureDescription">Your game library is on its way.</p>
                </div>
                <div class="feature-actions">
                    <a class="feature-play" id="featurePlay" href="#"><i class="fa-solid fa-play"></i> Play now</a>
                    <button class="feature-refresh" id="shuffleFeature" type="button" aria-label="Choose another featured game" title="Choose another featured game"><i class="fa-solid fa-arrows-rotate"></i></button>
                </div>
            </section>

            <section aria-label="Game library">
                <div class="toolbar">
                    <label class="search-box"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="gameSearch" type="search" placeholder="Search games, genres, or descriptions" autocomplete="off" aria-label="Search games"><span class="shortcut" aria-hidden="true">/</span></label>
                    <div class="toolbar-controls">
                        <label class="sr-only" for="sortGames">Sort games</label>
                        <select class="sort-select" id="sortGames"><option value="featured">Featured order</option><option value="az">Name: A to Z</option><option value="za">Name: Z to A</option><option value="recent">Recently played</option></select>
                        <div class="view-toggle" role="group" aria-label="Display mode"><button class="view-button active" type="button" data-layout="grid" aria-label="Grid view" title="Grid view"><i class="fa-solid fa-grip"></i></button><button class="view-button" type="button" data-layout="list" aria-label="List view" title="List view"><i class="fa-solid fa-list"></i></button></div>
                    </div>
                </div>
                <div class="result-line"><span id="resultSummary" aria-live="polite">Loading games...</span><button class="clear-filter" id="clearFilters" type="button" hidden>Clear filters <i class="fa-solid fa-xmark"></i></button></div>
                <div class="game-grid" id="gameGrid" aria-live="polite"></div>
            </section>
        </main>
    </div>

    <script src="games.js"></script>
    <script>
        (() => {
            const FAVORITES_KEY = 'fire-arcade-favorites';
            const RECENT_KEY = 'fire-arcade-recent';
            const gameGrid = document.getElementById('gameGrid');
            const searchInput = document.getElementById('gameSearch');
            const sortSelect = document.getElementById('sortGames');
            const categoryNav = document.getElementById('categoryNav');
            const navLinks = [...document.querySelectorAll('.nav-link')];
            const gamesLibrary = typeof games !== 'undefined' && Array.isArray(games)
                ? games.filter(game => game && typeof game.name === 'string' && typeof game.url === 'string')
                : [];
            let activeView = 'all';
            let activeCategory = '';
            let featuredIndex = 0;
            let layout = 'grid';
            let favorites = readStoredSet(FAVORITES_KEY);
            let recentGames = readStoredList(RECENT_KEY);

            function readStoredSet(key) {
                try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
                catch { return new Set(); }
            }

            function readStoredList(key) {
                try {
                    const value = JSON.parse(localStorage.getItem(key) || '[]');
                    return Array.isArray(value) ? value : [];
                } catch { return []; }
            }

            function saveStored(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); }
                catch { /* The library remains usable when storage is unavailable. */ }
            }

            function gameId(game) { return game.url; }

            function escapeHtml(value) {
                return String(value ?? '').replace(/[&<>"']/g, character => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                })[character]);
            }

            function gameHref(game) {
                const url = String(game.url || '');
                return /^(https?:\/\/|\/|\.\.?\/|#)/i.test(url) || !/^[a-z][a-z\d+.-]*:/i.test(url) ? url : '#';
            }

            function markPlayed(game) {
                recentGames = [gameId(game), ...recentGames.filter(id => id !== gameId(game))].slice(0, 30);
                saveStored(RECENT_KEY, recentGames);
            }

            function categories() {
                const counts = new Map();
                gamesLibrary.forEach(game => (Array.isArray(game.tags) ? game.tags : []).forEach(tag => {
                    const label = String(tag).trim().toLowerCase();
                    if (label) counts.set(label, (counts.get(label) || 0) + 1);
                }));
                return [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
            }

            function renderNavigation() {
                document.getElementById('allCount').textContent = gamesLibrary.length;
                document.getElementById('favoriteCount').textContent = favorites.size;
                document.getElementById('sidebarTotal').textContent = gamesLibrary.length;
                document.getElementById('headerTotal').textContent = gamesLibrary.length;
                categoryNav.innerHTML = categories().map(([tag, count]) => `
                    <button class="category-link${activeCategory === tag ? ' active' : ''}" type="button" data-category="${escapeHtml(tag)}">
                        <i class="fa-solid fa-hashtag"></i><span>${escapeHtml(tag)}</span><span class="nav-count">${count}</span>
                    </button>`).join('');
            }

            function chooseFeature() {
                if (!gamesLibrary.length) return;
                featuredIndex = Math.floor(Math.random() * gamesLibrary.length);
                const game = gamesLibrary[featuredIndex];
                document.getElementById('featureTitle').textContent = game.name;
                document.getElementById('featureDescription').textContent = game.description || 'Jump in and play.';
                const playLink = document.getElementById('featurePlay');
                playLink.href = gameHref(game);
                playLink.onclick = () => markPlayed(game);
            }

            function getVisibleGames() {
                const query = searchInput.value.trim().toLowerCase();
                let result = gamesLibrary.filter(game => {
                    const tags = Array.isArray(game.tags) ? game.tags.map(String) : [];
                    const matchesView = activeView === 'favorites' ? favorites.has(gameId(game))
                        : activeView === 'recent' ? recentGames.includes(gameId(game)) : true;
                    const matchesCategory = !activeCategory || tags.some(tag => tag.toLowerCase() === activeCategory);
                    const searchable = [game.name, game.description, ...tags].join(' ').toLowerCase();
                    return matchesView && matchesCategory && searchable.includes(query);
                });
                if (sortSelect.value === 'az') result.sort((a, b) => a.name.localeCompare(b.name));
                if (sortSelect.value === 'za') result.sort((a, b) => b.name.localeCompare(a.name));
                if (sortSelect.value === 'recent') result.sort((a, b) => {
                    const rank = game => {
                        const index = recentGames.indexOf(gameId(game));
                        return index < 0 ? Number.MAX_SAFE_INTEGER : index;
                    };
                    return rank(a) - rank(b);
                });
                if (activeView === 'recent' && sortSelect.value === 'featured') {
                    result.sort((a, b) => recentGames.indexOf(gameId(a)) - recentGames.indexOf(gameId(b)));
                }
                return result;
            }

            function renderGames() {
                const visibleGames = getVisibleGames();
                gameGrid.classList.toggle('list-view', layout === 'list');
                document.getElementById('resultSummary').innerHTML = `<strong>${visibleGames.length}</strong> of ${gamesLibrary.length} games`;
                document.getElementById('clearFilters').hidden = !(searchInput.value || activeCategory || activeView !== 'all');
                if (!visibleGames.length) {
                    const noGames = gamesLibrary.length === 0;
                    gameGrid.innerHTML = `<div class="empty-state"><i class="fa-solid ${noGames ? 'fa-triangle-exclamation' : 'fa-magnifying-glass'}"></i><strong>${noGames ? 'Game list unavailable' : 'Nothing here yet'}</strong><span>${noGames ? 'Check that games.js is available and contains game entries.' : 'Try another search or clear your filters.'}</span></div>`;
                    return;
                }
                gameGrid.innerHTML = visibleGames.map((game, index) => {
                    const id = gameId(game);
                    const tags = Array.isArray(game.tags) ? game.tags : [];
                    const isFavorite = favorites.has(id);
                    return `<article class="game-card" style="animation-delay:${Math.min(index, 12) * 22}ms">
                        <div class="card-top">
                            <div class="game-art" aria-hidden="true">${escapeHtml(game.name.trim().charAt(0).toUpperCase() || 'G')}</div>
                            <button class="favorite-button${isFavorite ? ' is-favorite' : ''}" type="button" data-favorite="${escapeHtml(id)}" aria-label="${isFavorite ? 'Remove from' : 'Add to'} favorites" aria-pressed="${isFavorite}" title="${isFavorite ? 'Remove from' : 'Add to'} favorites"><i class="fa-${isFavorite ? 'solid' : 'regular'} fa-heart"></i></button>
                        </div>
                        <h2 class="game-name">${escapeHtml(game.name)}</h2>
                        <p class="game-description">${escapeHtml(game.description || 'Jump in and play.')}</p>
                        <div class="card-bottom"><div class="tag-list">${tags.slice(0, 2).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}</div><a class="play-link" href="${escapeHtml(gameHref(game))}" data-play="${escapeHtml(id)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-play"></i> Play</a></div>
                    </article>`;
                }).join('');
            }

            function setView(view) {
                activeView = view;
                activeCategory = '';
                navLinks.forEach(link => link.classList.toggle('active', link.dataset.view === view));
                const titles = { all: 'The arcade', favorites: 'Your favorites', recent: 'Recently played' };
                document.getElementById('sectionTitle').textContent = titles[view] || 'The arcade';
                renderNavigation();
                renderGames();
            }

            document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => setView(button.dataset.view)));
            categoryNav.addEventListener('click', event => {
                const button = event.target.closest('[data-category]');
                if (!button) return;
                activeView = 'all';
                activeCategory = activeCategory === button.dataset.category ? '' : button.dataset.category;
                navLinks.forEach(link => link.classList.toggle('active', link.dataset.view === 'all' && !activeCategory));
                document.getElementById('sectionTitle').textContent = activeCategory ? `${activeCategory} games` : 'The arcade';
                renderNavigation();
                renderGames();
            });
            gameGrid.addEventListener('click', event => {
                const favoriteButton = event.target.closest('[data-favorite]');
                if (favoriteButton) {
                    const id = favoriteButton.dataset.favorite;
                    if (favorites.has(id)) favorites.delete(id);
                    else favorites.add(id);
                    saveStored(FAVORITES_KEY, [...favorites]);
                    renderNavigation();
                    renderGames();
                    return;
                }
                const playLink = event.target.closest('[data-play]');
                if (playLink) {
                    const game = gamesLibrary.find(item => gameId(item) === playLink.dataset.play);
                    if (game) markPlayed(game);
                }
            });
            searchInput.addEventListener('input', renderGames);
            sortSelect.addEventListener('change', renderGames);
            document.getElementById('clearFilters').addEventListener('click', () => {
                searchInput.value = '';
                activeCategory = '';
                setView('all');
            });
            document.querySelectorAll('[data-layout]').forEach(button => button.addEventListener('click', () => {
                layout = button.dataset.layout;
                document.querySelectorAll('[data-layout]').forEach(item => item.classList.toggle('active', item === button));
                renderGames();
            }));
            document.getElementById('shuffleFeature').addEventListener('click', chooseFeature);
            document.getElementById('randomPlay').addEventListener('click', event => {
                if (!gamesLibrary.length) { event.preventDefault(); return; }
                const game = gamesLibrary[Math.floor(Math.random() * gamesLibrary.length)];
                event.currentTarget.href = gameHref(game);
                markPlayed(game);
            });
            document.addEventListener('keydown', event => {
                if (event.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                    event.preventDefault();
                    searchInput.focus();
                }
                if (event.key === 'Escape' && document.activeElement === searchInput) {
                    searchInput.value = '';
                    searchInput.blur();
                    renderGames();
                }
            });

            renderNavigation();
            chooseFeature();
            renderGames();
        })();
    </script>
</body>
</html>
