<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FIRE · Folder‑Based Game Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0e0500, #030100);
            min-height: 100vh;
            display: flex;
            color: #fff0e0;
            overflow-x: hidden;
        }

        /* ========= SIDEBAR ========= */
        .sidebar {
            width: 280px;
            background: rgba(20, 6, 0, 0.92);
            backdrop-filter: blur(12px);
            height: 100vh;
            position: sticky;
            top: 0;
            border-right: 1px solid rgba(255, 80, 0, 0.5);
            transition: width 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            overflow-y: auto;
            z-index: 10;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.6);
        }

        .sidebar.collapsed {
            width: 82px;
        }

        .sidebar-header {
            padding: 26px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 2px solid #ff5e1a;
            margin-bottom: 12px;
        }

        .logo-icon {
            color: #ff7b2c;
            font-size: 32px;
            filter: drop-shadow(0 0 6px #ff6a00);
        }

        .logo-text {
            font-weight: 800;
            font-size: 28px;
            background: linear-gradient(145deg, #ffb259, #ff4d00);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .toggle-btn {
            background: rgba(255, 85, 0, 0.2);
            border: 1px solid #ff7b2c;
            color: #ffa359;
            font-size: 18px;
            cursor: pointer;
            margin-left: auto;
            width: 34px;
            height: 34px;
            border-radius: 40px;
            transition: 0.2s;
        }

        .toggle-btn:hover {
            background: #ff6a00;
            color: #1f0a00;
        }

        .sidebar-menu .menu-title {
            padding: 24px 20px 8px 20px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff9f60;
            font-weight: 600;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 20px;
            color: #ffcfaa;
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: 0.2s;
            margin: 4px 8px;
            border-radius: 14px;
        }

        .menu-item i {
            width: 26px;
            font-size: 1.25rem;
            text-align: center;
        }

        .menu-item:hover,
        .menu-item.active {
            background: #ff4d1c20;
            border-left-color: #ff7b2c;
            color: #ffb56b;
            backdrop-filter: blur(4px);
        }

        .sidebar.collapsed .menu-text,
        .sidebar.collapsed .menu-title {
            display: none;
        }

        /* ========= MAIN LAYOUT ========= */
        .main-content {
            flex: 1;
            padding: 28px 32px;
            transition: all 0.2s;
        }

        /* header area */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(255, 90, 20, 0.6);
        }

        .title-section h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffbc6e, #ff5e00);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .title-section h1 i {
            background: none;
            -webkit-text-fill-color: #ff7b2c;
            font-size: 2rem;
        }

        .game-stats {
            background: #2f1402;
            padding: 6px 18px;
            border-radius: 80px;
            font-weight: 500;
            border: 1px solid #ff8740;
            font-size: 0.9rem;
            backdrop-filter: blur(2px);
        }

        /* search panel */
        .search-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
            background: rgba(30, 10, 0, 0.7);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 80px;
            border: 1px solid #ff7020;
        }

        .search-wrapper {
            flex: 2;
            min-width: 220px;
            display: flex;
            align-items: center;
            background: #1f0b00;
            border-radius: 60px;
            padding: 4px 8px 4px 20px;
            border: 1px solid #ff9542;
            transition: 0.2s;
        }

        .search-wrapper:focus-within {
            border-color: #ffbc6e;
            box-shadow: 0 0 12px #ff5e1a40;
        }

        .search-wrapper i {
            color: #ff9f50;
            font-size: 1rem;
        }

        .search-wrapper input {
            background: transparent;
            border: none;
            padding: 12px 12px;
            width: 100%;
            color: #ffecd9;
            font-weight: 500;
            outline: none;
            font-size: 1rem;
        }

        .search-wrapper input::placeholder {
            color: #b5713a;
            font-weight: 400;
        }

        .clear-search {
            background: #3d1a00;
            border: none;
            color: #ffb27a;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clear-search:hover {
            background: #ff6a00;
            color: #1f0a00;
            border-color: #ffb56b;
        }

        /* GAME GRID - clean cards, no tags/desc */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 8px;
        }

        .game-card {
            background: linear-gradient(145deg, #261002, #170600);
            border-radius: 32px;
            padding: 0;
            border: 1px solid rgba(255, 100, 20, 0.5);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            overflow: hidden;
            backdrop-filter: blur(2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: #ff884d;
            box-shadow: 0 24px 30px -12px #ff4d1a30;
        }

        .card-inner {
            padding: 26px 22px 22px 22px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .game-icon-area {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 20px;
        }

        .game-avatar {
            width: 58px;
            height: 58px;
            background: linear-gradient(145deg, #ff6a1a, #bc3a00);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 28px;
            color: #281000;
            box-shadow: 0 6px 0 #6f2e00;
            transition: 0.2s;
        }

        .game-card:hover .game-avatar {
            transform: scale(1.02);
            background: linear-gradient(145deg, #ff852f, #e04b00);
        }

        .game-name {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(125deg, #ffcf9a, #ff9a42);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            flex: 1;
        }

        .launch-btn {
            background: linear-gradient(95deg, #ff5e1a, #c23b00);
            border: none;
            border-radius: 60px;
            padding: 14px 0;
            color: #210c00;
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            margin-top: 20px;
            border-bottom: 3px solid #964000;
            width: 100%;
        }

        .launch-btn i {
            font-size: 1.1rem;
        }

        .launch-btn:hover {
            background: linear-gradient(95deg, #ff7a38, #e35100);
            border-bottom-width: 2px;
            transform: translateY(-2px);
            gap: 16px;
        }

        .empty-message {
            grid-column: 1/-1;
            text-align: center;
            padding: 70px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 48px;
            font-size: 1.4rem;
            font-weight: 500;
            color: #ffaa70;
            border: 1px dashed #ff7a2f;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #2f1400;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff6a2e;
            border-radius: 8px;
        }

        @media (max-width: 700px) {
            .main-content {
                padding: 18px;
            }
            .game-name {
                font-size: 1.5rem;
            }
            .search-panel {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i class="fas fa-fire-flame-curved"></i></div>
            <div class="logo-text">FIRE</div>
            <button class="toggle-btn" id="toggleSidebar"><i class="fas fa-bars"></i></button>
        </div>
        <div class="sidebar-menu">
            <div class="menu-title">IGNITE</div>
            <a href="#" class="menu-item active"><i class="fas fa-compass"></i><span class="menu-text">Arcade</span></a>
            <a href="#" class="menu-item"><i class="fas fa-crown"></i><span class="menu-text">Hall of flame</span></a>
            <a href="#" class="menu-item"><i class="fas fa-folder-open"></i><span class="menu-text">Auto library</span></a>
            <div class="menu-title">essentials</div>
            <a href="#" class="menu-item"><i class="fas fa-bolt"></i><span class="menu-text">Instant play</span></a>
            <a href="#" class="menu-item"><i class="fas fa-fire"></i><span class="menu-text">Hot picks</span></a>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="title-section">
                <h1><i class="fas fa-gamepad"></i> AUTO·GAME HUB</h1>
            </div>
            <div class="game-stats" id="gameCounter">
                <i class="fas fa-dice-d6"></i> <span id="totalGamesCount">0</span> titles
            </div>
        </div>

        <div class="search-panel">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="gameSearchInput" placeholder="Search by folder‑based name ..." autocomplete="off">
            </div>
            <button class="clear-search" id="resetSearchBtn"><i class="fas fa-times-circle"></i> Clear</button>
        </div>

        <div id="gameContainer" class="game-grid"></div>
    </div>

    <script src="games.js"></script>
    <script>
        (function() {
            // --------------------------------------------------------------
            // NEW: Auto‑naming based on the **FOLDER** that contains the game file
            // --------------------------------------------------------------
            function getFolderNameFromUrl(url) {
                if (!url || url === "#") return "Ember Game";
                try {
                    // remove query/hash
                    let cleanUrl = url.split('?')[0].split('#')[0];
                    // split by '/'
                    let segments = cleanUrl.split('/').filter(seg => seg.length > 0);
                    if (segments.length === 0) return "Arcade Fire";
                    
                    // If the last segment looks like a file (contains a dot and is not a directory)
                    let lastSeg = segments[segments.length - 1];
                    let isFile = lastSeg.includes('.') && !lastSeg.endsWith('/');
                    
                    if (isFile) {
                        // if there is a preceding folder, use that folder name
                        if (segments.length >= 2) {
                            let folderCandidate = segments[segments.length - 2];
                            return formatName(folderCandidate);
                        } else {
                            // fallback: use filename without extension
                            let nameWithoutExt = lastSeg.replace(/\.[^/.]+$/, "");
                            return formatName(nameWithoutExt);
                        }
                    } else {
                        // last segment is a folder name (or trailing slash)
                        let folderName = segments[segments.length - 1];
                        return formatName(folderName);
                    }
                } catch(e) {
                    return "Blaze";
                }
            }

            function formatName(raw) {
                if (!raw) return "Inferno";
                // replace dashes, underscores, dots with spaces
                let cleaned = raw.replace(/[-_\.]+/g, ' ');
                // title case each word
                let titled = cleaned.split(' ').map(word => {
                    if (word.length === 0) return '';
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                }).join(' ');
                return titled.trim() || "Flame Runner";
            }

            // --------------------------------------------------------------
            // Load games from games.js, remove descriptions & tags
            // --------------------------------------------------------------
            let gamesLibrary = [];
            
            function loadGamesData() {
                if (typeof games !== 'undefined' && Array.isArray(games) && games.length > 0) {
                    gamesLibrary = [...games];
                } else {
                    // fallback demo data (simulating folder-based structure)
                    gamesLibrary = [
                        { url: "games/cyber-dash/index.html" },
                        { url: "games/ember_clash/launch.html" },
                        { url: "games/neon-drifter/game.html" },
                        { url: "games/blazing-kart/start.html" },
                        { url: "games/void-runner.html" } // file in root (folder fallback)
                    ];
                }
                // Build final game objects: only url and autoName (no desc, tags)
                const enhanced = gamesLibrary.map(game => ({
                    url: game.url || "#",
                    autoName: getFolderNameFromUrl(game.url)
                }));
                return enhanced;
            }

            let currentGames = [];
            let searchTerm = '';

            const container = document.getElementById('gameContainer');
            const searchInput = document.getElementById('gameSearchInput');
            const resetBtn = document.getElementById('resetSearchBtn');
            const totalSpan = document.getElementById('totalGamesCount');

            function renderGames() {
                if (!currentGames.length) {
                    container.innerHTML = `<div class="empty-message"><i class="fas fa-fire"></i> No games found · check games.js<br><span style="font-size:0.9rem;">Folder‑based naming active</span></div>`;
                    if(totalSpan) totalSpan.innerText = '0';
                    return;
                }
                
                let filtered = currentGames.filter(game => 
                    game.autoName.toLowerCase().includes(searchTerm.toLowerCase())
                );
                
                if(totalSpan) totalSpan.innerText = filtered.length;
                
                if (filtered.length === 0) {
                    container.innerHTML = `<div class="empty-message"><i class="fas fa-search"></i> No matches for “${escapeHtml(searchTerm)}” <br> 🔥 try a different keyword</div>`;
                    return;
                }
                
                let html = '';
                for (let game of filtered) {
                    const firstLetter = game.autoName.charAt(0).toUpperCase() || 'G';
                    const launchUrl = game.url && game.url !== '#' ? game.url : '#';
                    html += `
                        <div class="game-card">
                            <div class="card-inner">
                                <div class="game-icon-area">
                                    <div class="game-avatar">${escapeHtml(firstLetter)}</div>
                                    <div class="game-name">${escapeHtml(game.autoName)}</div>
                                </div>
                                <a href="${escapeHtml(launchUrl)}" class="launch-btn" target="_blank" rel="noopener noreferrer">
                                    <i class="fas fa-play"></i> LAUNCH GAME
                                </a>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            }
            
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
            
            function handleSearch() {
                searchTerm = searchInput.value.trim();
                renderGames();
            }
            
            function resetAll() {
                searchTerm = '';
                searchInput.value = '';
                renderGames();
            }
            
            function init() {
                currentGames = loadGamesData();
                renderGames();
                searchInput.addEventListener('input', handleSearch);
                resetBtn.addEventListener('click', resetAll);
            }
            
            // sidebar toggle
            const toggleBtn = document.getElementById('toggleSidebar');
            const sidebar = document.getElementById('sidebar');
            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                    const icon = toggleBtn.querySelector('i');
                    if (sidebar.classList.contains('collapsed')) {
                        icon.classList.remove('fa-bars');
                        icon.classList.add('fa-chevron-right');
                    } else {
                        icon.classList.remove('fa-chevron-right');
                        icon.classList.add('fa-bars');
                    }
                });
            }
            
            init();
        })();
    </script>
</body>
</html>
