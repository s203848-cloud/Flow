<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Checker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: rgba(20, 20, 35, 0.8);
    border-bottom: 1px solid rgba(255, 69, 0, 0.2);
    margin-bottom: 30px;
    border-radius: 10px;
}

.back-btn {
    padding: 8px 15px;
    background: rgba(255, 128, 0, 0.2);
    border: 1px solid #ff8000;
    border-radius: 5px;
    color: #ff8000;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s;
}

.back-btn:hover {
    background: rgba(255, 128, 0, 0.3);
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

.section {
    background: rgba(20, 20, 35, 0.5);
    border: 1px solid rgba(255, 69, 0, 0.2);
    border-radius: 10px;
    padding: 25px;
    margin-bottom: 25px;
}

textarea {
    width: 100%;
    min-height: 200px;
    padding: 15px;
    background: rgba(50, 50, 70, 0.4);
    border: 1px solid rgba(255, 128, 0, 0.3);
    border-radius: 8px;
    color: #fff;
    resize: vertical;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
}

textarea::placeholder {
    color: #888;
}

.btn {
    padding: 12px 25px;
    background: linear-gradient(to right, #ff7e00, #ff4500);
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 15px;
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255, 69, 0, 0.4);
}

.btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none !important;
}

.results {
    background: rgba(50, 50, 70, 0.3);
    border: 1px solid rgba(255, 128, 0, 0.3);
    border-radius: 8px;
    padding: 20px;
    margin-top: 20px;
    display: none;
}

.results.show {
    display: block;
}

.result-item {
    background: rgba(0, 0, 0, 0.3);
    padding: 15px;
    border-radius: 5px;
    margin-bottom: 12px;
    border-left: 3px solid #ff8000;
    transition: transform 0.2s;
}

.result-item:hover {
    transform: translateX(5px);
}

.result-label {
    color: #ff8000;
    font-weight: bold;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
}

.result-text {
    color: #ddd;
    margin-top: 8px;
    line-height: 1.4;
}

.stats {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    padding: 15px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 8px;
}

.stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 20px;
    background: rgba(255, 128, 0, 0.1);
    border-radius: 6px;
    min-width: 100px;
}

.stat-value {
    font-size: 28px;
    font-weight: bold;
    color: #ff8000;
}

.stat-label {
    font-size: 14px;
    color: #aaa;
    margin-top: 5px;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #ff8000;
}

.loading i {
    font-size: 40px;
    margin-bottom: 15px;
}

.api-selector {
    margin-top: 20px;
    padding: 15px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 8px;
}

.api-selector label {
    display: block;
    margin-bottom: 10px;
    color: #aaa;
}

.api-selector select {
    padding: 8px 15px;
    background: rgba(50, 50, 70, 0.4);
    border: 1px solid rgba(255, 128, 0, 0.3);
    border-radius: 5px;
    color: white;
    width: 100%;
    font-size: 16px;
}

.error-counts {
    display: flex;
    gap: 15px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.error-count {
    padding: 8px 15px;
    background: rgba(255, 69, 0, 0.1);
    border-radius: 20px;
    font-size: 14px;
}

.typing-indicator {
    color: #4caf50;
    font-size: 14px;
    margin-top: 10px;
    display: none;
}
    </style>
</head>
<body>
    <div class="navbar">
        <a href="../tools-list.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <span style="font-size: 1.5rem; font-weight: bold;">Grammar Checker</span>
        <div style="width: 60px;"></div>
    </div>

    <div class="container">
        <div class="section">
            <h2 style="margin-bottom: 15px;"><i class="fas fa-spell-check"></i> Check Your Text</h2>
            <div class="api-selector">
                <label for="apiMode"><i class="fas fa-cog"></i> Checking Method(Tip: You should change to LanguageTool API (Online)) :</label>
                <select id="apiMode">
                    <option value="simulated">Simulated Check (Local)</option>
                    <option value="languagetool">LanguageTool API (Online)</option>
                    <option value="browser">Browser Spell Check</option>
                </select>
            </div>
            <textarea id="textInput" placeholder="Paste your text here to check for grammar and spelling errors...

Example: 'Your going to love there new house. Its very beutiful and they're very happy with it. We should of gone yesterday.'" spellcheck="false"></textarea>
            <div class="typing-indicator" id="typingIndicator">
                <i class="fas fa-keyboard"></i> Detecting errors in real-time...
            </div>
            <button class="btn" onclick="checkGrammar()" id="checkBtn">
                <i class="fas fa-check"></i> Check Grammar
            </button>
            <button class="btn" onclick="clearText()" style="background: rgba(255, 69, 0, 0.3); margin-left: 10px;">
                <i class="fas fa-trash"></i> Clear
            </button>
        </div>

        <div class="results" id="results">
            <h2 style="margin-bottom: 20px; color: #ff8000;"><i class="fas fa-exclamation-circle"></i> Results</h2>
            <div class="stats" id="stats">
                <div class="stat">
                    <div class="stat-value" id="totalErrors">0</div>
                    <div class="stat-label">Total Errors</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="grammarErrors">0</div>
                    <div class="stat-label">Grammar</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="spellingErrors">0</div>
                    <div class="stat-label">Spelling</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="score">100%</div>
                    <div class="stat-label">Score</div>
                </div>
            </div>
            <div class="error-counts" id="errorCounts"></div>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        // Enhanced error patterns with better matching
        const errorPatterns = [
            // Grammar errors
            {pattern: /\byour\s+(going|coming|doing|trying|thinking|feeling)\b/gi, suggestion: 'Change "your" to "you\'re" (you are)', type: 'Grammar', category: 'Common Mistake'},
            {pattern: /\byou're\s+(book|car|house|dog|cat|phone|computer)\b/gi, suggestion: 'Change "you\'re" to "your" (possession)', type: 'Grammar', category: 'Common Mistake'},
            {pattern: /\btheir\s+(is|are|was|were)\b/gi, suggestion: 'Change "their" to "there" (location/existence)', type: 'Grammar', category: 'Common Mistake'},
            {pattern: /\bthere\s+(book|car|house|dog)\b/gi, suggestion: 'Change "there" to "their" (possession)', type: 'Grammar', category: 'Common Mistake'},
            {pattern: /\bthey're\s+(book|car|house|dog)\b/gi, suggestion: 'Change "they\'re" to "their" (possession)', type: 'Grammar', category: 'Common Mistake'},
            {pattern: /\bshould\s+of\b/gi, suggestion: 'Change "should of" to "should have"', type: 'Grammar', category: 'Verb Tense'},
            {pattern: /\bcould\s+of\b/gi, suggestion: 'Change "could of" to "could have"', type: 'Grammar', category: 'Verb Tense'},
            {pattern: /\bwould\s+of\b/gi, suggestion: 'Change "would of" to "would have"', type: 'Grammar', category: 'Verb Tense'},
            {pattern: /\b(?:dont|doesnt|didnt|wont|cant|shouldnt|couldnt|wouldnt|isnt|arent|wasnt|werent)\b/gi, suggestion: 'Add apostrophe (don\'t, doesn\'t, etc.)', type: 'Grammar', category: 'Punctuation'},
            {pattern: /\bit's\s+(book|car|house|dog|cat)\b/gi, suggestion: 'Change "it\'s" to "its" (possession)', type: 'Grammar', category: 'Punctuation'},
            {pattern: /\bits\s+(is|was|has|had|will)\b/gi, suggestion: 'Change "its" to "it\'s" (it is/has)', type: 'Grammar', category: 'Punctuation'},
            
            // Spelling errors
            {pattern: /\balot\b/gi, suggestion: 'Change "alot" to "a lot"', type: 'Spelling', category: 'Common Misspelling'},
            {pattern: /\bbeutif(ul|iful)\b/gi, suggestion: 'Change "beutiful" to "beautiful"', type: 'Spelling', category: 'Common Misspelling'},
            {pattern: /\brecieve\b/gi, suggestion: 'Change "recieve" to "receive" (i before e except after c)', type: 'Spelling', category: 'Common Misspelling'},
            {pattern: /\bseperate\b/gi, suggestion: 'Change "seperate" to "separate"', type: 'Spelling', category: 'Common Misspelling'},
            {pattern: /\bdefinately\b/gi, suggestion: 'Change "definately" to "definitely"', type: 'Spelling', category: 'Common Misspelling'},
            {pattern: /\boccured\b/gi, suggestion: 'Change "occured" to "occurred"', type: 'Spelling', category: 'Common Misspelling'},
            {pattern: /\btomm?orow\b/gi, suggestion: 'Change "tomorrow" spelling', type: 'Spelling', category: 'Common Misspelling'},
            {pattern: /\bwierd\b/gi, suggestion: 'Change "wierd" to "weird"', type: 'Spelling', category: 'Common Misspelling'},
            {pattern: /\bacheive\b/gi, suggestion: 'Change "acheive" to "achieve"', type: 'Spelling', category: 'Common Misspelling'},
            
            // Style suggestions
            {pattern: /\ba lot\b/gi, suggestion: 'Consider using "many", "much", or "often" instead', type: 'Style', category: 'Word Choice'},
            {pattern: /\bvery\s+\w+\b/gi, suggestion: 'Try using a stronger adjective instead of "very"', type: 'Style', category: 'Word Choice'},
            {pattern: /\breally\s+\w+\b/gi, suggestion: 'Consider removing "really" for conciseness', type: 'Style', category: 'Word Choice'},
            {pattern: /\bget\s+\w+\b/gi, suggestion: 'Consider using "obtain", "receive", or "become"', type: 'Style', category: 'Word Choice'},
            
            // Punctuation
            {pattern: /\.{4,}/g, suggestion: 'Use three dots for ellipsis (...)', type: 'Punctuation', category: 'Ellipsis'},
            {pattern: /\s+\./g, suggestion: 'Remove space before period', type: 'Punctuation', category: 'Spacing'},
            {pattern: /\?{2,}/g, suggestion: 'Use only one question mark', type: 'Punctuation', category: 'Repetition'},
            {pattern: /!{2,}/g, suggestion: 'Use only one exclamation mark', type: 'Punctuation', category: 'Repetition'}
        ];

        let typingTimer;
        const typingDelay = 1000; // 1 second delay after typing

        document.getElementById('textInput').addEventListener('input', function() {
            document.getElementById('typingIndicator').style.display = 'block';
            clearTimeout(typingTimer);
            
            if (this.value.trim().length > 10) {
                typingTimer = setTimeout(() => {
                    document.getElementById('typingIndicator').style.display = 'none';
                    if (document.getElementById('apiMode').value === 'simulated') {
                        checkGrammar();
                    }
                }, typingDelay);
            } else {
                document.getElementById('typingIndicator').style.display = 'none';
            }
        });

        async function checkGrammar() {
            const text = document.getElementById('textInput').value.trim();
            const apiMode = document.getElementById('apiMode').value;
            const checkBtn = document.getElementById('checkBtn');
            
            if (!text) {
                alert('Please enter text to check');
                return;
            }

            checkBtn.disabled = true;
            checkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';
            
            let results = [];
            
            if (apiMode === 'simulated') {
                results = simulatedCheck(text);
            } else if (apiMode === 'languagetool') {
                results = await languageToolCheck(text);
            } else if (apiMode === 'browser') {
                results = browserSpellCheck(text);
            }
            
            displayResults(results);
            checkBtn.disabled = false;
            checkBtn.innerHTML = '<i class="fas fa-check"></i> Check Grammar';
        }

        function simulatedCheck(text) {
            const results = [];
            const foundErrors = new Set(); // Avoid duplicates
            
            errorPatterns.forEach(error => {
                const matches = text.matchAll(error.pattern);
                for (const match of matches) {
                    const errorKey = `${match[0]}-${match.index}`;
                    if (!foundErrors.has(errorKey)) {
                        foundErrors.add(errorKey);
                        results.push({
                            text: match[0],
                            suggestion: error.suggestion,
                            type: error.type,
                            category: error.category,
                            position: match.index,
                            context: getContext(text, match.index, match[0].length)
                        });
                    }
                }
            });
            
            // Additional checks
            checkCapitalization(text, results);
            checkSentenceLength(text, results);
            
            return results;
        }

        async function languageToolCheck(text) {
            try {
                // LanguageTool Public API (free, no key required)
                const response = await fetch('https://api.languagetool.org/v2/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        text: text,
                        language: 'en-US',
                        enabledOnly: 'false'
                    })
                });
                
                if (!response.ok) throw new Error('API request failed');
                
                const data = await response.json();
                const results = [];
                
                data.matches.forEach(match => {
                    results.push({
                        text: match.context.text.substring(match.context.offset, match.context.offset + match.context.length),
                        suggestion: match.replacements?.[0]?.value || 'Consider rephrasing',
                        type: match.rule.category.name,
                        category: match.rule.issueType,
                        position: match.offset,
                        context: match.context.text
                    });
                });
                
                return results;
            } catch (error) {
                console.error('LanguageTool API error:', error);
                alert('LanguageTool API is currently unavailable. Using simulated check instead.');
                return simulatedCheck(text);
            }
        }

        function browserSpellCheck(text) {
            // This is a simplified browser-based check
            const results = [];
            const words = text.split(/\s+/);
            
            words.forEach((word, index) => {
                // Simple spelling check - looking for common misspellings
                const commonMisspellings = {
                    'recieve': 'receive',
                    'wierd': 'weird',
                    'definately': 'definitely',
                    'seperate': 'separate',
                    'occured': 'occurred',
                    'tommorow': 'tomorrow',
                    'tomorow': 'tomorrow',
                    'beleive': 'believe',
                    'neccessary': 'necessary',
                    'occassion': 'occasion'
                };
                
                const cleanWord = word.replace(/[^\w]/g, '').toLowerCase();
                if (commonMisspellings[cleanWord]) {
                    results.push({
                        text: word,
                        suggestion: `Change "${word}" to "${commonMisspellings[cleanWord]}"`,
                        type: 'Spelling',
                        category: 'Common Misspelling',
                        position: text.indexOf(word)
                    });
                }
            });
            
            return results;
        }

        function checkCapitalization(text, results) {
            const sentences = text.split(/(?<=[.!?])\s+/);
            sentences.forEach((sentence, index) => {
                if (sentence.trim() && !/^[A-Z"']/.test(sentence)) {
                    results.push({
                        text: sentence.substring(0, 30) + (sentence.length > 30 ? '...' : ''),
                        suggestion: 'Sentence should start with a capital letter',
                        type: 'Capitalization',
                        category: 'Sentence Start',
                        position: text.indexOf(sentence)
                    });
                }
            });
        }

        function checkSentenceLength(text, results) {
            const sentences = text.split(/[.!?]+/);
            sentences.forEach(sentence => {
                const words = sentence.trim().split(/\s+/);
                if (words.length > 40) {
                    results.push({
                        text: sentence.substring(0, 50) + '...',
                        suggestion: 'Sentence is very long. Consider breaking it into shorter sentences.',
                        type: 'Style',
                        category: 'Readability',
                        position: text.indexOf(sentence)
                    });
                }
            });
        }

        function getContext(text, position, length) {
            const start = Math.max(0, position - 30);
            const end = Math.min(text.length, position + length + 30);
            let context = text.substring(start, end);
            
            if (start > 0) context = '...' + context;
            if (end < text.length) context = context + '...';
            
            return context;
        }

        function displayResults(results) {
            const resultsList = document.getElementById('resultsList');
            const stats = document.getElementById('stats');
            const errorCounts = document.getElementById('errorCounts');
            
            if (results.length === 0) {
                resultsList.innerHTML = `
                    <div class="result-item" style="border-left-color: #4caf50;">
                        <div class="result-label" style="color: #4caf50;">
                            <i class="fas fa-check-circle"></i> No errors found!
                        </div>
                        <div class="result-text">Your text looks good! Keep up the great writing.</div>
                    </div>
                `;
                document.getElementById('totalErrors').textContent = '0';
                document.getElementById('grammarErrors').textContent = '0';
                document.getElementById('spellingErrors').textContent = '0';
                document.getElementById('score').textContent = '100%';
                errorCounts.innerHTML = '';
            } else {
                // Group by category
                const categories = {};
                const typeCounts = {
                    'Grammar': 0,
                    'Spelling': 0,
                    'Style': 0,
                    'Punctuation': 0,
                    'Capitalization': 0
                };
                
                results.forEach(result => {
                    if (!categories[result.category]) {
                        categories[result.category] = [];
                    }
                    categories[result.category].push(result);
                    typeCounts[result.type] = (typeCounts[result.type] || 0) + 1;
                });
                
                // Display results by category
                let html = '';
                for (const [category, errors] of Object.entries(categories)) {
                    html += `<h3 style="margin: 20px 0 10px 0; color: #ffa500;">${category} (${errors.length})</h3>`;
                    html += errors.map(r => `
                        <div class="result-item">
                            <div class="result-label">
                                <i class="fas fa-exclamation-triangle"></i>
                                ${r.type}: "${r.text}"
                            </div>
                            <div class="result-text">💡 ${r.suggestion}</div>
                            ${r.context ? `<div style="color: #888; font-size: 0.9rem; margin-top: 5px; font-style: italic;">Context: "${r.context}"</div>` : ''}
                        </div>
                    `).join('');
                }
                
                resultsList.innerHTML = html;
                
                // Update stats
                const totalErrors = results.length;
                document.getElementById('totalErrors').textContent = totalErrors;
                document.getElementById('grammarErrors').textContent = typeCounts['Grammar'] || 0;
                document.getElementById('spellingErrors').textContent = typeCounts['Spelling'] || 0;
                
                // Calculate score (100 - errors * 2, min 0)
                const score = Math.max(0, 100 - (totalErrors * 2));
                document.getElementById('score').textContent = `${score}%`;
                
                // Display error counts by category
                errorCounts.innerHTML = Object.entries(categories)
                    .map(([cat, items]) => 
                        `<div class="error-count">${cat}: ${items.length}</div>`
                    )
                    .join('');
            }
            
            document.getElementById('results').classList.add('show');
            stats.style.display = 'flex';
        }

        function clearText() {
            document.getElementById('textInput').value = '';
            document.getElementById('results').classList.remove('show');
            document.getElementById('resultsList').innerHTML = '';
            document.getElementById('typingIndicator').style.display = 'none';
        }

        // Initialize with example text
        window.onload = function() {
            const exampleText = "Your going to love there new house. Its very beutiful and they're very happy with it. We should of gone yesterday but we didnt have time. Tommorow we will definately visit them. I recieved there message and its very nice to here from them.";
            document.getElementById('textInput').value = exampleText;
        };
    </script>
</body>
</html>
